function renderHome(){let tomorrow=S.flights.filter(f=>f.day===S.day&&f.status==='Programmé'),done=S.flights.filter(f=>f.status==='Réalisé').length,open=S.routes.filter(r=>r.status==='Ouverte').length,monthly=S.people.filter(p=>p.status==='Actif').reduce((n,p)=>n+p.salary,0),lease=S.fleet.reduce((n,a)=>n+a.monthlyLease,0);let topFlights=tomorrow.slice(0,6);let tx=S.transactions.slice(0,7);let routes=S.routes.slice(0,4);return pageHead('Présidence · centre de contrôle',`Bonjour, ${esc(S.company.name)}`,`Votre compagnie au jour ${S.day} de la simulation. Pilotez les opérations, la trésorerie et la croissance depuis un poste de direction.`,`<button class="btn primary" onclick="advanceDay()">▶ Avancer d’un jour</button><button class="btn" onclick="advanceWeek()">＋ Fin de semaine</button>`)+`<div class="grid g4" style="margin-bottom:16px">${metric('Trésorerie disponible',moneyM(S.cash),'Liquidités consolidées','')}${metric('Résultat cumulé',moneyM(S.revenueTotal-S.costTotal),'Revenus moins charges','orange')}${metric('Flotte active',S.fleet.length+' appareil(s)',S.fleet.filter(a=>a.status!=='En maintenance').length+' disponible(s)','blue')}${metric('Passagers transportés',fmt(S.passengers),'Depuis le début de la partie','gold')}</div><div class="split"><div class="grid" style="align-content:start;gap:15px">${panel('Tableau des départs',`<div class="table-wrap"><table><thead><tr><th>Heure</th><th>Vol / ligne</th><th>Appareil</th><th>État</th></tr></thead><tbody>${topFlights.length?topFlights.map(f=>{let r=getRoute(f.route),a=getPlane(f.aircraft);return `<tr><td class="strong">${esc(f.time)}</td><td>${r?routeHTML(r):esc(f.route)}<div class="sub">${esc(f.gate||'Porte à définir')}</div></td><td>${a?esc(a.registration)+'<div class="sub">'+esc(a.model)+'</div>':'À affecter'}</td><td><span class="pill ${f.status==='Programmé'?'blue':'green'}">${esc(f.status)}</span></td></tr>`}).join(''):`<tr><td colspan="4">${empty('Aucun départ prévu','Planifiez un vol dans l’onglet Vols & planning.',`<button class="btn primary" onclick="setTab('flights')">Ouvrir le planning</button>`)}</td></tr>`}</tbody></table></div>`,`Départs planifiés aujourd’hui`,`<button class="btn small" onclick="setTab('flights')">Gérer les vols ↗</button>`)}${panel('Réseau commercial',routes.length?routes.map(r=>`<div class="vendor-row"><div style="min-width:0;flex:1">${routeHTML(r)}<div class="sub" style="margin-top:8px">${routeFlag(r)} · ${fmt(r.km)} km · ${r.frequency} vol/jour · ${pct(r.load)} de remplissage</div></div><div class="vendor-data"><b>${eur(r.fare)}</b><small>tarif moyen</small></div></div>`).join(''):empty('Aucune ligne','Ouvrez votre première liaison commerciale.'),`La santé de votre réseau`)}${panel('Derniers mouvements financiers',tx.length?`<div class="table-wrap"><table><thead><tr><th>Jour</th><th>Opération</th><th>Type</th><th class="right">Montant</th></tr></thead><tbody>${tx.map(t=>`<tr><td>J${t.day}</td><td>${esc(t.label)}</td><td><span class="pill">${esc(t.kind)}</span></td><td class="right money" style="color:${t.amount<0?'var(--red)':'var(--green)'}">${t.amount<0?'−':'+'}${eur(Math.abs(t.amount))}</td></tr>`).join('')}</tbody></table></div>`:empty('Pas encore de mouvements','Les transactions apparaîtront ici lors des opérations.'),`Journal de trésorerie`)}</div><div class="grid" style="align-content:start;gap:15px">${panel('Indicateurs de direction',`<div class="grid g2"><div class="mini-kpi"><span>Passagers / jour</span><b>${fmt(S.passengers/Math.max(1,S.day))}</b></div><div class="mini-kpi"><span>Réputation</span><b>${fmt(S.reputation)}/100</b></div><div class="mini-kpi"><span>Dette bancaire</span><b>${moneyM(S.debt)}</b></div><div class="mini-kpi"><span>Effectif actif</span><b>${S.people.filter(p=>p.status==='Actif').length}</b></div></div><div style="margin-top:15px"><div style="display:flex;justify-content:space-between;margin-bottom:7px;font-size:11px"><b>Qualité de service</b><span>${S.company.service}/100</span></div><div class="progress"><span style="width:${S.company.service}%"></span></div><div style="display:flex;justify-content:space-between;margin:14px 0 7px;font-size:11px"><b>Sécurité opérationnelle</b><span>${S.company.safety}/100</span></div><div class="progress"><span style="width:${S.company.safety}%;background:var(--gold)"></span></div><div style="display:flex;justify-content:space-between;margin:14px 0 7px;font-size:11px"><b>Image de marque</b><span>${S.company.brandScore}/100</span></div><div class="progress"><span style="width:${S.company.brandScore}%;background:var(--orange)"></span></div></div>`,`Vue synthétique de l’entreprise`)}${panel('Priorités immédiates',`<div class="timeline">${[{t:'Personnel',d:S.people.filter(p=>p.status==='Actif').length<15?'Renforcer les équipes avant d’augmenter les fréquences.':'Vérifier les rotations et les repos légaux.'},{t:'Fournisseurs',d:S.negotiatedWeek<S.week?'Les négociations hebdomadaires sont ouvertes.':'Accords de la semaine enregistrés.'},{t:'Aéroports',d:S.routes.some(r=>r.status!=='Ouverte')?'Des dossiers de ligne attendent une décision.':'Le réseau actuel est en exploitation.'},{t:'Finances',d:S.cash<10000000?'Attention : la trésorerie passe sous 10 M€.':'Surveiller les frais fixes et les échéances.'}].map((x,i)=>`<div class="timeline-item"><div class="timeline-time">${['RH','ACH','OPS','€'][i]}</div><div class="timeline-rail"><div class="timeline-dot"></div><div class="timeline-stem"></div></div><div class="timeline-text"><b>${x.t}</b><p>${x.d}</p></div></div>`).join('')}</div>`,`À traiter cette semaine`)}${panel('Actions rapides',`<div class="grid g2"><button class="btn" onclick="setTab('market')">✈ Acheter / louer</button><button class="btn" onclick="setTab('routes')">↗ Ouvrir une ligne</button><button class="btn" onclick="setTab('people')">♙ Recruter</button><button class="btn" onclick="setTab('suppliers')">◇ Négocier</button><button class="btn" onclick="setTab('finance')">€ Financement</button><button class="btn" onclick="setTab('social')">▣ Communiquer</button></div>`,`Accès directs`)}</div></div><p class="footer-note">Airline CEO est une simulation de gestion : les coûts, taux, contrats, demandes, prix des avions et résultats sont des paramètres de jeu. Ils ne constituent ni des données de tarification contractuelle ni des offres financières réelles.</p>`}
function renderFleet(){let totalValue=S.fleet.reduce((n,a)=>n+(a.paid||0),0),leases=S.fleet.filter(a=>a.ownership==='Leasing').reduce((n,a)=>n+a.monthlyLease,0);return pageHead('Actifs · disponibilité · maintenance','La flotte','Suivez la propriété, les baux, l’état technique, le potentiel de chaque appareil et son affectation aux lignes.','<button class="btn primary" onclick="setTab(\'market\')">＋ Marché des avions</button>')+`<div class="grid g4" style="margin-bottom:16px">${metric('Avions au registre',S.fleet.length,'Propriété et leasing','')}${metric('Valeur d’acquisition',moneyM(totalValue),'Avions achetés','blue')}${metric('Loyers mensuels',eur(leases),'Baux actifs','orange')}${metric('Disponibilité',pct(S.fleet.length?S.fleet.filter(a=>a.status==='Disponible').length/S.fleet.length*100:0),'État du parc','gold')}</div><section class="panel"><div class="panel-head"><div><h2>Registre des aéronefs</h2><p>La disponibilité réelle de simulation dépend des vols et de la maintenance.</p></div><button class="btn small" onclick="exportCSV('fleet')">Exporter CSV</button></div><div class="table-wrap"><table><thead><tr><th>Immatriculation</th><th>Appareil / constructeur</th><th>Capacité</th><th>Propriété</th><th>État</th><th>Condition</th><th>Prochain check</th><th></th></tr></thead><tbody>${S.fleet.length?S.fleet.map(a=>`<tr><td><b>${esc(a.registration)}</b><div class="sub">${esc(a.id)}</div></td><td><div class="roster-name"><div class="aircraft-icon">✈</div><div><b>${esc(a.model)}</b><div class="sub">${esc(a.maker)}</div></div></div></td><td>${a.seats} sièges<div class="sub">${fmt(a.range)} km max. (catalogue de jeu)</div></td><td><span class="pill ${a.ownership==='Leasing'?'blue':'green'}">${a.ownership}</span>${a.lessor?`<div class="sub">${esc(LESSORS.find(x=>x.id===a.lessor)?.name||a.lessor)}</div>`:''}</td><td><span class="pill ${a.status==='Disponible'?'green':a.status==='En maintenance'?'orange':'blue'}">${esc(a.status)}</span></td><td><b>${a.condition}%</b><div class="progress" style="width:85px;margin-top:5px"><span style="width:${a.condition}%;background:${a.condition<60?'var(--red)':'var(--teal)'}"></span></div></td><td>${a.nextMaintenance} h<div class="sub">${a.cycles} cycles</div></td><td><div class="table-actions"><button class="btn small" onclick="aircraftDetail('${a.id}')">Détails</button>${a.status==='En maintenance'?`<button class="btn small primary" onclick="finishMaintenance('${a.id}')">Libérer</button>`:`<button class="btn small" onclick="sendMaintenance('${a.id}')">Maintenance</button>`}</div></td></tr>`).join(''):`<tr><td colspan="8">${empty('Flotte vide','Achetez ou louez votre premier appareil sur le marché.',`<button class="btn primary" onclick="setTab('market')">Accéder au marché</button>`)}</td></tr>`}</tbody></table></div></section><div class="grid g2" style="margin-top:15px">${panel('Politique de maintenance',`<p class="muted" style="line-height:1.6">Une visite technique réduit temporairement la disponibilité et coûte une somme liée à la catégorie de l’appareil. Une condition très dégradée pénalise la fiabilité et la satisfaction passager.</p><div class="grid g2"><div class="mini-kpi"><span>Condition moyenne</span><b>${fmt(S.fleet.length?S.fleet.reduce((a,b)=>a+b.condition,0)/S.fleet.length:0)} %</b></div><div class="mini-kpi"><span>Cycles enregistrés</span><b>${fmt(S.fleet.reduce((n,a)=>n+a.cycles,0))}</b></div></div>`,`Flotte et sécurité`)}${panel('Engagements de location',S.fleet.filter(a=>a.ownership==='Leasing').length?`<div class="table-wrap"><table><thead><tr><th>Appareil</th><th>Bailleur</th><th>Loyer / mois</th></tr></thead><tbody>${S.fleet.filter(a=>a.ownership==='Leasing').map(a=>`<tr><td>${esc(a.registration)} · ${esc(a.model)}</td><td>${esc(LESSORS.find(x=>x.id===a.lessor)?.name||'Bailleur')}</td><td class="money">${eur(a.monthlyLease)}</td></tr>`).join('')}</tbody></table></div>`:empty('Aucun contrat de location','Les nouveaux baux seront enregistrés automatiquement.'),`Loyers de la flotte`)}</div>`}
function renderMarket(){return pageHead('Approvisionnement · financement d’actifs','Marché aéronautique','Catalogue du neuf constructeur, marché de leasing de bailleurs identifiés et contrats de location simulés. Les prix et disponibilités sont fictifs pour le jeu, pas des devis.','<button class="btn" onclick="setTab(\'fleet\')">Voir ma flotte →</button>')+`<div class="callout warning" style="margin-bottom:15px">Les noms des constructeurs et bailleurs correspondent à des acteurs réels. Les unités disponibles, les loyers, les remises et les prix affichés sont des valeurs de simulation, sans lien contractuel avec ces entreprises.</div><div class="section-title"><h2>Avions neufs · commande constructeur</h2><div class="rule"></div><span class="pill">${new Set(AIRCRAFT.map(a=>a.maker)).size} constructeurs</span></div><div class="grid g3">${AIRCRAFT.map(a=>`<section class="panel"><div class="panel-body"><div style="display:flex;align-items:flex-start;gap:12px"><div class="aircraft-icon">✈</div><div style="flex:1;min-width:0"><div class="eyebrow">${esc(a.maker)} · ${esc(a.class)}</div><h3 style="margin:5px 0 4px;font-size:17px">${esc(a.model)}</h3><div class="sub">${a.seats} sièges · autonomie catalogue ${fmt(a.range)} km</div></div></div><div class="grid g2" style="margin:16px 0"><div class="mini-kpi"><span>Prix indicatif jeu</span><b style="font-size:15px">${moneyM(a.price)}</b></div><div class="mini-kpi"><span>Vitesse</span><b style="font-size:15px">${a.cruise} km/h</b></div></div><div style="font-size:11px;color:var(--muted);line-height:1.5;margin-bottom:12px">${esc(a.notes)}<br>Consommation simulée : ${a.burn} L/100 km</div><div class="form-actions"><button class="btn primary wide" onclick="buyAircraft('${a.id}')">Commander neuf</button><button class="btn wide" onclick="openLeaseMarket('${a.id}')">Étudier leasing</button></div></div></section>`).join('')}</div><div class="section-title"><h2>Marché de la location · bailleurs</h2><div class="rule"></div></div><div class="grid g3">${LESSORS.map(l=>`<section class="panel"><div class="panel-body"><div style="display:flex;gap:12px;align-items:center"><div class="market-logo" style="background:${l.color}"><img src="https://www.google.com/s2/favicons?domain=${esc(l.domain)}&sz=64" alt="" style="width:30px;height:30px;border-radius:8px;background:white;object-fit:contain" onerror="this.parentNode.textContent='${esc(l.short)}'"></div><div><div class="eyebrow">Bailleur aéronautique</div><h3 style="margin:4px 0;font-size:16px">${esc(l.name)}</h3><div class="sub">${esc(l.domain)}</div></div></div><p style="color:var(--muted);font-size:11px;line-height:1.5">Catalogue proposé pour la simulation : ${l.fleet.map(id=>AIRCRAFT.find(a=>a.id===id)?.model).filter(Boolean).join(', ')}.</p><div class="form-actions"><button class="btn primary wide" onclick="openLessor('${l.id}')">Consulter les offres</button></div></div></section>`).join('')}</div><p class="footer-note">Références de marché utilisées pour la cohérence des noms : AerCap, Avolon et SMBC Aviation Capital publient des informations sur leurs portefeuilles d’aéronefs. Les modèles et conditions de ce simulateur ne représentent pas les offres exactes de ces sociétés.</p>`}
function renderRoutes(){let waiting=S.routes.filter(r=>r.status!=='Ouverte');return pageHead('Réseau · développement commercial','Gestion des lignes','Sélectionnez des aéroports dans le monde, soumettez un dossier aux directeurs d’aéroport et négociez redevances et taxes avant l’ouverture.','<button class="btn" onclick="setTab(\'map\')">◎ Trouver un aéroport</button>')+`<div class="split"><div class="grid" style="align-content:start;gap:15px"><section class="panel"><div class="panel-head"><div><h2>Développer une nouvelle liaison</h2><p>Chaque ligne passe par une négociation aéroportuaire aux deux extrémités.</p></div><span class="pill orange">Dossier commercial</span></div><div class="panel-body"><form onsubmit="createRouteFromForm(event)"><div class="form-grid"><div class="field"><label>Origine (code IATA, ICAO ou nom)</label><input required list="airport-list" id="route-origin-input" placeholder="Ex. MPL — Montpellier" autocomplete="off"></div><div class="field"><label>Destination</label><input required list="airport-list" id="route-dest-input" placeholder="Ex. LIS — Lisbonne" autocomplete="off"></div><div class="field"><label>Fréquence cible par jour</label><select id="route-frequency"><option>1</option><option selected>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>8</option><option>10</option></select></div><div class="field"><label>Tarif moyen cible (€ / aller)</label><input type="number" min="20" max="3000" id="route-fare" value="125" required></div><div class="field"><label>Remplissage prévisionnel (%)</label><input type="number" min="20" max="98" id="route-load" value="76" required></div><div class="field"><label>Appareil pressenti</label><select id="route-aircraft"><option value="">À décider</option>${aircraftOptions()}</select></div><div class="field span2"><label>Positionnement de la ligne</label><select id="route-strategy"><option value="balanced">Équilibre prix / service</option><option value="lowcost">Tarifs bas · volume</option><option value="premium">Premium · prix élevé</option><option value="leisure">Loisirs · demande saisonnière</option><option value="business">Affaires · fréquence élevée</option></select></div><div class="field span2"><label>Note à destination des directeurs d’aéroport</label><textarea id="route-note" placeholder="Ex. lancement progressif, fréquence quotidienne, visibilité commerciale et retombées locales."></textarea></div></div><div class="form-actions"><button class="btn primary" type="submit">Créer le dossier de ligne →</button><button class="btn" type="button" onclick="openAirportPicker('origin')">Rechercher l’origine</button><button class="btn" type="button" onclick="openAirportPicker('dest')">Rechercher la destination</button></div></form><div class="sub" style="margin-top:12px">Base aéroportuaire : ${esc(airportSource)} · ${fmt(airports.length)} aéroports disponibles ${airportsLoading?'· chargement en cours':''}.</div></div></section>${panel('Lignes ouvertes',S.routes.filter(r=>r.status==='Ouverte').length?`<div class="table-wrap"><table><thead><tr><th>Liaison</th><th>Distance</th><th>Vols / jour</th><th>Tarif moyen</th><th>Demande</th><th>Coûts / rotation</th><th></th></tr></thead><tbody>${S.routes.filter(r=>r.status==='Ouverte').map(r=>`<tr><td>${routeHTML(r)}<div class="sub">${routeFlag(r)}</div></td><td>${fmt(r.km)} km<div class="sub">~${fmt(r.block*60)} min</div></td><td><b>${r.frequency}</b><div class="sub">${r.autoSchedule===false?'Planning manuel':'Rotation récurrente'}</div></td><td>${eur(r.fare)}</td><td>${pct(r.load)}<div class="progress" style="width:75px;margin-top:5px"><span style="width:${r.demand}%"></span></div></td><td>${eur(r.feeOrigin+r.feeDest+r.taxOrigin+r.taxDest)}</td><td><div class="table-actions"><button class="btn small" onclick="editRoute('${r.id}')">Modifier</button><button class="btn small" onclick="routeBrief('${r.id}')">Dossier</button></div></td></tr>`).join('')}</tbody></table></div>`:empty('Pas de lignes ouvertes','Ouvrez votre première liaison en validant les conditions aéroportuaires.'))}</div><div class="grid" style="align-content:start;gap:15px">${panel('Négociations en cours',waiting.length?waiting.map(r=>`<div class="map-side-item" onclick="routeBrief('${r.id}')"><div style="display:flex;justify-content:space-between;gap:8px;align-items:start"><div>${routeHTML(r)}<div class="sub" style="margin-top:8px">${fmt(r.km)} km · ${routeFlag(r)}</div></div><span class="pill orange">${esc(r.status)}</span></div><div style="margin-top:12px;display:grid;gap:8px"><div><div style="display:flex;justify-content:space-between;font-size:10px;margin-bottom:4px"><span>${esc(r.origin)} · frais et taxes</span><b>${r.negotiationOrigin}/100</b></div><div class="progress"><span style="width:${r.negotiationOrigin}%"></span></div></div><div><div style="display:flex;justify-content:space-between;font-size:10px;margin-bottom:4px"><span>${esc(r.dest)} · frais et taxes</span><b>${r.negotiationDest}/100</b></div><div class="progress"><span style="width:${r.negotiationDest}%"></span></div></div></div><div class="form-actions"><button class="btn small primary" onclick="event.stopPropagation();negotiateRoute('${r.id}','origin')">Négocier ${esc(r.origin)}</button><button class="btn small" onclick="event.stopPropagation();negotiateRoute('${r.id}','dest')">Négocier ${esc(r.dest)}</button></div></div>`).join(''):empty('Aucun dossier en attente','Vos futurs dossiers apparaîtront ici.'))}${panel('Barème de redevances (simulation)',`<div class="vendor-row"><div style="flex:1"><div class="vendor-name">Aéroport majeur</div><div class="vendor-desc">Hub international, créneaux tendus</div></div><div class="vendor-data"><b>2 800–3 600 €</b><small>par rotation</small></div></div><div class="vendor-row"><div style="flex:1"><div class="vendor-name">Aéroport moyen</div><div class="vendor-desc">Plateforme régionale</div></div><div class="vendor-data"><b>1 500–2 000 €</b><small>par rotation</small></div></div><div class="vendor-row"><div style="flex:1"><div class="vendor-name">Petite plateforme</div><div class="vendor-desc">Faible niveau de redevances</div></div><div class="vendor-data"><b>≈ 850 €</b><small>par rotation</small></div></div><div class="callout info" style="margin-top:12px">Ces montants sont des valeurs de jeu. Les redevances officielles varient selon l’aéroport, l’appareil, la masse, l’heure, les services et le contrat.</div>`,`Directeurs d’aéroport · négociation commerciale`)}${panel('Outils de réseau',`<button class="btn wide" onclick="setTab('map')">Ouvrir la carte interactive</button><button class="btn wide" style="margin-top:8px" onclick="exportCSV('routes')">Exporter les lignes en CSV</button>`,`Gestion et analyse du réseau`)}</div></div>`}
function renderMapPage(){return pageHead('Atlas · aéroports · développement de réseau','Carte du monde','Explorez les plateformes, recherchez un code IATA ou un nom, puis sélectionnez un aéroport pour construire une liaison. La base mondiale se charge depuis une source ouverte si le réseau le permet.','<button class="btn" onclick="setTab(\'routes\')">＋ Créer une ligne</button>')+`<div class="map-layout"><section class="panel"><div class="map-toolbar"><input class="search-input" id="map-search" placeholder="Rechercher une ville, un pays, un aéroport ou IATA…" oninput="searchAirportOnMap(this.value)"><button class="btn small" onclick="fitWorld()">Monde entier</button><button class="btn small" onclick="loadAirports(true)">↻ Charger la base mondiale</button></div><div class="map-shell" id="map"></div><div class="panel-body" style="padding:11px 14px"><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:10px;color:var(--muted)"><span>© OpenStreetMap · visualisation Leaflet</span><span id="map-status">Carte en cours de préparation…</span><span>Cliquer un point pour consulter l’aéroport</span></div></div></section><div class="grid" style="align-content:start;gap:15px">${panel('Aéroport sélectionné',`<div id="airport-selected">${mapSelection?airportDetailsHTML(mapSelection):empty('Aucun aéroport sélectionné','Cliquez sur un aéroport de la carte ou recherchez un code dans le champ au-dessus.')}</div>`,`Fiche aéroport`)}${panel('Préparer une route',`<div class="field"><label>Aéroport de départ</label><input id="map-origin" list="airport-list" placeholder="MPL ou nom d’aéroport"></div><div class="field" style="margin-top:10px"><label>Aéroport d’arrivée</label><input id="map-dest" list="airport-list" placeholder="CDG ou nom d’aéroport"></div><button class="btn primary wide" style="margin-top:12px" onclick="routeFromMap()">Préparer le dossier de ligne →</button><div class="sub" style="margin-top:9px">Vous devrez ensuite négocier avec les deux aéroports avant l’ouverture.</div>`,`Planificateur commercial`)}${panel('Votre réseau actuel',S.routes.filter(r=>r.status==='Ouverte').length?S.routes.filter(r=>r.status==='Ouverte').map(r=>`<div class="map-side-item" onclick="focusRoute('${r.id}')"><div style="display:flex;justify-content:space-between;gap:8px"><div>${routeHTML(r)}</div><span class="pill">${r.frequency}/j</span></div><div class="sub">${routeFlag(r)} · ${fmt(r.km)} km</div></div>`).join(''):empty('Réseau encore vide','Ouvrez une ligne dans Gestion des lignes.'),`Liaisons opérées`)}</div></div><p class="footer-note">Les coordonnées aéroportuaires proviennent, lorsque la connexion le permet, d’OurAirports ou d’une base de données dérivée. Les données ouvertes peuvent contenir des erreurs ou des entrées obsolètes ; l’application n’est pas un outil de préparation de vol ni de navigation aéronautique.</p>`}
function airportDetailsHTML(a){return `<div style="display:flex;align-items:center;gap:9px;margin-bottom:13px"><div class="market-logo" style="font-size:12px">${esc(a.iata||a.icao||'AP')}</div><div style="flex:1"><h3 style="margin:0 0 3px;font-size:16px">${esc(a.name)}</h3><div class="sub">${isoFlag(a.country)} ${esc(a.city||'Ville non renseignée')} · ${esc(countryName(a.country))}</div></div></div><div class="grid g2"><div class="mini-kpi"><span>IATA</span><b>${esc(a.iata||'—')}</b></div><div class="mini-kpi"><span>ICAO</span><b>${esc(a.icao||'—')}</b></div><div class="mini-kpi"><span>Latitude</span><b style="font-size:14px">${Number(a.lat).toFixed(3)}</b></div><div class="mini-kpi"><span>Longitude</span><b style="font-size:14px">${Number(a.lon).toFixed(3)}</b></div></div><div class="sub" style="margin-top:12px">Type : ${esc(a.size||a.type||'Aéroport')} · Service programmé : ${a.scheduled===false?'non renseigné':'variable selon données source'}</div><div class="form-actions"><button class="btn primary wide" onclick="useSelectedAirport('origin')">Départ</button><button class="btn wide" onclick="useSelectedAirport('dest')">Arrivée</button></div>`}
function searchAirportOnMap(value){let box=document.getElementById('map-search');if(!value.trim())return;let a=getAirport(value);if(a){selectAirport(a,true);return}let q=value.toLowerCase();let hits=airports.filter(a=>(a.name+' '+(a.city||'')+' '+a.iata+' '+a.icao+' '+a.country).toLowerCase().includes(q)).slice(0,8);if(hits.length&&mapObject){document.getElementById('airport-selected').innerHTML=`<div class="airport-search-results">${hits.map(a=>`<button onclick="selectAirportByCode('${esc(a.iata||a.icao)}',true)">${isoFlag(a.country)} <b>${esc(a.iata||a.icao)}</b> · ${esc(a.name)} <span class="muted">— ${esc(a.city||'')}</span></button>`).join('')}</div>`;}}
function selectAirportByCode(code,zoom=false){let a=getAirport(code);if(a)selectAirport(a,zoom)}
function selectAirport(a,zoom=false){mapSelection=a;let box=document.getElementById('airport-selected');if(box)box.innerHTML=airportDetailsHTML(a);if(zoom&&mapObject)mapObject.setView([a.lat,a.lon],Math.max(mapObject.getZoom(),7));}
function useSelectedAirport(side){if(!mapSelection){toast('Sélectionnez d’abord un aéroport.','bad');return}let field=document.getElementById(side==='origin'?'map-origin':'map-dest');if(field)field.value=`${mapSelection.iata||mapSelection.icao} — ${mapSelection.name}`;toast('Aéroport ajouté au planificateur.');}
function routeFromMap(){let a=document.getElementById('map-origin').value,b=document.getElementById('map-dest').value;if(!a||!b){toast('Renseignez les deux aéroports.','bad');return}setTab('routes');setTimeout(()=>{document.getElementById('route-origin-input').value=a;document.getElementById('route-dest-input').value=b;document.getElementById('route-frequency').focus()},50)}
function fitWorld(){if(mapObject)mapObject.setView([20,0],2)}
function focusRoute(id){let r=getRoute(id);if(!r)return;setTab('map');setTimeout(()=>{let a=getAirport(r.origin),b=getAirport(r.dest);if(a&&b&&mapObject){mapObject.fitBounds([[a.lat,a.lon],[b.lat,b.lon]],{padding:[45,45]});selectAirport(a,false)}},120)}
function initMap(){if(!document.getElementById('map'))return;if(!window.L){let m=document.getElementById('map');m.innerHTML='<div class="empty">La carte nécessite une connexion aux bibliothèques cartographiques. Vous pouvez tout de même préparer les lignes dans l’onglet Gestion des lignes.</div>';return}if(mapObject){mapObject.invalidateSize();return}mapObject=L.map('map',{worldCopyJump:true}).setView([25,8],2);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:'&copy; OpenStreetMap'}).addTo(mapObject);if(L.markerClusterGroup)mapClusters=L.markerClusterGroup({chunkedLoading:true,showCoverageOnHover:false,maxClusterRadius:45});else mapClusters=L.layerGroup();mapClusters.addTo(mapObject);mapRouteLayer=L.layerGroup().addTo(mapObject);if(document.getElementById('map-status'))document.getElementById('map-status').textContent=`${fmt(airports.length)} aéroports disponibles · ${airportSource}`;drawAirportMarkers();}
function drawAirportMarkers(){if(!mapClusters||!window.L)return;mapClusters.clearLayers();if(mapRouteLayer)mapRouteLayer.clearLayers();mapMarkers=[];let list=airports.filter(a=>Number.isFinite(a.lat)&&Number.isFinite(a.lon)&&(a.iata||a.icao));list.forEach(a=>{let m=L.circleMarker([a.lat,a.lon],{radius:a.size==='large'?4:2.5,fillColor:a.size==='large'?'#dc6d3d':'#126f68',color:'#fffdf8',weight:.7,opacity:.9,fillOpacity:.85});m.bindTooltip(`${a.iata||a.icao} · ${a.name}`,{direction:'top',sticky:true});m.on('click',()=>selectAirport(a,false));m.addTo(mapClusters);mapMarkers.push(m)});for(let r of S.routes.filter(x=>x.status==='Ouverte')){let a=getAirport(r.origin),b=getAirport(r.dest);if(a&&b){let line=L.polyline([[a.lat,a.lon],[b.lat,b.lon]],{color:'#dc6d3d',weight:2.5,opacity:.85,dashArray:'6 5'});line.bindTooltip(`${r.origin} → ${r.dest}`);line.addTo(mapRouteLayer||mapObject)}}let s=document.getElementById('map-status');if(s)s.textContent=`${fmt(list.length)} aéroports · ${airportSource}`;}
function loadAirports(force=false){if(airportsLoading||airportLoaded&&!force)return;airportsLoading=true;const url='https://raw.githubusercontent.com/davidmegginson/ourairports-data/main/airports.csv';fetch(url,{cache:force?'reload':'default'}).then(r=>{if(!r.ok)throw Error('Base aéroportuaire indisponible');return r.text()}).then(csv=>{let rows=parseCSV(csv);if(rows.length<100)throw Error('Base invalide');let h=rows[0],idx={};h.forEach((x,i)=>idx[x]=i);let data=[];for(let i=1;i<rows.length;i++){let r=rows[i];if(r.length<h.length&&r.length<12)continue;let iata=(r[idx.iata_code]||'').trim(),icao=(r[idx.icao_code]||'').trim(),type=(r[idx.type]||'').trim();if((!iata&&!icao)||!['large_airport','medium_airport','small_airport'].includes(type))continue;let lat=Number(r[idx.latitude_deg]),lon=Number(r[idx.longitude_deg]);if(!Number.isFinite(lat)||!Number.isFinite(lon))continue;data.push({iata,icao,name:r[idx.name]||iata,city:r[idx.municipality]||'',country:r[idx.iso_country]||'',lat,lon,size:type==='large_airport'?'large':type==='medium_airport'?'medium':'small',type,scheduled:(r[idx.scheduled_service]||'').toLowerCase()==='yes'})}if(data.length<100)throw Error('Base trop courte');airports=data;airportSource='OurAirports';airportLoaded=true;document.getElementById('airport-list').innerHTML=data.map(a=>`<option value="${esc(a.iata||a.icao)} — ${esc(a.name)}${a.city?', '+esc(a.city):''}"></option>`).join('');if(activeTab==='map'){if(mapObject){drawAirportMarkers();let s=document.getElementById('map-status');if(s)s.textContent=`${fmt(airports.length)} aéroports · OurAirports`}else setTimeout(initMap,100)}if(activeTab==='routes'){let el=document.querySelector('.sub');}toast(`Base mondiale chargée : ${fmt(airports.length)} aéroports.`);}).catch(err=>{airportSource='base intégrée (mode hors ligne)';console.warn(err);if(force)toast('Impossible de télécharger la base mondiale. La base intégrée reste disponible.','bad')}).finally(()=>{airportsLoading=false;});}
function parseCSV(text){let rows=[],row=[],cell='',quote=false;for(let i=0;i<text.length;i++){let c=text[i];if(c==='"'){if(quote&&text[i+1]==='"'){cell+='"';i++}else quote=!quote}else if(c===','&&!quote){row.push(cell);cell=''}else if((c==='\n'||c==='\r')&&!quote){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cell);if(row.some(v=>v!==''))rows.push(row);row=[];cell=''}else cell+=c}row.push(cell);if(row.some(v=>v!==''))rows.push(row);return rows}
function openAirportPicker(target){airportPickTarget=target;modal('Rechercher un aéroport',`<div class="field"><label>Code, ville, nom ou pays</label><input id="airport-picker-query" class="search-input" placeholder="Ex. LHR, Londres, Montpellier…" oninput="searchAirportPicker(this.value)" autocomplete="off"></div><div id="airport-picker-results" class="airport-search-results">${airports.slice(0,12).map(a=>`<button onclick="chooseAirport('${esc(a.iata||a.icao)}')">${isoFlag(a.country)} <b>${esc(a.iata||a.icao)}</b> · ${esc(a.name)} <span class="muted">${esc(a.city||'')}</span></button>`).join('')}</div>`,`<button class="btn" onclick="closeModal()">Fermer</button>`)}
function searchAirportPicker(q){let root=document.getElementById('airport-picker-results');if(!root)return;q=q.trim().toLowerCase();if(!q){root.innerHTML='';return}let hits=airports.filter(a=>(a.iata+' '+a.icao+' '+a.name+' '+a.city+' '+countryName(a.country)).toLowerCase().includes(q)).slice(0,25);root.innerHTML=hits.length?hits.map(a=>`<button onclick="chooseAirport('${esc(a.iata||a.icao)}')">${isoFlag(a.country)} <b>${esc(a.iata||a.icao)}</b> · ${esc(a.name)} <span class="muted">— ${esc(a.city||'')}</span></button>`).join(''):'<div class="empty">Aucun résultat dans les données chargées.</div>'}
function chooseAirport(code){let a=getAirport(code);if(!a)return;let field=document.getElementById(airportPickTarget==='origin'?'route-origin-input':'route-dest-input');if(field)field.value=`${a.iata||a.icao} — ${a.name}`;closeModal();toast(`${a.iata||a.icao} ajouté au dossier.`)}
function resolveAirportInput(value){let q=String(value||'').trim();if(!q)return null;let qUpper=q.toUpperCase();let leading=q.split(/[ —–-]/)[0].trim().toUpperCase();return airports.find(a=>a.iata===qUpper||a.icao===qUpper||a.iata===leading||a.icao===leading)||airports.find(a=>(a.name+' '+a.city).toLowerCase()===q.toLowerCase())||airports.find(a=>(a.name+' '+a.city+' '+a.iata+' '+a.icao).toLowerCase().includes(q.toLowerCase()))||null}
function createRouteFromForm(e){e.preventDefault();let oa=document.getElementById('route-origin-input').value,da=document.getElementById('route-dest-input').value;let o=resolveAirportInput(oa),d=resolveAirportInput(da);if(!o||!d){toast('Aéroport introuvable. Utilisez le code IATA ou le bouton de recherche.','bad');return}if((o.iata||o.icao)===(d.iata||d.icao)){toast('L’origine et la destination doivent être différentes.','bad');return}if(S.routes.some(r=>r.origin===(o.iata||o.icao)&&r.dest===(d.iata||d.icao))){toast('Cette liaison existe déjà dans votre réseau.','bad');return}let frequency=Number(document.getElementById('route-frequency').value)||1,fare=Number(document.getElementById('route-fare').value)||90,load=Number(document.getElementById('route-load').value)||70,aircraft=document.getElementById('route-aircraft').value,strategy=document.getElementById('route-strategy').value,note=document.getElementById('route-note').value;let r=makeRoute(o,d,{frequency,fare,load,aircraft,status:'En négociation'});r.autoSchedule=false;r.strategy=strategy;r.note=note;r.feeOrigin=airportFee(o);r.feeDest=airportFee(d);r.taxOrigin=Math.round(r.feeOrigin*.21);r.taxDest=Math.round(r.feeDest*.21);r.negotiationOrigin=15;r.negotiationDest=15;r.demand=Math.round(50+Math.random()*35);S.routes.unshift(r);log('Dossier de ligne créé',`Le dossier ${r.origin}–${r.dest} (${fmt(r.km)} km) a été transmis aux directions aéroportuaires.`,'Réseau');scheduleSave();toast('Dossier créé. Négociez avec les deux directeurs d’aéroport.');setTab('routes')}
function negotiateRoute(id,side){let r=getRoute(id);if(!r)return;let airportCode=side==='origin'?r.origin:r.dest,feeKey=side==='origin'?'feeOrigin':'feeDest',taxKey=side==='origin'?'taxOrigin':'taxDest',relKey=side==='origin'?'negotiationOrigin':'negotiationDest';let airport=getAirport(airportCode);let baseFee=r[feeKey],baseTax=r[taxKey];modal(`Négociation · ${airportCode}`,`<div class="callout info" style="margin-bottom:14px">Vous rencontrez la direction de ${esc(airport?.name||airportCode)} pour négocier les redevances, les taxes et les conditions d’escale pour la ligne ${esc(r.origin)}–${esc(r.dest)}.</div><div class="grid g2" style="margin-bottom:15px"><div class="mini-kpi"><span>Redevance actuelle</span><b>${eur(baseFee)}</b></div><div class="mini-kpi"><span>Taxes actuelles (simulation)</span><b>${eur(baseTax)}</b></div></div><form onsubmit="submitAirportNegotiation(event,'${id}','${side}')"><div class="field"><label>Réduction demandée sur les frais (%)</label><input type="range" min="0" max="35" value="15" id="airport-discount" oninput="document.getElementById('airport-discount-value').textContent=this.value+' % · nouveau total estimé '+eur((${baseFee}+${baseTax})*(1-this.value/100))"><b id="airport-discount-value">15 % · nouveau total estimé ${eur((baseFee+baseTax)*.85)}</b></div><div class="field" style="margin-top:14px"><label>Engagement commercial</label><select id="airport-commit"><option value="1">Début prudent · 1 vol/jour</option><option value="2" selected>Régulier · fréquence prévue</option><option value="3">Développement · trafic croissant</option><option value="4">Partenaire stratégique · visibilité et emploi local</option></select></div><div class="field" style="margin-top:14px"><label>Durée demandée</label><select id="airport-term"><option value="12">12 semaines</option><option value="26">26 semaines</option><option value="52" selected>52 semaines</option><option value="104">2 ans (simulation)</option></select></div><div class="form-actions"><button class="btn primary" type="submit">Présenter l’offre au directeur</button></div></form>`,`<button class="btn" onclick="closeModal()">Fermer</button>`)}
function submitAirportNegotiation(e,id,side){e.preventDefault();let r=getRoute(id);if(!r)return;let discount=Number(document.getElementById('airport-discount').value),commit=Number(document.getElementById('airport-commit').value),term=Number(document.getElementById('airport-term').value),key=side==='origin'?'negotiationOrigin':'negotiationDest',feeKey=side==='origin'?'feeOrigin':'feeDest',taxKey=side==='origin'?'taxOrigin':'taxDest';let relation=r[key],skill=S.people.some(p=>p.job==='RH'&&p.status==='Actif')?4:0;let chance=Math.max(.08,Math.min(.96,.55+relation/230+S.reputation/650+skill/100+(commit-2)*.07-discount/120+(term-52)/1500));let roll=Math.random();if(roll<chance){r[feeKey]=Math.round(r[feeKey]*(1-discount/100));r[taxKey]=Math.round(r[taxKey]*(1-discount/100));r[key]=Math.min(100,relation+18+commit*3+Math.round(discount/2));r['term'+(side==='origin'?'Origin':'Dest')]=term;S.company.brandScore=Math.min(100,S.company.brandScore+1);log('Accord aéroportuaire obtenu',`${side==='origin'?r.origin:r.dest} accepte une réduction de ${discount}% sur les frais négociés pour la ligne ${r.origin}–${r.dest}.`,'Réseau');toast('Accord obtenu : frais et taxes revus à la baisse.')}else{r[key]=Math.min(100,relation+8+commit*2);log('Contre-proposition aéroportuaire',`La direction de ${side==='origin'?r.origin:r.dest} demande de nouveaux engagements avant de consentir la remise.`,'Réseau');toast('Contre-proposition : renforcez le dossier ou revenez la semaine prochaine.','bad')}if(r.negotiationOrigin>=60&&r.negotiationDest>=60&&r.status!=='Ouverte'){r.status='Ouverte';r.autoSchedule=true;if(!r.aircraft&&S.fleet.length)r.aircraft=S.fleet[0].id;log('Nouvelle ligne ouverte',`La ligne ${r.origin}–${r.dest} est autorisée dans la simulation ; générez ou ajustez les vols dans le planning.`,'Réseau');toast('Ligne ouverte ! Pensez à planifier les vols et à affecter un appareil.')}closeModal();scheduleSave();render()}
function routeBrief(id){let r=getRoute(id);if(!r)return;let o=getAirport(r.origin),d=getAirport(r.dest),annualPax=(S.fleet.length?S.fleet[0].seats:180)*r.load/100*r.frequency*365;modal(`Dossier de ligne · ${r.origin}–${r.dest}`,`<div class="route-line" style="justify-content:space-between;margin-bottom:15px">${routeHTML(r)}<span class="pill ${r.status==='Ouverte'?'green':'orange'}">${esc(r.status)}</span></div><div class="grid g2"><div class="mini-kpi"><span>Distance</span><b>${fmt(r.km)} km</b></div><div class="mini-kpi"><span>Temps de bloc estimé</span><b>${fmt(r.block*60)} min</b></div><div class="mini-kpi"><span>Coût aéroport par rotation</span><b>${eur(r.feeOrigin+r.feeDest+r.taxOrigin+r.taxDest)}</b></div><div class="mini-kpi"><span>Tarif cible aller</span><b>${eur(r.fare)}</b></div><div class="mini-kpi"><span>Fréquence</span><b>${r.frequency} vol(s)/jour</b></div><div class="mini-kpi"><span>Remplissage cible</span><b>${pct(r.load)}</b></div></div><p class="muted" style="font-size:12px;line-height:1.6;margin-top:15px">Demande simulée : ${r.demand}/100. Volume indicatif modélisé : ${fmt(annualPax)} sièges-passagers vendus par an avant prise en compte de la concurrence, de la saisonnalité et des jours d’exploitation.</p><div class="form-actions"><button class="btn primary" onclick="editRoute('${r.id}');closeModal()">Modifier les paramètres</button><button class="btn" onclick="focusRoute('${r.id}');closeModal()">Voir sur la carte</button></div>`,`<button class="btn" onclick="closeModal()">Fermer</button>`)}
function editRoute(id){let r=getRoute(id);if(!r)return;modal('Modifier la ligne',`<form onsubmit="saveRouteEdit(event,'${id}')"><div class="form-grid"><div class="field"><label>Fréquence quotidienne</label><select id="edit-frequency">${[1,2,3,4,5,6,8,10].map(x=>`<option ${x===r.frequency?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Tarif aller (€)</label><input type="number" id="edit-fare" value="${r.fare}" min="20" max="3000"></div><div class="field"><label>Remplissage (%)</label><input type="number" id="edit-load" value="${r.load}" min="20" max="98"></div><div class="field"><label>Appareil affecté</label><select id="edit-aircraft"><option value="">À décider</option>${aircraftOptions(r.aircraft)}</select></div><div class="field span2"><label>Planning automatique</label><select id="edit-auto"><option value="yes" ${r.autoSchedule!==false?'selected':''}>Générer les vols chaque jour</option><option value="no" ${r.autoSchedule===false?'selected':''}>Planning manuel uniquement</option></select></div></div><div class="form-actions"><button class="btn primary" type="submit">Enregistrer</button></div></form>`,`<button class="btn" onclick="closeModal()">Annuler</button>`)}
function saveRouteEdit(e,id){e.preventDefault();let r=getRoute(id);r.frequency=Number(document.getElementById('edit-frequency').value);r.fare=Number(document.getElementById('edit-fare').value);r.load=Number(document.getElementById('edit-load').value);r.aircraft=document.getElementById('edit-aircraft').value;r.autoSchedule=document.getElementById('edit-auto').value==='yes';scheduleSave();closeModal();toast('Paramètres de ligne enregistrés.');render()}
function renderFlights(){let focusDay=selectedPlanningDay===null?S.day:selectedPlanningDay;let today=S.flights.filter(f=>f.day===focusDay).sort((a,b)=>a.time.localeCompare(b.time));let weekFlights=S.flights.filter(f=>f.day>=S.day&&f.day<S.day+7).sort((a,b)=>a.day-b.day||a.time.localeCompare(b.time));let routeCount=S.routes.filter(r=>r.status==='Ouverte').length;return pageHead('Centre des opérations · horaires · équipages','Vols & planning','Construisez le programme de vols, affectez les avions et les équipages, ajustez les rotations et lancez les opérations jour par jour.','<button class="btn primary" onclick="openFlightForm()">＋ Programmer un vol</button><button class="btn" onclick="generateWeekSchedule()">Générer la semaine</button>')+`<div class="grid g4" style="margin-bottom:16px">${metric('Vols aujourd’hui',today.length,'Programme du jour','')}${metric('Vols à venir',weekFlights.filter(f=>f.status==='Programmé').length,'Dans les sept prochains jours','blue')}${metric('Vols réalisés',S.flightsCompleted,'Depuis le début','')}${metric('Annulations',S.cancelled,'Vols non effectués','orange')}</div><div class="grid g2" style="margin-bottom:16px"><section class="panel"><div class="panel-head"><div><h2>Planning du jour</h2><p>Déplacez un vol ou modifiez son équipage avant de faire avancer la simulation.</p></div><span class="pill blue">Planning J${focusDay}${focusDay!==S.day?' · date active J'+S.day:''}</span></div><div class="panel-body"><div id="weekly-strip" class="grid" style="grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;margin-bottom:17px"></div><div class="timeline">${today.length?today.map(f=>{let r=getRoute(f.route),a=getPlane(f.aircraft);return `<div class="timeline-item"><div class="timeline-time">${esc(f.time)}</div><div class="timeline-rail"><div class="timeline-dot" style="background:${f.status==='Réalisé'?'var(--green)':f.status==='Annulé'?'var(--red)':'var(--orange)'}"></div><div class="timeline-stem"></div></div><div class="timeline-text"><div style="display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap"><b>${r?`${routeFlag(r)} ${esc(r.origin)} → ${esc(r.dest)}`:esc(f.route)}</b><span class="pill ${f.status==='Réalisé'?'green':f.status==='Annulé'?'red':'blue'}">${esc(f.status)}</span></div><p>${a?esc(a.registration)+' · '+esc(a.model):'Aucun appareil'} · Porte ${esc(f.gate||'—')} · Équipage ${f.crew?.length||0} personne(s)</p><div class="table-actions"><button class="btn small" onclick="editFlight('${f.id}')">Modifier</button>${f.status==='Programmé'?`<button class="btn small" onclick="cancelFlight('${f.id}')">Annuler le vol</button>`:''}</div></div></div>`}).join(''):empty('Pas de vol aujourd’hui',routeCount?'Générez le planning de la semaine pour vos lignes ouvertes.':'Ouvrez une ligne avant de programmer vos vols.',`<button class="btn primary" onclick="setTab('routes')">Ouvrir une ligne</button>`)}</div></div></section><div class="grid" style="align-content:start;gap:15px">${panel('Planning de la semaine',weekFlights.length?`<div class="table-wrap"><table><thead><tr><th>Jour</th><th>Heure</th><th>Liaison</th><th>Avion</th><th>État</th></tr></thead><tbody>${weekFlights.map(f=>{let r=getRoute(f.route),a=getPlane(f.aircraft);return `<tr><td>J${f.day}</td><td><b>${esc(f.time)}</b></td><td>${r?routeFlag(r)+' '+esc(r.origin)+' → '+esc(r.dest):'—'}</td><td>${a?esc(a.registration):'—'}</td><td><span class="pill ${f.status==='Programmé'?'blue':f.status==='Réalisé'?'green':'red'}">${esc(f.status)}</span></td></tr>`}).join('')}</tbody></table></div>`:empty('Planning vide','Programmez des vols ou générez la semaine.'),`Programme glissant`)}${panel('Ressources disponibles',`<div class="grid g2"><div class="mini-kpi"><span>PNT actifs</span><b>${S.people.filter(p=>p.job==='PNT'&&p.status==='Actif').length}</b></div><div class="mini-kpi"><span>PNC actifs</span><b>${S.people.filter(p=>p.job==='PNC'&&p.status==='Actif').length}</b></div><div class="mini-kpi"><span>Agents d’escale</span><b>${S.people.filter(p=>p.job==='AGENT D’ESCALE'&&p.status==='Actif').length}</b></div><div class="mini-kpi"><span>Agents de piste</span><b>${S.people.filter(p=>p.job==='AGENT DE PISTE'&&p.status==='Actif').length}</b></div></div><div class="callout" style="margin-top:12px">Un vol long-courrier exige plus de PNC que le minimum régional. L’absence d’équipage qualifié ou d’avion disponible entraîne une annulation simulée.</div>`,`Équipages et rotations`)}${panel('Avancer la simulation',`<p class="muted" style="font-size:12px;line-height:1.5">En avançant d’un jour, les vols programmés sont opérés, les revenus et charges calculés, la fatigue mise à jour, les échéances traitées et le planning quotidien renouvelé pour les lignes en programmation automatique.</p><div class="form-actions"><button class="btn primary wide" onclick="advanceDay()">▶ Simuler le jour ${S.day}</button><button class="btn wide" onclick="advanceWeek()">Fin de semaine →</button></div>`,`La simulation reste sous votre contrôle`)}</div></div><p class="footer-note">Le planning sert à la simulation de gestion et ne remplace pas un système de dispatch certifié, les contraintes de temps de service, le contrôle aérien, les NOTAM ou la préparation opérationnelle réelle.</p>`}
function drawWeeklyStrip(){let box=document.getElementById('weekly-strip');if(!box)return;const names=['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'];box.innerHTML=names.map((n,i)=>{let d=S.day+((i-((S.day-1)%7)+7)%7);let count=S.flights.filter(f=>f.day===d&&f.status==='Programmé').length;return `<button class="btn ${d===(selectedPlanningDay===null?S.day:selectedPlanningDay)?'primary':''}" style="padding:8px 2px;display:flex;flex-direction:column;gap:5px" onclick="selectPlanningDay(${d})"><span>${n}</span><b>${d}</b><span class="pill ${count?'orange':''}" style="padding:3px 5px">${count} vol</span></button>`}).join('')}
function selectPlanningDay(day){selectedPlanningDay=day;scheduleSave();render();toast(`Planning du jour ${day} affiché. La date de simulation reste J${S.day}.`)}
function openFlightForm(prefRoute=''){if(!S.routes.some(r=>r.status==='Ouverte')){toast('Ouvrez une ligne avant de programmer un vol.','bad');setTab('routes');return}modal('Programmer un vol',`<form onsubmit="createFlight(event)"><div class="form-grid"><div class="field span2"><label>Ligne</label><select id="flight-route" required>${S.routes.filter(r=>r.status==='Ouverte').map(r=>`<option value="${r.id}" ${r.id===prefRoute?'selected':''}>${routeFlag(r)} ${r.origin} → ${r.dest} · ${fmt(r.km)} km</option>`).join('')}</select></div><div class="field"><label>Jour de simulation</label><input id="flight-day" type="number" min="${S.day}" value="${S.day}" required></div><div class="field"><label>Heure locale de départ</label><input id="flight-time" type="time" value="10:00" required></div><div class="field span2"><label>Appareil</label><select id="flight-aircraft" required>${aircraftOptions(S.fleet[0]?.id)}</select></div><div class="field"><label>Porte / stand</label><input id="flight-gate" value="A03" maxlength="8"></div><div class="field"><label>Type de rotation</label><select id="flight-kind"><option value="standard">Vol régulier</option><option value="extra">Vol additionnel</option><option value="charter">Charter</option></select></div><div class="field span2"><label>Note opérationnelle</label><textarea id="flight-note" placeholder="Rotation, correspondances, remarques…"></textarea></div></div><div class="form-actions"><button class="btn primary" type="submit">Ajouter au planning</button></div></form>`,`<button class="btn" onclick="closeModal()">Annuler</button>`)}
function createFlight(e){e.preventDefault();let route=document.getElementById('flight-route').value,day=Number(document.getElementById('flight-day').value),aircraft=document.getElementById('flight-aircraft').value,time=document.getElementById('flight-time').value;if(!getRoute(route)||!getPlane(aircraft)){toast('Ligne ou appareil manquant.','bad');return}let same=S.flights.filter(f=>f.day===day&&f.aircraft===aircraft&&f.status==='Programmé');if(same.some(f=>{let min=Math.abs(timeMinutes(f.time)-timeMinutes(time));return min<90})){if(!confirm('Cet appareil a déjà un vol à moins de 90 minutes de cet horaire. Programmer quand même ?'))return}let f={id:uid('VOL'),route,aircraft,day,time,status:'Programmé',crew:[],gate:document.getElementById('flight-gate').value||'—',note:document.getElementById('flight-note').value,kind:document.getElementById('flight-kind').value};f.crew=autoCrew(f);S.flights.push(f);log('Vol ajouté au planning',`${time} · ${getRoute(route).origin}–${getRoute(route).dest} · ${getPlane(aircraft).registration}.`,'Opérations');scheduleSave();closeModal();render();toast('Vol programmé avec un équipage pré-affecté si disponible.')}
function timeMinutes(t){let x=String(t||'00:00').split(':').map(Number);return(x[0]||0)*60+(x[1]||0)}
function autoCrew(f){let r=getRoute(f.route),plane=getPlane(f.aircraft);if(!r||!plane)return[];let requiredPnc=plane.seats>250?8:plane.seats>160?4:plane.seats>90?3:2;let onDay=S.flights.filter(x=>x.day===f.day&&x.id!==f.id&&x.status==='Programmé').flatMap(x=>x.crew||[]);let available=job=>S.people.filter(p=>p.job===job&&p.status==='Actif'&&!onDay.includes(p.id)).sort((a,b)=>a.fatigue-b.fatigue||b.morale-a.morale);let pnt=available('PNT').slice(0,2),pnc=available('PNC').slice(0,requiredPnc);return [...pnt,...pnc].map(p=>p.id)}
function editFlight(id){let f=S.flights.find(x=>x.id===id);if(!f)return;let a=getPlane(f.aircraft);let requiredPnc=a?(a.seats>250?8:a.seats>160?4:a.seats>90?3:2):2;modal(`Modifier le vol ${f.id}`,`<form onsubmit="saveFlightEdit(event,'${id}')"><div class="form-grid"><div class="field"><label>Jour</label><input type="number" min="${S.day}" id="ef-day" value="${f.day}"></div><div class="field"><label>Départ</label><input type="time" id="ef-time" value="${f.time}"></div><div class="field span2"><label>Appareil</label><select id="ef-aircraft">${aircraftOptions(f.aircraft)}</select></div><div class="field"><label>Porte / stand</label><input id="ef-gate" value="${esc(f.gate||'')}"></div><div class="field"><label>État</label><select id="ef-status">${['Programmé','Réalisé','Annulé','Retardé'].map(x=>`<option ${x===f.status?'selected':''}>${x}</option>`).join('')}</select></div><div class="field span2"><label>Note opérationnelle</label><textarea id="ef-note">${esc(f.note||'')}</textarea></div><div class="field span2"><label>PNT · sélection multiple</label><select id="ef-pnt" multiple size="5">${staffOptions('PNT',f.crew||[])}</select><small class="sub">Maintenir une sélection multiple selon votre navigateur mobile peut être difficile.</small></div><div class="field span2"><label>PNC · sélection multiple</label><select id="ef-pnc" multiple size="7">${staffOptions('PNC',f.crew||[])}</select></div><div class="field span2"><label>Agents au sol · sélection multiple facultative</label><select id="ef-ground" multiple size="5">${S.people.filter(p=>['AGENT D’ESCALE','AGENT DE PISTE','TECHNICIEN'].includes(p.job)&&p.status==='Actif').map(p=>`<option value="${p.id}" ${(f.crew||[]).includes(p.id)?'selected':''}>${esc(p.first)} ${esc(p.last)} · ${esc(p.job)}</option>`).join('')}</select></div></div><div class="callout info" style="margin-top:12px">Effectif cabine minimal théorique simplifié dans le jeu : ${requiredPnc} PNC pour cet appareil de catégorie ${a?esc(a.model):'—'}.</div><div class="form-actions"><button class="btn primary" type="submit">Enregistrer la rotation</button><button class="btn" type="button" onclick="f.crew=autoCrew(f);toast('Équipage proposé.');editFlight('${id}')">Proposer un équipage</button></div></form>`,`<button class="btn" onclick="closeModal()">Annuler</button>`)}
function saveFlightEdit(e,id){e.preventDefault();let f=S.flights.find(x=>x.id===id);if(!f)return;f.day=Number(document.getElementById('ef-day').value);f.time=document.getElementById('ef-time').value;f.aircraft=document.getElementById('ef-aircraft').value;f.gate=document.getElementById('ef-gate').value;f.status=document.getElementById('ef-status').value;f.note=document.getElementById('ef-note').value;f.crew=['ef-pnt','ef-pnc','ef-ground'].flatMap(k=>Array.from(document.getElementById(k).selectedOptions).map(o=>o.value));scheduleSave();closeModal();render();toast('Rotation et équipage enregistrés.')}
function cancelFlight(id){let f=S.flights.find(x=>x.id===id);if(!f||f.status!=='Programmé')return;if(!confirm('Annuler ce vol ? Les passagers et les coûts seront impactés dans la simulation.'))return;f.status='Annulé';S.cancelled++;S.reputation=Math.max(0,S.reputation-1);log('Vol annulé',`${f.id} a été retiré du programme par la direction.`,'Opérations');scheduleSave();render()}
function generateWeekSchedule(){let added=0,days=Array.from({length:7},(_,i)=>S.day+i),times=['06:40','08:15','10:05','12:40','14:50','17:10','19:25','21:05'];for(let d of days){for(let r of S.routes.filter(r=>r.status==='Ouverte'&&r.autoSchedule!==false)){let existing=S.flights.filter(f=>f.day===d&&f.route===r.id&&f.status!=='Annulé').length;for(let i=existing;i<r.frequency;i++){let plane=S.fleet.find(a=>a.id===r.aircraft&&a.status==='Disponible')||S.fleet.find(a=>a.status==='Disponible');if(!plane)break;let time=times[(i+((r.origin.charCodeAt(0)||0)%4))%times.length];let f={id:uid('VOL'),route:r.id,aircraft:plane.id,day:d,time,status:'Programmé',crew:[],gate:'A'+String(i+2).padStart(2,'0'),note:'Vol régulier généré depuis la fréquence de ligne',kind:'standard'};f.crew=autoCrew(f);S.flights.push(f);if(!r.aircraft)r.aircraft=plane.id;added++}}}scheduleSave();render();toast(`${added} vol(s) ajouté(s) au planning glissant.`)}
function advanceDay(){selectedPlanningDay=null;if(!confirm(`Lancer la simulation du jour ${S.day} ? Les vols programmés seront exécutés et les transactions comptabilisées.`))return;let day=S.day;let today=S.flights.filter(f=>f.day===day&&f.status==='Programmé');let before=S.cash;today.sort((a,b)=>a.time.localeCompare(b.time)).forEach(f=>operateFlight(f));let interest=S.debt*S.interest/365;if(interest>0)moneyTxn('Intérêts bancaires quotidiens',-interest,'Financement');if(day%30===0){let payroll=S.people.filter(p=>p.status==='Actif').reduce((n,p)=>n+p.salary,0);let leasing=S.fleet.reduce((n,a)=>n+a.monthlyLease,0);if(payroll)moneyTxn('Paie mensuelle et charges de personnel',-payroll*1.36,'Personnel');if(leasing)moneyTxn('Loyers mensuels des aéronefs',-leasing,'Leasing');for(let l of S.loans){let monthly=l.principal*(l.rate/12);moneyTxn(`Échéance d’intérêt · ${l.bank}`,-monthly,'Financement')}}if(day%7===0){S.week++;weeklyClose()}S.day++;S.profitToday=S.cash-before;refreshDailySchedule();S.people.forEach(p=>{p.fatigue=Math.min(100,p.fatigue+(Math.random()<.75?2:1));if(p.fatigue>80){p.morale=Math.max(15,p.morale-2)}else if(p.fatigue<35){p.morale=Math.min(100,p.morale+1)}if(p.job==='PNT'&&p.hours>500){p.license=p.license.replace('à renouveler','')}});if(S.cash<0){S.reputation=Math.max(0,S.reputation-3);log('Tension de trésorerie',`La trésorerie est négative (${eur(S.cash)}). Envisagez un financement ou réduisez les charges.`,'Finances')}else if(S.cash<5000000){log('Alerte trésorerie',`La trésorerie descend sous 5 M€ (${eur(S.cash)}).`,'Finances')}log('Clôture quotidienne',`${today.filter(f=>f.status==='Réalisé').length} vol(s) réalisés, ${today.filter(f=>f.status==='Annulé').length} annulé(s). Solde : ${eur(S.cash)}.`,'Opérations');scheduleSave();render();toast(`Jour ${day} simulé · résultat net de la journée ${eur(S.cash-before)}.`)}
function operateFlight(f){let r=getRoute(f.route),a=getPlane(f.aircraft);if(!r||!a||a.status==='En maintenance'){f.status='Annulé';S.cancelled++;S.reputation=Math.max(0,S.reputation-1);log('Vol annulé',`${f.id} : aucun appareil disponible pour la rotation.`,'Opérations');return}let defs=aircraftDef(a),crew=(f.crew||[]).map(getStaff).filter(p=>p&&p.status==='Actif');let pilots=crew.filter(p=>p.job==='PNT').length,cabin=crew.filter(p=>p.job==='PNC').length,requiredCabin=defs.seats>250?8:defs.seats>160?4:defs.seats>90?3:2;if(pilots<2||cabin<requiredCabin){f.status='Annulé';S.cancelled++;S.company.service=Math.max(0,S.company.service-2);S.reputation=Math.max(0,S.reputation-2);moneyTxn(`Indemnisation / frais d’annulation · ${f.id}`,-Math.min(6500,1300+r.km*.9),'Opérations');log('Annulation équipage insuffisant',`${f.id} annulé : ${pilots}/2 PNT et ${cabin}/${requiredCabin} PNC.`,'RH');return}let overlap=S.flights.filter(x=>x.id!==f.id&&x.day===f.day&&x.status==='Réalisé'&&(x.crew||[]).some(id=>(f.crew||[]).includes(id)));if(overlap.length){f.status='Annulé';S.cancelled++;log('Conflit de rotation',`${f.id} annulé : conflit d’affectation d’au moins un membre d’équipage.`,'Opérations');return}let pax=Math.max(0,Math.round(defs.seats*r.load/100*(.82+Math.random()*.35)*(r.demand/72)));pax=Math.min(defs.seats,pax);let revenue=pax*r.fare;if(f.kind==='charter')revenue*=1.18;let fuelLitres=r.km*defs.burn/100;let fuelSupplier=S.suppliers.filter(x=>x.category==='Carburant').sort((a,b)=>a.price-b.price)[0];let fuelPrice=fuelSupplier?fuelSupplier.price:S.settings.fuelPrice;let fuel=fuelLitres*fuelPrice;let airport=r.feeOrigin+r.feeDest+r.taxOrigin+r.taxDest;let ground=S.suppliers.filter(x=>x.category==='Assistance au sol').sort((a,b)=>a.price-b.price)[0];let catering=S.suppliers.filter(x=>x.category==='Catering').sort((a,b)=>a.price-b.price)[0];let handling=ground?ground.price*2:3000,cater=pax*(catering?catering.price:13)*(S.company.service/100+.3);let maint=r.km*defs.maint/100;let crewCost=crew.reduce((n,p)=>n+p.salary/30/Math.max(1,(p.job==='PNT'?2:p.job==='PNC'?3:4)),0);let costs=fuel+airport+handling+cater+maint+crewCost;let margin=revenue-costs;moneyTxn(`Recettes passagers · ${f.id}`,revenue,'Ventes');moneyTxn(`Carburant · ${f.id}`,-fuel,'Carburant');moneyTxn(`Redevances et taxes · ${f.id}`,-airport,'Aéroport');moneyTxn(`Assistance au sol · ${f.id}`,-handling,'Prestataires');moneyTxn(`Catering · ${f.id}`,-cater,'Catering');moneyTxn(`Maintenance variable · ${f.id}`,-maint,'Maintenance');moneyTxn(`Équipage · ${f.id}`,-crewCost,'Personnel');f.status='Réalisé';f.actualPax=pax;f.revenue=revenue;f.costs=costs;f.margin=margin;f.fuel=fuel;a.cycles++;a.condition=Math.max(20,a.condition-(.10+r.km/20000));a.nextMaintenance=Math.max(0,a.nextMaintenance-r.block);crew.forEach(p=>{p.hours+=r.block;p.fatigue=Math.min(100,p.fatigue+Math.ceil(r.block*3));p.assigned.push(f.id)});S.passengers+=pax;S.flightsCompleted++;S.company.service=Math.max(20,Math.min(100,S.company.service+(margin>0?0.15:-.25)));S.reputation=Math.max(0,Math.min(100,S.reputation+(margin>0&&pax>defs.seats*.65?.1:-.15)));r.demand=Math.max(15,Math.min(100,r.demand+(margin>0?1:-2)));log('Vol réalisé',`${f.id} · ${r.origin}–${r.dest} : ${pax} passagers, CA ${eur(revenue)}, résultat opérationnel ${eur(margin)}.`,'Opérations')}
function refreshDailySchedule(){let times=['06:40','08:15','10:05','12:40','14:50','17:10','19:25','21:05'];for(let r of S.routes.filter(r=>r.status==='Ouverte'&&r.autoSchedule!==false)){let active=S.flights.filter(f=>f.day===S.day&&f.route===r.id&&f.status!=='Annulé');for(let i=active.length;i<r.frequency;i++){let a=getPlane(r.aircraft)||S.fleet.find(a=>a.status==='Disponible');if(!a)break;let f={id:uid('VOL'),route:r.id,aircraft:a.id,day:S.day,time:times[i%times.length],status:'Programmé',crew:[],gate:'A'+String(i+2).padStart(2,'0'),note:'Rotation régulière'};f.crew=autoCrew(f);S.flights.push(f)}}}
function weeklyClose(){let renegotiable=S.suppliers.filter(s=>s.lastOfferWeek!==S.week);if(renegotiable.length)toast(`Nouvelle semaine : ${renegotiable.length} contrat(s) fournisseur à renégocier.`);if(S.people.some(p=>p.morale<35&&p.status==='Actif')){S.reputation=Math.max(0,S.reputation-1);log('Climat social sous tension','Plusieurs salariés ont un moral faible. Vérifiez les rotations, les heures et les repos.','RH')}S.weeklyStats.push({week:S.week,cash:S.cash,passengers:S.passengers,profit:S.revenueTotal-S.costTotal});if(S.weeklyStats.length>52)S.weeklyStats.shift();log('Comité hebdomadaire',`Semaine ${S.week} : ${S.flightsCompleted} vol(s) réalisés au total, ${fmt(S.passengers)} passagers transportés.`,'Direction')}
function advanceWeek(){selectedPlanningDay=null;if(!confirm('Simuler la semaine entière ? Tous les vols programmés des 7 prochains jours seront exécutés automatiquement.'))return;let until=S.day+7;let net=0;while(S.day<until){let before=S.cash;let today=S.flights.filter(f=>f.day===S.day&&f.status==='Programmé');today.forEach(f=>operateFlight(f));let interest=S.debt*S.interest/365;if(interest>0)moneyTxn('Intérêts bancaires quotidiens',-interest,'Financement');if(S.day%30===0){let payroll=S.people.filter(p=>p.status==='Actif').reduce((n,p)=>n+p.salary,0),leases=S.fleet.reduce((n,a)=>n+a.monthlyLease,0);if(payroll)moneyTxn('Paie mensuelle et charges sociales',-payroll*1.36,'Personnel');if(leases)moneyTxn('Loyers mensuels',-leases,'Leasing')}if(S.day%7===0){S.week++;weeklyClose()}S.day++;refreshDailySchedule();S.people.forEach(p=>{p.fatigue=Math.max(0,Math.min(100,p.fatigue-1))});net+=S.cash-before}log('Simulation accélérée',`Semaine avancée. Variation de trésorerie : ${eur(net)}.`,'Direction');scheduleSave();render();toast(`Semaine simulée · variation de trésorerie ${eur(net)}.`)}
function renderPeople(){let active=S.people.filter(p=>p.status==='Actif');return pageHead('Ressources humaines · effectifs','Personnel','Recrutez des PNT, PNC, agents d’escale, agents de piste, techniciens et responsables. Chaque salarié possède un dossier individuel, des heures, des repos et un niveau de fatigue.','<button class="btn primary" onclick="openHireForm()">＋ Recruter</button><button class="btn" onclick="setTab(\'hr\')">Service RH →</button>')+`<div class="grid g4" style="margin-bottom:16px">${metric('Effectif total',active.length,'Salariés actifs','')}${metric('Masse salariale mensuelle',eur(active.reduce((n,p)=>n+p.salary,0)),'Hors charges employeur','orange')}${metric('Moral moyen',pct(active.length?active.reduce((n,p)=>n+p.morale,0)/active.length:0),'Indicateur social','blue')}${metric('Fatigue moyenne',pct(active.length?active.reduce((n,p)=>n+p.fatigue,0)/active.length:0),'Surveillance des rotations','gold')}</div><section class="panel"><div class="panel-head"><div><h2>Registre du personnel</h2><p>Identité, poste, qualification, rémunération et affectations.</p></div><div class="table-actions"><button class="btn small" onclick="exportCSV('people')">Exporter CSV</button><button class="btn small" onclick="openHireForm()">＋ Ajouter</button></div></div><div class="map-toolbar"><input class="search-input" placeholder="Rechercher un nom, prénom, matricule…" oninput="filterPeople(this.value)" id="people-search"><select class="search-input" style="max-width:180px" onchange="filterPeople(document.getElementById('people-search').value,this.value)" id="people-filter"><option value="all">Tous les postes</option>${['PNT','PNC','AGENT D’ESCALE','AGENT DE PISTE','TECHNICIEN','RH'].map(j=>`<option>${j}</option>`).join('')}</select></div><div class="table-wrap"><table><thead><tr><th>Salarié</th><th>Fonction</th><th>Qualification</th><th>Contrat</th><th>Salaire brut / mois</th><th>Moral</th><th>Fatigue</th><th>Heures</th><th>Statut</th><th></th></tr></thead><tbody id="people-tbody">${peopleRows(S.people)}</tbody></table></div></section><div class="grid g2" style="margin-top:15px">${panel('Répartition par métier',`<div class="grid g2">${['PNT','PNC','AGENT D’ESCALE','AGENT DE PISTE','TECHNICIEN','RH'].map(j=>`<div class="mini-kpi"><span>${j}</span><b>${active.filter(p=>p.job===j).length}</b><div class="progress" style="margin-top:8px"><span style="width:${active.length?active.filter(p=>p.job===j).length/active.length*100:0}%"></span></div></div>`).join('')}</div>`,`Structure des effectifs`)}${panel('Recommandations RH',`<div class="timeline">${[{title:'PNT',body:'Deux pilotes sont nécessaires par vol dans les règles simplifiées du jeu.'},{title:'PNC',body:'L’effectif cabine augmente avec la capacité de l’appareil.'},{title:'Équilibre social',body:'Une fatigue forte réduit le moral. Prévoyez des jours de repos et des rotations.'},{title:'Masse salariale',body:'Le simulateur enregistre la paie mensuelle et un coefficient simplifié de charges patronales.'}].map((x,i)=>`<div class="timeline-item"><div class="timeline-time">${['OPS','CAB','QVT','PAIE'][i]}</div><div class="timeline-rail"><div class="timeline-dot"></div><div class="timeline-stem"></div></div><div class="timeline-text"><b>${x.title}</b><p>${x.body}</p></div></div>`).join('')}</div>`,`Rappels de gestion`)}</div>`}
function peopleRows(items){return items.map(p=>`<tr data-person-row="${esc(p.id)}"><td><div class="roster-name"><div class="initials">${esc((p.first[0]||'')+(p.last[0]||''))}</div><div><b>${esc(p.first)} ${esc(p.last)}</b><div class="sub">${esc(p.id)} · ${esc(p.base)}</div></div></div></td><td><b>${esc(p.job)}</b><div class="sub">${esc(p.title)}</div></td><td>${esc(p.license)}</td><td>${esc(p.contract)}<div class="sub">Repos : ${p.leave} j</div></td><td class="money">${eur(p.salary)}</td><td><span class="pill ${p.morale<40?'red':p.morale<60?'orange':'green'}">${p.morale}/100</span></td><td><span class="pill ${p.fatigue>75?'red':p.fatigue>50?'orange':'green'}">${p.fatigue}/100</span></td><td>${fmt(p.hours)} h</td><td><span class="pill ${p.status==='Actif'?'green':'orange'}">${esc(p.status)}</span></td><td><button class="btn small" onclick="employeeProfile('${p.id}')">Dossier</button></td></tr>`).join('')||`<tr><td colspan="10">${empty('Aucun salarié','Recrutez la première personne de votre compagnie.')}</td></tr>`}
function filterPeople(q='',job='all'){q=q.toLowerCase();let items=S.people.filter(p=>(job==='all'||p.job===job)&&(`${p.first} ${p.last} ${p.job} ${p.id} ${p.license}`).toLowerCase().includes(q));let body=document.getElementById('people-tbody');if(body)body.innerHTML=peopleRows(items)}
function openHireForm(){modal('Recruter un salarié',`<form onsubmit="hireEmployee(event)"><div class="form-grid"><div class="field"><label>Prénom</label><input id="hire-first" required placeholder="Ex. Camille" maxlength="40"></div><div class="field"><label>Nom</label><input id="hire-last" required placeholder="Ex. Martin" maxlength="50"></div><div class="field"><label>Service / métier</label><select id="hire-job" onchange="updateSalaryHint()">${staffTemplates.map(t=>`<option value="${t[0]}">${t[0]} · ${t[1]}</option>`).join('')}</select></div><div class="field"><label>Fonction précise</label><input id="hire-title" placeholder="Fonction dans l’organigramme"></div><div class="field"><label>Salaire brut mensuel (€)</label><input id="hire-salary" type="number" value="2550" min="1200" max="30000" required></div><div class="field"><label>Contrat</label><select id="hire-contract"><option>CDI</option><option>CDD</option><option>Intérim</option><option>Temps partiel</option><option>Prestataire</option></select></div><div class="field"><label>Base opérationnelle</label><input id="hire-base" value="${esc(S.company.base)}" maxlength="4"></div><div class="field"><label>Qualification / habilitation</label><input id="hire-license" placeholder="Ex. ATPL(A) · A320"></div></div><div class="callout info" style="margin-top:13px">Le recrutement augmente la masse salariale. Les qualifications sont renseignées dans le dossier de simulation et ne certifient aucune compétence réelle.</div><div class="form-actions"><button class="btn primary" type="submit">Valider l’embauche</button></div></form>`,`<button class="btn" onclick="closeModal()">Annuler</button>`)}
function updateSalaryHint(){let j=document.getElementById('hire-job')?.value,t=staffTemplates.find(t=>t[0]===j);if(t)document.getElementById('hire-salary').value=t[2];if(j==='PNT')document.getElementById('hire-license').placeholder='ATPL(A) · Type avion';else if(j==='PNC')document.getElementById('hire-license').placeholder='CCA valide';else document.getElementById('hire-license').placeholder='Habilitation opérationnelle'}
function hireEmployee(e){e.preventDefault();let job=document.getElementById('hire-job').value,person=makePerson(job,document.getElementById('hire-first').value.trim(),document.getElementById('hire-last').value.trim(),Number(document.getElementById('hire-salary').value));person.title=document.getElementById('hire-title').value.trim()||person.title;person.contract=document.getElementById('hire-contract').value;person.base=(document.getElementById('hire-base').value||S.company.base).toUpperCase();person.license=document.getElementById('hire-license').value.trim()||person.license;person.joined=S.day;S.people.unshift(person);log('Embauche',`${person.first} ${person.last} rejoint l’effectif comme ${person.title}. Salaire brut : ${eur(person.salary)}/mois.`,'RH');scheduleSave();closeModal();render();toast(`${person.first} ${person.last} ajouté(e) au registre.`)}
function employeeProfile(id){let p=getStaff(id);if(!p)return;let assignments=S.flights.filter(f=>(f.crew||[]).includes(id)).slice(-8).reverse();modal(`Dossier salarié · ${p.first} ${p.last}`,`<div class="hr-profile"><div class="profile-photo">${esc(p.first[0]+p.last[0])}</div><div><div class="eyebrow">${esc(p.job)} · ${esc(p.id)}</div><h2 style="margin:5px 0 6px;font-size:24px">${esc(p.first)} ${esc(p.last)}</h2><div class="sub">${esc(p.title)} · ${esc(p.base)} · embauche J${p.joined}</div><div style="margin-top:9px;display:flex;gap:6px;flex-wrap:wrap"><span class="pill ${p.status==='Actif'?'green':'orange'}">${esc(p.status)}</span><span class="pill">${esc(p.contract)}</span><span class="pill blue">${esc(p.license)}</span></div></div></div><div class="grid g3" style="margin:16px 0"><div class="mini-kpi"><span>Salaire brut / mois</span><b>${eur(p.salary)}</b></div><div class="mini-kpi"><span>Moral</span><b>${p.morale}/100</b></div><div class="mini-kpi"><span>Fatigue</span><b>${p.fatigue}/100</b></div><div class="mini-kpi"><span>Heures enregistrées</span><b>${fmt(p.hours)} h</b></div><div class="mini-kpi"><span>Congés disponibles</span><b>${p.leave} j</b></div><div class="mini-kpi"><span>Formation</span><b>${p.training}/5</b></div></div><h3 style="font-size:14px">Historique de rotations</h3>${assignments.length?`<div class="table-wrap"><table><thead><tr><th>Jour</th><th>Heure</th><th>Ligne</th><th>État</th></tr></thead><tbody>${assignments.map(f=>{let r=getRoute(f.route);return `<tr><td>J${f.day}</td><td>${esc(f.time)}</td><td>${r?esc(r.origin)+'–'+esc(r.dest):'—'}</td><td>${esc(f.status)}</td></tr>`}).join('')}</tbody></table></div>`:'<p class="muted" style="font-size:12px">Aucune rotation associée.</p>'}<div class="form-actions"><button class="btn primary" onclick="raiseEmployee('${p.id}');closeModal()">Proposer une augmentation</button><button class="btn" onclick="employeeTraining('${p.id}');closeModal()">Planifier une formation</button><button class="btn" onclick="employeeLeave('${p.id}');closeModal()">Congés / repos</button><button class="btn danger" onclick="dismissEmployee('${p.id}');closeModal()">Fin de contrat</button></div>`,`<button class="btn" onclick="closeModal()">Fermer</button>`)}
function raiseEmployee(id){let p=getStaff(id);if(!p)return;modal('Entretien de rémunération',`<form onsubmit="saveRaise(event,'${id}')"><div class="callout info" style="margin-bottom:12px">Salarié : ${esc(p.first)} ${esc(p.last)} · Salaire brut actuel : ${eur(p.salary)} par mois.</div><div class="field"><label>Nouveau salaire brut mensuel (€)</label><input id="raise-salary" type="number" min="${Math.round(p.salary*.9)}" max="50000" value="${Math.round(p.salary*1.06)}"></div><div class="field" style="margin-top:10px"><label>Motif</label><select id="raise-reason"><option>Performance et ancienneté</option><option>Promotion</option><option>Rétention de compétence</option><option>Alignement marché (simulation)</option></select></div><div class="form-actions"><button class="btn primary" type="submit">Valider la proposition</button></div></form>`,`<button class="btn" onclick="closeModal()">Annuler</button>`)}
function saveRaise(e,id){e.preventDefault();let p=getStaff(id),old=p.salary;p.salary=Number(document.getElementById('raise-salary').value);let reason=document.getElementById('raise-reason').value;p.morale=Math.min(100,p.morale+4);moneyTxn(`Prime ponctuelle / ajustement RH · ${p.first} ${p.last}`,-Math.max(0,p.salary-old)*.5,'Personnel');log('Évolution salariale',`${p.first} ${p.last} : salaire brut passé de ${eur(old)} à ${eur(p.salary)}. Motif : ${reason}.`,'RH');scheduleSave();closeModal();render();toast('Salaire mis à jour.')}
function employeeTraining(id){let p=getStaff(id);if(!p)return;let cost=p.job==='PNT'?6500:p.job==='PNC'?1800:950;modal('Plan de formation',`<p class="muted" style="line-height:1.6">Formation de ${esc(p.first)} ${esc(p.last)} · ${esc(p.title)}. La session améliore les compétences simulées, le moral et l’employabilité.</p><div class="grid g2"><div class="mini-kpi"><span>Coût de la session</span><b>${eur(cost)}</b></div><div class="mini-kpi"><span>Palier actuel</span><b>${p.training}/5</b></div></div><form onsubmit="completeTraining(event,'${id}',${cost})"><div class="field" style="margin-top:12px"><label>Module</label><select id="training-module"><option>Recyclage / habilitations</option><option>Leadership et coordination</option><option>Sécurité et facteurs humains</option><option>Formation métier avancée</option></select></div><div class="form-actions"><button class="btn primary" type="submit">Inscrire à la formation</button></div></form>`,`<button class="btn" onclick="closeModal()">Annuler</button>`)}
function completeTraining(e,id,cost){e.preventDefault();let p=getStaff(id);if(S.cash<cost){toast('Trésorerie insuffisante pour financer la formation.','bad');return}let module=document.getElementById('training-module').value;moneyTxn(`Formation · ${p.first} ${p.last}`,-cost,'RH');p.training=Math.min(5,p.training+1);p.morale=Math.min(100,p.morale+6);p.fatigue=Math.max(0,p.fatigue-5);p.license=p.license.includes('Formation')?p.license:p.license+' · Formation '+p.training;log('Formation réalisée',`${p.first} ${p.last} a suivi : ${module}.`,'RH');closeModal();scheduleSave();render();toast('Formation enregistrée.')}
function employeeLeave(id){let p=getStaff(id);if(!p)return;modal('Repos et congés',`<form onsubmit="saveLeave(event,'${id}')"><div class="grid g2"><div class="mini-kpi"><span>Congés disponibles</span><b>${p.leave} jours</b></div><div class="mini-kpi"><span>Repos préférés</span><b>${(p.daysOff||[]).join(', ')}</b></div></div><div class="field" style="margin-top:12px"><label>Type de demande</label><select id="leave-type"><option value="paid">Congé payé</option><option value="rest">Repos / récupération</option><option value="sick">Absence maladie (simulation)</option></select></div><div class="field" style="margin-top:10px"><label>Nombre de jours</label><input id="leave-days" type="number" min="1" max="14" value="2"></div><div class="field" style="margin-top:10px"><label>Commentaire RH</label><input id="leave-note" placeholder="Motif ou note confidentielle"></div><div class="form-actions"><button class="btn primary" type="submit">Enregistrer la demande</button></div></form>`,`<button class="btn" onclick="closeModal()">Annuler</button>`)}
function saveLeave(e,id){e.preventDefault();let p=getStaff(id),type=document.getElementById('leave-type').value,days=Number(document.getElementById('leave-days').value);if(type==='paid'&&days>p.leave){toast('Solde de congés insuffisant.','bad');return}if(type==='paid')p.leave-=days;p.fatigue=Math.max(0,p.fatigue-days*5);p.morale=Math.min(100,p.morale+days*2);p.rotation=`Absence ${type} · ${days}j`;log('Demande d’absence enregistrée',`${p.first} ${p.last} : ${type}, ${days} jour(s). ${document.getElementById('leave-note').value}`,'RH');scheduleSave();closeModal();render();toast('Demande d’absence enregistrée dans le dossier.')}
function dismissEmployee(id){let p=getStaff(id);if(!p)return;if(!confirm(`Mettre fin au contrat de ${p.first} ${p.last} ? Cette action retire la personne des prochains équipages.`))return;p.status='Sorti';p.morale=0;log('Sortie d’effectif',`${p.first} ${p.last} (${p.job}) a quitté l’effectif dans la simulation.`,'RH');scheduleSave();render();toast('Dossier salarié clôturé.');}
function renderHR(){let active=S.people.filter(p=>p.status==='Actif'),salary=active.reduce((n,p)=>n+p.salary,0),tired=active.filter(p=>p.fatigue>70),lowMorale=active.filter(p=>p.morale<45);return pageHead('Direction des ressources humaines','Service RH','Un espace RH renforcé : organigramme, contrats, rémunérations, temps de service, repos, fatigue, formations, absences et planning des rotations.','<button class="btn primary" onclick="openHireForm()">＋ Recruter</button><button class="btn" onclick="openPayrollReport()">Bulletin de paie</button>')+`<div class="grid g4" style="margin-bottom:16px">${metric('Salariés actifs',active.length,'Tous métiers','')}${metric('Masse brute mensuelle',eur(salary),'Hors charges employeur','orange')}${metric('Charges sociales estimées',eur(salary*.36),'Coefficient de simulation','blue')}${metric('Postes à surveiller',tired.length+lowMorale.length,'Fatigue forte ou moral bas','gold')}</div><div class="grid g2"><div class="grid" style="align-content:start;gap:15px">${panel('Planning individuel des équipes',active.length?`<div class="table-wrap"><table><thead><tr><th>Salarié</th><th>Poste</th><th>Rotation / disponibilité</th><th>Fatigue</th><th></th></tr></thead><tbody>${active.map(p=>`<tr><td><b>${esc(p.first)} ${esc(p.last)}</b><div class="sub">${esc(p.id)}</div></td><td>${esc(p.job)}</td><td>${esc(p.rotation||'Régulière')}<div class="sub">Repos préférés : ${(p.daysOff||[]).join(', ')}</div></td><td><span class="pill ${p.fatigue>70?'red':p.fatigue>45?'orange':'green'}">${p.fatigue}/100</span></td><td><button class="btn small" onclick="editRoster('${p.id}')">Planning</button></td></tr>`).join('')}</tbody></table></div>`:empty('Aucun salarié','Recrutez avant de configurer les plannings.'),`Plannings, jours de repos et roulements`)}${panel('Prévision des charges',`<div class="grid g2"><div class="mini-kpi"><span>Salaires bruts</span><b>${eur(salary)}</b></div><div class="mini-kpi"><span>Charges employeur (jeu)</span><b>${eur(salary*.36)}<
