/b></div><div class="mini-kpi"><span>Coût employeur estimé</span><b>${eur(salary*1.36)}</b></div><div class="mini-kpi"><span>Coût annuel estimé</span><b>${moneyM(salary*1.36*12)}</b></div></div><div class="callout warning" style="margin-top:12px">La paie est simulée, sans bulletin légal ni calcul de cotisations réglementaires. Utilisez une solution de paie agréée pour une véritable entreprise.</div>`,`Scénario de coût de personnel`)}</div><div class="grid" style="align-content:start;gap:15px">${panel('Tableau de bord social',`<div class="grid g2"><div class="mini-kpi"><span>Moral moyen</span><b>${fmt(active.length?active.reduce((n,p)=>n+p.morale,0)/active.length:0)}/100</b></div><div class="mini-kpi"><span>Fatigue moyenne</span><b>${fmt(active.length?active.reduce((n,p)=>n+p.fatigue,0)/active.length:0)}/100</b></div><div class="mini-kpi"><span>Formation moyenne</span><b>${fmt(active.length?active.reduce((n,p)=>n+p.training,0)/active.length:0)}/5</b></div><div class="mini-kpi"><span>Congés restants</span><b>${fmt(active.reduce((n,p)=>n+p.leave,0))} j</b></div></div><h3 style="font-size:13px;margin:18px 0 10px">Signaux individuels</h3>${tired.slice(0,5).map(p=>`<div class="vendor-row"><div class="initials">${esc(p.first[0]+p.last[0])}</div><div style="flex:1"><div class="vendor-name">${esc(p.first)} ${esc(p.last)}</div><div class="vendor-desc">Fatigue : ${p.fatigue}/100 · ${esc(p.job)}</div></div><button class="btn small" onclick="employeeProfile('${p.id}')">Voir</button></div>`).join('')||'<p class="muted" style="font-size:12px">Aucun salarié en fatigue forte.</p>'}`,`Prévention des risques et suivi`)}${panel('Outils RH',`<button class="btn wide" onclick="openPayrollReport()">Calculer la prochaine paie</button><button class="btn wide" style="margin-top:8px" onclick="openHireForm()">Créer un dossier salarié</button><button class="btn wide" style="margin-top:8px" onclick="setTab('flights')">Vérifier le planning de vols</button><button class="btn wide" style="margin-top:8px" onclick="exportCSV('people')">Télécharger le registre CSV</button>`,`Administration RH`)}</div></div>`}
function editRoster(id){let p=getStaff(id);if(!p)return;modal(`Planning RH · ${p.first} ${p.last}`,`<form onsubmit="saveRoster(event,'${id}')"><div class="field"><label>Rotation / roulement</label><select id="roster-pattern">${['Régulière','Matin','Après-midi','Nuit','Week-end','Rotation long-courrier','Réserve','Formation','Congé planifié'].map(x=>`<option ${p.rotation===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field" style="margin-top:11px"><label>Base</label><input id="roster-base" value="${esc(p.base)}"></div><div class="field" style="margin-top:11px"><label>Jours de repos (0 = dimanche, 6 = samedi)</label><div class="grid g4" style="margin-top:4px">${['Dim','Lun','Mar','Mer','Jeu','Ven','Sam'].map((d,i)=>`<label class="check-line"><input type="checkbox" class="roster-day" value="${i}" ${(p.daysOff||[]).includes(i)?'checked':''}>${d}</label>`).join('')}</div></div><div class="field" style="margin-top:11px"><label>Planning note / affectation</label><textarea id="roster-note" placeholder="Ex. réserve, rotation assignée, restrictions…">${esc(p.rosterNote||'')}</textarea></div><div class="form-actions"><button class="btn primary" type="submit">Enregistrer le planning</button></div></form>`,`<button class="btn" onclick="closeModal()">Fermer</button>`)}
function saveRoster(e,id){e.preventDefault();let p=getStaff(id);p.rotation=document.getElementById('roster-pattern').value;p.base=document.getElementById('roster-base').value.toUpperCase();p.daysOff=Array.from(document.querySelectorAll('.roster-day:checked')).map(el=>Number(el.value));p.rosterNote=document.getElementById('roster-note').value;log('Planning RH modifié',`Le roulement de ${p.first} ${p.last} est passé à « ${p.rotation} »; repos déclarés : ${p.daysOff.join(', ')}.`,'RH');scheduleSave();closeModal();render();toast('Planning salarié enregistré.')}
function openPayrollReport(){let active=S.people.filter(p=>p.status==='Actif'),gross=active.reduce((n,p)=>n+p.salary,0),charges=gross*.36,netEstimate=gross*.78;modal('Prévision de paie · simulation',`<div class="callout warning" style="margin-bottom:14px">Estimation de jeu uniquement. Ce récapitulatif n’est pas un bulletin de salaire légal et ne remplace pas les règles sociales applicables.</div><div class="grid g2"><div class="mini-kpi"><span>Effectif</span><b>${active.length}</b></div><div class="mini-kpi"><span>Total brut mensuel</span><b>${eur(gross)}</b></div><div class="mini-kpi"><span>Charges employeur estimées</span><b>${eur(charges)}</b></div><div class="mini-kpi"><span>Budget employeur</span><b>${eur(gross+charges)}</b></div><div class="mini-kpi"><span>Net indicatif (78 % brut)</span><b>${eur(netEstimate)}</b></div><div class="mini-kpi"><span>Coût annuel estimé</span><b>${eur((gross+charges)*12)}</b></div></div><div class="form-actions"><button class="btn primary" onclick="exportCSV('payroll')">Exporter la paie en CSV</button></div>`,`<button class="btn" onclick="closeModal()">Fermer</button>`)}
function renderSuppliers(){let cats=['Carburant','Catering','Assistance au sol','Fret','Maintenance'];let weekly=S.suppliers.filter(s=>s.lastOfferWeek!==S.week).length;return pageHead('Achats · contrats · appels d’offres','Fournisseurs','Gérez le carburant, le catering, l’assistance au sol, la manutention et la maintenance. Négociez chaque semaine, comparez les tarifs et verrouillez les conditions par contrat.','<button class="btn primary" onclick="negotiateAllSuppliers()">⇄ Négocier tous les fournisseurs</button>')+`<div class="grid g4" style="margin-bottom:16px">${metric('Partenaires au catalogue',S.suppliers.length,'Prestataires réels référencés','')}${metric('Offres à renégocier',weekly,'Nouvelle semaine de négociation','orange')}${metric('Contrats signés',S.suppliers.filter(s=>s.contract!=='Sans contrat').length,'Accords actifs','blue')}${metric('Économies négociées',eur(S.suppliers.reduce((n,s)=>n+(s.base-s.price),0)),'Comparaison unitaire au prix de base','gold')}</div><div class="callout info" style="margin-bottom:16px">Les noms de sociétés ci-dessous sont réels ; tarifs, remises, relations, résultats de négociation et contrats sont fictifs et servent uniquement à la partie. Les prestations varient selon l’aéroport et le pays.</div><div class="grid g2">${cats.map(cat=>{let items=S.suppliers.filter(s=>s.category===cat);return `<section class="panel"><div class="panel-head"><div><h2>${esc(cat)}</h2><p>${items.length} prestataire(s) · base d’achat</p></div><span class="pill">${cat==='Carburant'?'€/litre':cat==='Catering'?'€/passager':'€/rotation'}</span></div><div class="panel-body">${items.map(s=>`<div class="vendor-row"><div class="market-logo" style="background:${s.category==='Carburant'?'#225c4b':s.category==='Catering'?'#a85431':s.category==='Assistance au sol'?'#2d5376':s.category==='Maintenance'?'#594b82':'#75571b'}">${esc(s.short)}</div><div style="flex:1;min-width:0"><div class="vendor-name">${esc(s.name)}</div><div class="vendor-desc">${esc(s.desc)}</div><div style="display:flex;gap:5px;flex-wrap:wrap;margin-top:6px"><span class="pill ${s.contract!=='Sans contrat'?'green':''}">${esc(s.contract)}</span><span class="pill blue">Relation ${s.rep}/100</span></div></div><div class="vendor-data"><b>${fmt(s.price, false)} ${esc(s.unit.split('/')[0])}</b><small>${s.unit.includes('/')?'/ '+esc(s.unit.split('/').slice(1).join('/')):''}<br><span style="color:var(--green)">${s.discount?'-'+pct(s.discount):'Tarif de base'}</span></small><button class="btn small" style="margin-top:8px" onclick="supplierDetail('${s.id}')">Négocier</button></div></div>`).join('')}</div></section>`}).join('')}</div><div class="section-title"><h2>Clauses contractuelles</h2><div class="rule"></div></div><section class="panel"><div class="table-wrap"><table><thead><tr><th>Prestataire</th><th>Tarif de base</th><th>Tarif négocié</th><th>Remise</th><th>Contrat</th><th>Échéance</th><th></th></tr></thead><tbody>${S.suppliers.map(s=>`<tr><td><b>${esc(s.name)}</b><div class="sub">${esc(s.category)}</div></td><td>${fmt(s.base)} ${esc(s.unit)}</td><td class="money">${fmt(s.price)} ${esc(s.unit)}</td><td><span class="pill ${s.discount>0?'green':'dark'}">${pct(s.discount)}</span></td><td>${esc(s.contract)}</td><td>${s.termWeeks?`S${S.week+s.termWeeks-(s.signedWeek||S.week)}`:'—'}</td><td><button class="btn small" onclick="supplierDetail('${s.id}')">Gérer</button></td></tr>`).join('')}</tbody></table></div></section><p class="footer-note">Acteurs référencés notamment parmi les prestataires répertoriés par des aéroports (assistance, carburant, catering) et les groupes spécialisés de l’aviation. Les prix du jeu ne sont pas les tarifs actuels de ces sociétés.</p>`}
function supplierDetail(id){let s=S.suppliers.find(x=>x.id===id);if(!s)return;let weekDone=s.lastOfferWeek===S.week;modal(`Contrat fournisseur · ${s.name}`,`<div class="roster-name" style="margin-bottom:14px"><div class="market-logo">${esc(s.short)}</div><div><h3 style="margin:0;font-size:17px">${esc(s.name)}</h3><div class="sub">${esc(s.category)} · ${esc(s.country)} · ${esc(s.site)}</div></div></div><div class="grid g2"><div class="mini-kpi"><span>Tarif de base</span><b>${fmt(s.base)} ${esc(s.unit)}</b></div><div class="mini-kpi"><span>Tarif actuel</span><b>${fmt(s.price)} ${esc(s.unit)}</b></div><div class="mini-kpi"><span>Remise obtenue</span><b>${pct(s.discount)}</b></div><div class="mini-kpi"><span>Relation commerciale</span><b>${s.rep}/100</b></div></div><form onsubmit="submitSupplierOffer(event,'${s.id}')"><div class="field" style="margin-top:14px"><label>Remise souhaitée (%)</label><input id="supplier-discount" type="range" min="0" max="25" value="${Math.min(25,Math.max(5,Math.round(s.discount+5)))}" oninput="document.getElementById('supplier-target').textContent='Tarif cible : '+(${s.base}*(1-this.value/100)).toLocaleString('fr-FR',{maximumFractionDigits:3})+' · remise '+this.value+' %"><div id="supplier-target" class="sub">Tarif cible : ${fmt(s.base*(1-Math.min(25,Math.max(5,Math.round(s.discount+5)))/100))} · remise ${Math.min(25,Math.max(5,Math.round(s.discount+5)))} %</div></div><div class="field" style="margin-top:12px"><label>Volume / engagement</label><select id="supplier-volume"><option value="1">Volumes actuels · faible engagement</option><option value="2" selected>Volume croissant · engagement 12 semaines</option><option value="3">Contrat prioritaire · 26 semaines</option><option value="4">Contrat cadre · 52 semaines</option></select></div><div class="field" style="margin-top:12px"><label>Clause à négocier</label><select id="supplier-clause"><option value="price">Prix unitaire prioritaire</option><option value="quality">Qualité de service et SLA</option><option value="flex">Flexibilité des volumes</option><option value="payment">Délai de paiement / acompte</option><option value="saf">Développement de carburants durables, si disponibles</option></select></div><div class="form-actions"><button class="btn primary" type="submit" ${weekDone?'disabled':''}>${weekDone?'Offre déjà déposée cette semaine':'Déposer une offre de négociation'}</button></div></form>${s.contract==='Sans contrat'?`<button class="btn wide" style="margin-top:8px" onclick="signSupplierContract('${s.id}')">Signer un contrat-cadre sur 12 semaines</button>`:`<button class="btn wide" style="margin-top:8px" onclick="endSupplierContract('${s.id}')">Résilier le contrat-cadre (simulation)</button>`}<div class="sub" style="margin-top:12px">${weekDone?'Une nouvelle offre pourra être présentée après la prochaine clôture hebdomadaire.':'Les offres sont acceptées ou contre-proposées selon la relation, l’engagement et la remise demandée.'}</div>`,`<button class="btn" onclick="closeModal()">Fermer</button>`)}
function submitSupplierOffer(e,id){e.preventDefault();let s=S.suppliers.find(x=>x.id===id);if(!s)return;if(s.lastOfferWeek===S.week){toast('Vous avez déjà négocié ce fournisseur cette semaine.','bad');return}let target=Number(document.getElementById('supplier-discount').value),vol=Number(document.getElementById('supplier-volume').value),clause=document.getElementById('supplier-clause').value;let max=Math.min(22,(s.rep-25)*.28+vol*1.2+Math.random()*4);let accepted=target<=max;let result=accepted?target:Math.max(s.discount,Math.min(target-1,Math.max(0,max*.85)));if(!accepted&&Math.random()<.25)result=Math.max(s.discount,result+1);s.discount=Math.max(s.discount,result);s.price=s.base*(1-s.discount/100);s.rep=Math.min(100,s.rep+(accepted?6:2)+vol);s.lastOfferWeek=S.week;s.lastOffer={week:S.week,target,result,accepted,clause,volume:vol};if(vol>=2){s.contract='12 semaines';s.termWeeks=12;s.signedWeek=S.week}log(accepted?'Négociation fournisseur conclue':'Contre-proposition fournisseur',`${s.name} : demande de ${target}% de remise ; remise obtenue ${fmt(result, false)}%. Clause : ${clause}.`,'Achats');scheduleSave();closeModal();render();toast(accepted?`${s.name} accepte la remise de ${fmt(result)}%.`:`${s.name} contre-propose une remise de ${fmt(result)}%.`,accepted?'good':'bad')}
function negotiateAllSuppliers(){if(!confirm(`Déposer une offre hebdomadaire pour tous les fournisseurs qui n’ont pas encore été négociés en semaine ${S.week} ?`))return;let done=0,accepted=0;for(let s of S.suppliers){if(s.lastOfferWeek===S.week)continue;let target=Math.min(18,Math.max(3,s.discount+4+Math.random()*3));let vol=2;let max=Math.min(21,(s.rep-25)*.28+vol*1.2+Math.random()*4);let ok=target<=max,discount=ok?target:Math.max(s.discount,Math.min(target-1,max*.83));s.discount=Math.max(s.discount,discount);s.price=s.base*(1-s.discount/100);s.rep=Math.min(100,s.rep+(ok?5:2));s.lastOfferWeek=S.week;s.lastOffer={week:S.week,target,result:s.discount,accepted:ok,clause:'négociation groupée',volume:vol};if(s.contract==='Sans contrat'){s.contract='12 semaines';s.termWeeks=12;s.signedWeek=S.week}done++;if(ok)accepted++}log('Négociation groupée des achats',`${done} fournisseur(s) négocié(s), ${accepted} accord(s) accepté(s) cette semaine.`,'Achats');scheduleSave();render();toast(`${done} fournisseur(s) renégocié(s) · ${accepted} accord(s) accepté(s).`)}
function signSupplierContract(id){let s=S.suppliers.find(x=>x.id===id);if(!s)return;s.contract='12 semaines';s.termWeeks=12;s.signedWeek=S.week;s.discount=Math.max(s.discount,2);s.price=s.base*(1-s.discount/100);s.rep=Math.min(100,s.rep+3);log('Contrat-cadre signé',`${s.name} est enregistré comme fournisseur sous contrat de 12 semaines dans la simulation.`,'Achats');scheduleSave();closeModal();render();toast('Contrat-cadre enregistré.')}
function endSupplierContract(id){let s=S.suppliers.find(x=>x.id===id);if(!s)return;if(!confirm(`Mettre fin au contrat simulé avec ${s.name} ?`))return;s.contract='Sans contrat';s.termWeeks=0;s.signedWeek=null;s.rep=Math.max(0,s.rep-5);log('Contrat fournisseur clôturé',`Le contrat de simulation avec ${s.name} a été clôturé.`,'Achats');scheduleSave();closeModal();render()}
function renderFinance(){let equityValue=Math.max(1000000,S.company.valuation),debtRatio=(S.debt/Math.max(1,equityValue+S.debt))*100,annualInterest=S.debt*S.interest;let investors=S.investors.reduce((n,i)=>n+i.share,0);let tx=S.transactions.slice(0,18);let bankCards=BANKS.map(b=>`<div class="vendor-row"><div class="market-logo">${esc(b.short)}</div><div style="flex:1"><div class="vendor-name">${esc(b.name)}</div><div class="vendor-desc">${esc(b.country)} · taux indicatif de négociation</div><div style="margin-top:6px"><span class="pill blue">Taux de départ ${pct(b.rate)}</span></div></div><div class="vendor-data"><b>${moneyM(b.limit)}</b><small>plafond de jeu</small><button class="btn small" style="margin-top:8px" onclick="bankOffer('${esc(b.short)}')">Négocier</button></div></div>`).join('');return pageHead('Trésorerie · dette · capitaux · investisseurs','Direction financière','Suivez le cash, les revenus et charges, les prêts, la négociation des taux, les échéances et l’ouverture du capital à des investisseurs.','<button class="btn primary" onclick="openLoanModal()">＋ Demander un emprunt</button><button class="btn" onclick="openInvestorModal()">Vendre des parts</button>')+`<div class="grid g4" style="margin-bottom:16px">${metric('Trésorerie',moneyM(S.cash),'Liquidités disponibles','')}${metric('Chiffre d’affaires cumulé',moneyM(S.revenueTotal),'Revenus comptabilisés','blue')}${metric('Charges cumulées',moneyM(S.costTotal),'Charges enregistrées','orange')}${metric('Dette totale',moneyM(S.debt),'Capital restant simulé','gold')}</div><div class="grid g2"><div class="grid" style="align-content:start;gap:15px">${panel('Performance financière',`<div class="grid g2"><div class="mini-kpi"><span>Résultat cumulé</span><b style="color:${S.revenueTotal-S.costTotal>=0?'var(--green)':'var(--red)'}">${moneyM(S.revenueTotal-S.costTotal)}</b></div><div class="mini-kpi"><span>Valeur théorique</span><b>${moneyM(S.company.valuation)}</b></div><div class="mini-kpi"><span>Dette / valeur</span><b>${pct(debtRatio)}</b></div><div class="mini-kpi"><span>Charge d’intérêt annuelle</span><b>${moneyM(annualInterest)}</b></div><div class="mini-kpi"><span>Capital fondateur</span><b>${moneyM(S.equity)}</b></div><div class="mini-kpi"><span>Parts vendues</span><b>${pct(investors)}</b></div></div><div class="callout info" style="margin-top:13px">La valorisation de jeu varie avec le réseau, la réputation, la flotte et la performance. Elle n’est pas une estimation comptable ou financière réelle.</div>`,`Compte de gestion consolidé`)}${panel('Flux de trésorerie récent',tx.length?`<div class="spark-bars">${tx.slice(0,10).reverse().map(t=>{let max=Math.max(1,...tx.map(x=>Math.abs(x.amount)));let h=16+Math.abs(t.amount)/max*80;return `<div class="spark-bar" style="height:${h}%" title="${esc(t.label)} · ${eur(t.amount)}"><span>J${t.day}</span></div>`}).join('')}</div><div style="margin-top:22px;font-size:10px;color:var(--muted)">Visualisation des dernières opérations par montant absolu. Vert/teal et orange distinguent les familles de flux.</div>`:empty('Pas encore de flux','Les transactions apparaîtront après les vols ou opérations.'),`Mouvements du compte`)}${panel('Transactions récentes',tx.length?`<div class="table-wrap"><table><thead><tr><th>Jour</th><th>Libellé</th><th>Type</th><th class="right">Montant</th></tr></thead><tbody>${tx.map(t=>`<tr><td>J${t.day}</td><td>${esc(t.label)}</td><td><span class="pill">${esc(t.kind)}</span></td><td class="right money" style="color:${t.amount<0?'var(--red)':'var(--green)'}">${t.amount<0?'−':'+'}${eur(Math.abs(t.amount))}</td></tr>`).join('')}</tbody></table></div>`:empty('Aucune transaction','L’activité du réseau alimentera ce grand livre.'),`Grand livre de simulation`,`<button class="btn small" onclick="exportCSV('transactions')">Exporter CSV</button>`)}</div><div class="grid" style="align-content:start;gap:15px">${panel('Financement bancaire',`<div class="grid g2"><div class="mini-kpi"><span>Prêts actifs</span><b>${S.loans.length}</b></div><div class="mini-kpi"><span>Taux moyen pondéré</span><b>${pct(S.debt?S.loans.reduce((n,l)=>n+l.rate*l.principal,0)/Math.max(1,S.debt):0)}</b></div></div>${S.loans.length?`<div class="table-wrap" style="margin-top:14px"><table><thead><tr><th>Prêteur</th><th>Capital</th><th>Taux annuel</th><th>Remboursement</th></tr></thead><tbody>${S.loans.map(l=>`<tr><td><b>${esc(l.bank)}</b><div class="sub">${esc(l.type)}</div></td><td>${moneyM(l.principal)}</td><td>${pct(l.rate)}</td><td><button class="btn small" onclick="repayLoan('${l.id}')">Rembourser</button></td></tr>`).join('')}</tbody></table></div>`:empty('Aucun emprunt','Négociez un crédit dans le catalogue bancaire.')}`,`Crédits et conditions`)}${panel('Banques partenaires · simulation',bankCards,`Taux de référence de jeu · résultat négociable`)}${panel('Actionnariat',`<div class="grid g2"><div class="mini-kpi"><span>Capital de la compagnie</span><b>${moneyM(S.equity)}</b></div><div class="mini-kpi"><span>Part du fondateur</span><b>${pct(Math.max(0,S.company.sharesOwned-investors))}</b></div></div>${S.investors.length?`<div style="margin-top:13px">${S.investors.map(i=>`<div class="vendor-row"><div class="market-logo">${esc(i.name.slice(0,2).toUpperCase())}</div><div style="flex:1"><div class="vendor-name">${esc(i.name)}</div><div class="vendor-desc">Entrée J${i.day} · ${pct(i.share)} du capital</div></div><div class="vendor-data"><b>${moneyM(i.amount)}</b><small>apport</small></div></div>`).join('')}</div>`:'<p class="muted" style="font-size:12px">Aucun investisseur externe.</p>'}<button class="btn primary wide" style="margin-top:12px" onclick="openInvestorModal()">Structurer une ouverture de capital</button>`,`Augmentations de capital`)}</div></div><p class="footer-note">Les banques, taux de négociation, plafonds, prêts et investisseurs sont simulés. Ce système n’est pas connecté à un compte bancaire et ne constitue pas une offre de crédit, un conseil d’investissement ou un service de transaction financière réel.</p>`}
function openLoanModal(bankName=''){let name=bankName||BANKS[0].short;let b=BANKS.find(x=>x.short===name)||BANKS[0];modal('Demande de financement',`<div class="callout info" style="margin-bottom:13px">Négociez un financement de flotte, de trésorerie ou de développement. Les conditions sont générées par le jeu et ne sont pas des offres bancaires réelles.</div><form onsubmit="submitLoan(event)"><div class="form-grid"><div class="field span2"><label>Banque / prêteur</label><select id="loan-bank">${BANKS.map(x=>`<option value="${esc(x.short)}" ${x.short===b.short?'selected':''}>${esc(x.name)} · taux de référence ${pct(x.rate)}</option>`).join('')}</select></div><div class="field"><label>Montant demandé (€)</label><input type="number" id="loan-amount" min="100000" max="100000000" step="100000" value="5000000" required></div><div class="field"><label>Taux annuel souhaité (%)</label><input type="number" id="loan-rate" min="1" max="15" step="0.05" value="${Math.max(1,b.rate-0.5)}" required></div><div class="field"><label>Durée (mois)</label><select id="loan-term"><option value="24">24 mois</option><option value="36">36 mois</option><option value="60" selected>60 mois</option><option value="84">84 mois</option><option value="120">120 mois</option></select></div><div class="field"><label>Objet du crédit</label><select id="loan-type"><option>Développement du réseau</option><option>Achat d’aéronef</option><option>Trésorerie</option><option>Recrutement et formation</option><option>Investissement matériel</option></select></div><div class="field span2"><label>Garantie / élément de négociation</label><select id="loan-security"><option value="aircraft">Aéronef en garantie</option><option value="equity">Renforcement du capital</option><option value="cash">Trésorerie et engagements commerciaux</option><option value="none">Pas de garantie spécifique</option></select></div></div><div class="form-actions"><button class="btn primary" type="submit">Présenter le dossier</button></div></for function submitLoan(e){e.preventDefault();let bankShort=document.getElementById('loan-bank').value,b=BANKS.find(x=>x.short===bankShort),amount=Number(document.getElementById('loan-amount').value),rate=Number(document.getElementById('loan-rate').value)/100,term=Number(document.getElementById('loan-term').value),type=document.getElementById('loan-type').value,security=document.getElementById('loan-security').value;if(!b)return;if(amount>b.limit){toast('Montant au-dessus du plafond proposé dans le catalogue de simulation.','bad');return}if(amount<100000||!Number.isFinite(amount)){toast('Montant incorrect.','bad');return}let minRate=Math.max(0.025,b.rate/100-(S.reputation/10000)-(security==='none'?.003:security==='equity'?.008:.004));let accepted=rate>=minRate&&Math.random()<Math.min(.98,.58+S.reputation/250+(S.company.valuation>amount?0.12:0));let counterRate=Math.max(minRate,rate+.003);if(accepted){let loan={id:uid('CR'),bank:b.name,principal:amount,rate,term,remaining:amount,type,security,day:S.day};S.loans.push(loan);S.debt+=amount;S.interest=S.debt?S.loans.reduce((n,l)=>n+l.principal*l.rate,0)/S.debt:.055;moneyTxn(`Versement du prêt · ${b.name}`,+amount,'Financement');S.company.valuation+=amount*.12;log('Financement obtenu',`${b.name} accorde ${eur(amount)} à un taux de ${pct(rate*100)} sur ${term} mois (${type}).`,'Finances');closeModal();scheduleSave();render();toast(`Financement obtenu à ${pct(rate*100)}.`)}else{log('Contre-proposition bancaire',`${b.name} demande un taux proche de ${pct(counterRate*100)} ou des garanties supplémentaires.`,'Finances');closeModal();toast(`Dossier refusé aux conditions proposées. Contre-proposition indicative : ${pct(counterRate*100)}.`,'bad');modal('Contre-proposition bancaire',`<div class="callout warning">La banque ne retient pas ce taux dans la simulation. Elle pourrait considérer ${pct(counterRate*100)} selon le dossier et les garanties.</div><div class="form-actions"><button class="btn primary" onclick="closeModal();openLoanModal('${b.short}')">Revoir la demande</button></div>`,`<button class="btn" onclick="closeModal()">Fermer</button>`)}}
function repayLoan(id){let l=S.loans.find(x=>x.id===id);if(!l)return;modal('Rembourser un prêt',`<p class="muted" style="line-height:1.5">Prêt ${esc(l.bank)} · capital simulé restant : ${moneyM(l.remaining||l.principal)}.</p><form onsubmit="submitRepay(event,'${id}')"><div class="field"><label>Montant de remboursement anticipé (€)</label><input id="repay-amount" type="number" min="1000" max="${Math.min(S.cash,l.remaining||l.principal)}" step="1000" value="${Math.min(Math.floor(S.cash/1000)*1000,l.remaining||l.principal)}"></div><div class="form-actions"><button class="btn primary" type="submit">Rembourser</button></div></form>`,`<button class="btn" onclick="closeModal()">Annuler</button>`)}
function submitRepay(e,id){e.preventDefault();let l=S.loans.find(x=>x.id===id),amount=Number(document.getElementById('repay-amount').value);if(!l||amount<=0||amount>S.cash||amount>(l.remaining||l.principal)){toast('Montant ou trésorerie insuffisants.','bad');return}moneyTxn(`Remboursement anticipé · ${l.bank}`,-amount,'Financement');l.remaining=(l.remaining||l.principal)-amount;S.debt=Math.max(0,S.debt-amount);l.principal=l.remaining;if(l.remaining<=0)S.loans=S.loans.filter(x=>x.id!==id);S.interest=S.debt?S.loans.reduce((n,x)=>n+x.principal*x.rate,0)/S.debt:.055;log('Remboursement de dette',`${eur(amount)} remboursés au prêteur ${l.bank}.`,'Finances');closeModal();scheduleSave();render();toast('Remboursement enregistré.')}

function sellShares(e){e.preventDefault();let name=document.getElementById('investor-name').value.trim(),amount=Number(document.getElementById('investor-amount').value),share=Number(document.getElementById('investor-share').value),type=document.getElementById('investor-type').value,condition=document.getElementById('investor-condition').value,existing=S.investors.reduce((n,x)=>n+x.share,0);if(!name||amount<=0||share<=0||share+existing>49){toast('Vérifiez l’apport et les parts ; la part externe maximale est 49 % dans ce scénario.','bad');return}if(share/100*S.company.valuation>amount*2||amount>S.company.valuation*1.5){if(!confirm('La valorisation proposée paraît éloignée de la référence du simulateur. Continuer cette négociation quand même ?'))return}S.investors.push({id:uid('INV'),name,amount,share,day:S.day,type,condition});S.equity+=amount;S.company.valuation+=amount;moneyTxn(`Apport en capital · ${name}`,amount,'Capital');log('Investissement signé',`${name} (${type}) injecte ${eur(amount)} contre ${pct(share)} du capital de simulation.`,'Finances');closeModal();scheduleSave();render();toast('Investissement enregistré dans la simulation.')}
function renderSocial(){seedSocial();let posts=[...S.social].sort((a,b)=>b.idNum-a.idNum);return pageHead('Communication · réputation · engagement','Réseaux sociaux','Publiez au nom de la compagnie, suivez les réactions simulées pays par pays, promouvez une nouvelle ligne et observez l’impact sur la marque et la demande.','<button class="btn primary" onclick="openSocialPost()">＋ Publier un post</button><button class="btn" onclick="runCampaign()">Lancer une campagne</button>')+`<div class="grid g4" style="margin-bottom:16px">${metric('Abonnés simulés',fmt(Math.round(S.company.brandScore*1430+S.flightsCompleted*37)),'Audience de marque','')}${metric('Réputation',S.reputation+'/100','Confiance et perception','blue')}${metric('Image de marque',S.company.brandScore+'/100','Notoriété de la compagnie','orange')}${metric('Posts publiés',S.social.filter(p=>p.authorType==='company').length,'Depuis le début de la partie','gold')}</div><div class="split"><div class="grid" style="align-content:start;gap:15px"><section class="panel"><div class="panel-head"><div><h2>Fil de la communauté aérienne</h2><p>Contenu fictif généré pour donner vie à la partie ; commentaires et réactions sont simulés.</p></div><span class="pill orange">Fil de simulation</span></div><div>${posts.map((p,i)=>`<article class="feed-card"><div class="feed-top"><div class="avatar ${i%3===1?'orange':i%3===2?'gold':''}">${esc(p.avatar||p.author.slice(0,2).toUpperCase())}</div><div style="flex:1"><b>${esc(p.author)}</b><small>${esc(p.handle||'@aviation') } · J${p.day} · ${isoFlag(p.country||'FR')} ${esc(countryName(p.country||'FR'))}</small></div>${p.authorType==='company'?'<span class="pill green">Votre compagnie</span>':'<span class="pill">Communauté</span>'}</div><div class="feed-text">${esc(p.text)}</div>${p.route?`<div style="margin-top:10px;padding:10px;background:#f4efe4;border-radius:10px"><span class="smallcaps">Liaison citée</span><div style="margin-top:5px;font-weight:850">${isoFlag(p.country||'FR')} ${es function submitCampaign(e){e.preventDefault();let cost=Number(document.getElementById('campaign-budget').value),objective=document.getElementById('campaign-objective').value,route=getRoute(document.getElementById('campaign-route').value),country=document.getElementById('campaign-country').value;if(cost>S.cash){toast('Trésorerie insuffisante.','bad');return}moneyTxn(`Campagne marketing · ${countryName(country)}`,-cost,'Marketing');S.marketing+=cost;S.company.brandScore=Math.min(100,S.company.brandScore+Math.round(cost/10000)+1);S.reputation=Math.min(100,S.reputation+Math.round(cost/25000));if(objective==='route'&&route){route.demand=Math.min(100,route.demand+Math.round(cost/5000));route.load=Math.min(95,route.load+Math.round(cost/15000))}else if(objective==='service')S.company.service=Math.min(100,S.company.service+Math.round(cost/20000));let message=`Campagne fictive dans ${countryName(country)} : ${eur(cost)}, objectif ${objective}${route?' · '+route.origin+'–'+route.dest:''}.`;log('Campagne marketing lancée',message,'Communication');S.social.unshift({id:uid('POST'),idNum:Math.max(0,...S.social.map(x=>x.idNum||0))+1,day:S.day,author:S.company.name,handle:'@'+S.company.code.toLowerCase(),country,avatar:S.company.code.slice(0,2),authorType:'company',text:`✦ ${S.company.name} : nous préparons la prochaine étape de notre aventure aérienne. ${route?`Découvrez notre liaison ${route.origin}–${route.dest} et rejoignez-nous pour la suite.`:'Merci à toutes celles et ceux qui nous accompagnent.'}`,likes:Math.round(cost/1500),replies:Math.round(cost/6000),reach:Math.round(cost/1.8),liked:false});closeModal();scheduleSave();render();toast('Campagne lancée ; les indicateurs de marque ont été actualisés.')}
function quickSocialTemplate(topic){let r=S.routes.find(r=>r.status==='Ouverte');let txt=topic==='Ouverture d’une nouvelle ligne'&&r?`Nouvelle étape pour ${S.company.name} : notre liaison ${r.origin}–${r.dest} fait partie du réseau. Nous préparons nos prochaines rotations avec nos équipes.`:topic==='Actualité de la flotte'?`La flotte de ${S.company.name} évolue : nous travaillons sur la disponibilité des appareils et la qualité des opérations.`:topic==='Offre saisonnière'?`Envie de changer d’horizon ? Suivez les actualités de ${S.company.name} pour découvrir les prochaines opportunités de voyage.`:topic==='Engagement RSE'?`${S.company.name} travaille à améliorer ses opérations, avec une attention portée aux ressources, aux partenaires et à l’expérience de voyage.`:topic==='Coulisses opérationnelles'?`Derrière chaque départ, une équipe : pilotes, cabine, agents au sol et équipes support préparent les opérations de ${S.company.name}.`:'';openSocialPost(txt)}
function renderJournal(){let items=S.journal.slice().sort((a,b)=>b.day-a.day);return pageHead('Presse interne · unes · historique','Journal de la compagnie','Une rédaction fictive reprend les événements clés : ouvertures de lignes, résultats, incidents opérationnels, accords fournisseurs, recrutements et mouvements financiers.','<button class="btn" onclick="exportCSV(\'journal\')">Exporter le journal</button>')+`<div class="grid g2"><div class="grid" style="align-content:start;gap:15px">${items.slice(0,30).map((j,i)=>`<article class="panel" style="position:relative"><div class="panel-body"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><span class="pill ${j.category==='Finances'?'gold':j.category==='Opérations'?'blue':j.category==='RH'?'green':j.category==='Communication'?'orange':'dark'}">${esc(j.category)}</span><span class="smallcaps">J${j.day} · ${i===0?'À LA UNE':'ÉDITION'}</span></div><h2 style="font-size:${i===0?'22':'17'}px;line-height:1.25;letter-spacing:-.03em;margin:12px 0 8px">${esc(j.title)}</h2><p style="font-size:12px;line-height:1.65;color:var(--muted);margin:0">${esc(j.text)}</p><div style="border-top:1px solid var(--line);margin-top:14px;padding-top:10px;display:flex;justify-content:space-between;align-items:center"><span class="smallcaps">${esc(S.company.name)}</span><span class="muted" style="font-size:10px">Rédaction interne · simulation</span></div></div></article>`).join('')||empty('Aucune édition','Les nouvelles apparaîtront à mesure que la compagnie se développe.')}</div><div class="grid" style="align-content:start;gap:15px">${panel('La une · économie de la compagnie',`<div style="background:var(--ink);border-radius:14px;padding:18px;color:#fff8ee"><div class="smallcaps" style="color:#eaa16e">Airline CEO · Édition de simulation</div><h2 style="font-size:25px;line-height:1.13;margin:12px 0">${esc(items[0]?.title||'Une compagnie prend son envol')}</h2><p style="color:#d3ded9;line-height:1.55;font-size:12px">${esc(items[0]?.text||'La compagnie construit son réseau commercial et prépare ses premières opérations.')}</p><div style="margin-top:16px;display:flex;gap:8px;flex-wrap:wrap"><span class="pill orange">J${items[0]?.day||S.day}</span><span class="pill">${esc(items[0]?.category||'Direction')}</span></div></div>`,`Titre en vedette`)}${panel('Archives par catégorie',`<div class="grid g2">${['Direction','Réseau','Opérations','RH','Finances','Achats','Communication'].map(cat=>`<button class="btn" onclick="filterJournal('${cat}')" style="justify-content:space-between">${cat}<span class="pill">${S.journal.filter(j=>j.category===cat).length}</span></button>`).join('')}</div><button class="btn wide" style="margin-top:8px" onclick="render();toast('Toutes les éditions affichées.')">Afficher toutes les éditions</button>`,`Historique complet`)}${panel('Créer un communiqué de direction',`<p class="muted" style="font-size:12px;line-height:1.5">Publiez un communiqué fictif pour enregistrer une décision du conseil, un changement de stratégie ou une information destinée à la communauté.</p><button class="btn primary wide" onclick="openJournalForm()">＋ Rédiger un communiqué</button>`,`Communication institutionnelle`)}${panel('Indicateurs de couverture',`<div class="grid g2"><div class="mini-kpi"><span>Éditions</span><b>${items.length}</b></div><div class="mini-kpi"><span>Jour courant</span><b>J${S.day}</b></div><div class="mini-kpi"><span>Événements réseau</span><b>${S.journal.filter(j=>j.category==='Réseau').length}</b></div><div class="mini-kpi"><span>Événements opérations</span><b>${S.journal.filter(j=>j.category==='Opérations').length}</b></div></div>`,`État des archives`)}</div></div>`}
function filterJournal(category){let view=document.getElementById('view');let items=S.journal.filter(j=>j.category===category).sort((a,b)=>b.day-a.day);view.innerHTML=pageHead('Journal · archives',`Éditions · ${esc(category)}`,`Événements de la catégorie ${esc(category)}.`,'<button class="btn" onclick="setTab(\'journal\')">← Toutes les unes</button>')+`<div class="grid g2">${items.map(j=>`<article class="panel"><div class="panel-body"><div class="smallcaps">J${j.day} · ${esc(j.category)}</div><h2 style="font-size:18px;margin:10px 0">${esc(j.title)}</h2><p class="muted" style="line-height:1.6">${esc(j.text)}</p></div></article>`).join('')||empty('Aucun article','La catégorie ne contient pas encore d’événement.')}</div>`}
function openJournalForm(){modal('Communiqué de direction',`<form onsubmit="saveJournalPost(event)"><div class="field"><label>Titre</label><input id="journal-title" maxlength="120" required placeholder="Ex. Une nouvelle étape pour le réseau"></div><div class="field" style="margin-top:12px"><label>Catégorie</label><select id="journal-category">${['Direction','Réseau','Opérations','RH','Finances','Achats','Communication'].map(x=>`<option>${x}</option>`).join('')}</select></div><div class="field" style="margin-top:12px"><label>Texte</label><textarea id="journal-text" required maxlength="1200" placeholder="Décision, contexte, objectifs et prochaines étapes…"></textarea></div><div class="form-actions"><button class="btn primary" type="submit">Publier dans le journal</button></div></form>`,`<button class="btn" onclick="closeModal()">Annuler</button>`)}
function saveJournalPost(e){e.preventDefault();let title=document.getElementById('journal-title').value.trim(),category=document.getElementById('journal-category').value,text=document.getElementById('journal-text').value.trim();S.journal.unshift({day:S.day,title,text,category});scheduleSave();closeModal();render();toast('Communiqué ajouté au journal.')}
function renderCompany(){return pageHead('Paramètres · identité · stratégie','Compagnie','Personnalisez l’identité de marque, votre base, les options de jeu, la palette graphique et les données de sauvegarde.','<button class="btn primary" onclick="saveCompanyForm()">Enregistrer la compagnie</button>')+`<div class="grid g2"><section class="panel"><div class="panel-head"><div><h2>Identité officielle de la compagnie</h2><p>Nom, code, devise de marque et logo.</p></div></div><div class="panel-body"><div style="display:flex;gap:14px;align-items:center;margin-bottom:18px"><div id="company-logo-preview" class="company-emblem">${S.company.logo?`<img src="${S.company.logo}" style="width:100%;height:100%;object-fit:contain;border-radius:15px">`:esc(S.company.logoText||S.company.code)}</div><div><h2 style="margin:0 0 4px;font-size:21px">${esc(S.company.name)}</h2><div class="sub">${esc(S.company.tagline)}</div><div class="sub">Code compagnie : ${esc(S.company.code)}</div></div></div><form onsubmit="saveCompanyForm(event)"><div class="form-grid"><div class="field span2"><label>Nom de la compagnie</label><input id="company-name" value="${esc(S.company.name)}" required maxlength="60"></div><div class="field"><label>Code de marque (3–4 caractères)</label><input id="company-code" value="${esc(S.company.code)}" required maxlength="4"></div><div class="field"><label>Base principale (code IATA / ICAO)</label><input id="company-base" list="airport-list" value="${esc(S.company.base)}" required></div><div class="field span2"><label>Signature / slogan</label><input id="company-tagline" value="${esc(S.company.tagline)}" maxlength="120"></div><div class="field"><label>Pays de domiciliation</label><select id="company-country">${[['FR','France'],['GB','Royaume-Uni'],['ES','Espagne'],['DE','Allemagne'],['NL','Pays-Bas'],['CH','Suisse'],['AE','Émirats arabes unis'],['US','États-Unis'],['SG','Singapour'],['MA','Maroc']].map(([cc,n])=>`<option value="${cc}" ${cc===S.company.country?'selected':''}>${isoFlag(cc)} ${n}</option>`).join('')}</select></div><div class="field"><label>Indice de prix (%)</label><input id="company-price-index" type="number" min="60" max="180" value="${S.company.priceIndex||100}"></div></div><div class="field" style="margin-top:13px"><label>Importer le logo (PNG, JPG ou SVG)</label><input type="file" id="logo-upload" accept="image/png,image/jpeg,image/webp,image/svg+xml" onchange="handleLogoUpload(event)"><small class="sub">Le logo est conservé dans le stockage local de ce navigateur. Utilisez une petite image pour éviter d’atteindre la limite de sauvegarde.</small></div><div class="form-actions"><button type="submit" class="btn primary">Enregistrer les informations</button><button type="button" class="btn" onclick="clearCompanyLogo()">Retirer le logo</button></div></form></div></section><div class="grid" style="align-content:start;gap:15px">${panel('Identité financière et stratégique',`<div class="grid g2"><div class="mini-kpi"><span>Valorisation de jeu</span><b>${moneyM(S.company.valuation)}</b></div><div class="mini-kpi"><span>Part actionnariale du fondateur</span><b>${pct(S.company.sharesOwned)}</b></div><div class="mini-kpi"><span>Réputation</span><b>${S.reputation}/100</b></div><div class="mini-kpi"><span>Indice de marque</span><b>${S.company.brandScore}/100</b></div></div><div class="form-actions"><button class="btn primary" onclick="revalueCompany()">Évaluer la compagnie (jeu)</button><button class="btn" onclick="setTab('finance')">Ouvrir la finance</button></div>`,`Informations stratégiques`)}${panel('Palette graphique',`<p class="muted" style="font-size:12px;line-height:1.5">Choisissez l’ambiance visuelle. Les couleurs changent le fond, l’accent et les surfaces pour donner à l’interface une identité moins monotone.</p><div class="grid g2"><button class="btn" onclick="setTheme('warm')"><span style="display:inline-block;width:17px;height:17px;border-radius:5px;background:#dc6d3d"></span> Terracotta & crème</button><button class="btn" onclick="setTheme('forest')"><span style="display:inline-block;width:17px;height:17px;border-radius:5px;background:#28634b"></span> Vert forêt</button><button class="btn" onclick="setTheme('blue')"><span style="display:inline-block;width:17px;height:17px;border-radius:5px;background:#447ab5"></span> Bleu aviation</button><button class="btn" onclick="setTheme('violet')"><span style="display:inline-block;width:17px;height:17px;border-radius:5px;background:#8061a6"></span> Prune & sable</button></div>`,`Design de l’espace de travail`)}${panel('Sauvegarde et portabilité',`<div class="callout info" style="margin-bottom:12px">La sauvegarde automatique est stockée localement dans Safari sur cet appareil. Elle ne se synchronise pas automatiquement entre iPhone, ordinateur ou navigateur.</div><div class="grid g2"><button class="btn primary" onclick="exportGame()">↓ Exporter la sauvegarde</button><button class="btn" onclick="document.getElementById('import-game-file').click()">↑ Importer une sauvegarde</button><input id="import-game-file" type="file" accept="application/json,.json" class="hidden" onchange="importGame(event)"><button class="btn" onclick="exportCSV('transactions')">Exporter la finance CSV</button><button class="btn" onclick="exportCSV('people')">Exporter le personnel CSV</button></div><div class="form-actions"><button class="btn danger wide" onclick="resetGame()">Recommencer une nouvelle partie</button></div>`,`Données de partie`)}${panel('Règles et limites',`<ul style="padding-left:17px;color:var(--muted);font-size:12px;line-height:1.8;margin:0"><li>Le marché aéronautique utilise des prix indicatifs de jeu.</li><li>Les horaires, taux, passagers, contrats et profits sont simulés.</li><li>La base aéroportuaire mondiale dépend d’une connexion Internet.</li><li>La sauvegarde est locale ; exportez-la régulièrement.</li><li>Le jeu n’est pas un outil de dispatch aéronautique certifié.</li></ul>`,`Transparence et données`)}</div></div><p class="footer-note">Airline CEO · World Operations est un jeu de gestion non affilié aux constructeurs, bailleurs, banques, fournisseurs ou plateformes cités.</p>`}
function saveCompanyForm(e){if(e?.preventDefault)e.preventDefault();let name=document.getElementById('company-name')?.value.trim(),code=document.getElementById('company-code')?.value.trim().toUpperCase(),baseIn=document.getElementById('company-base')?.value.trim(),tagline=document.getElementById('company-tagline')?.value.trim(),country=document.getElementById('company-country')?.value,index=Number(document.getElementById('company-price-index')?.value||100);if(name)S.company.name=name;if(code)S.company.code=code.slice(0,4);if(baseIn){let a=resolveAirportInput(baseIn);S.company.base=a?.iata||a?.icao||baseIn.toUpperCase().slice(0,4);if(a&&a.iata)S.company.country=a.country||country}if(tagline!==undefined)S.company.tagline=tagline;if(country)S.company.country=country;S.company.priceIndex=Math.max(60,Math.min(180,index));log('Informations compagnie modifiées',`Nouvelle configuration : ${S.company.name}, base ${S.company.base}, code ${S.company.code}.`,'Direction');scheduleSave();render();toast('Informations de compagnie enregistrées.')}
function handleLogoUpload(e){let file=e.target.files?.[0];if(!file)return;if(file.size>800000){toast('Fichier trop volumineux. Choisissez un logo de moins de 800 Ko.','bad');e.target.value='';return}if(!/^image\/(png|jpeg|webp|svg\+xml)$/.test(file.type)){toast('Format non pris en charge.','bad');return}let reader=new FileReader();reader.onload=()=>{S.company.logo=reader.result;S.company.logoText=S.company.code;document.getElementById('company-logo-preview').innerHTML=`<img src="${S.company.logo}" style="width:100%;height:100%;object-fit:contain;border-radius:15px">`;scheduleSave();syncHead();toast('Logo importé dans la sauvegarde locale.');};reader.readAsDataURL(file)}
function clearCompanyLogo(){S.company.logo=null;scheduleSave();render();toast('Logo retiré.')}
function setTheme(name){const themes={warm:{paper:'#f5f1e9',surface:'#fffdf8',ink:'#152c34',ink2:'#23434b',teal:'#126f68',orange:'#dc6d3d',line:'#ded8ca'},forest:{paper:'#edf2e8',surface:'#fbfff7',ink:'#16382e',ink2:'#285244',teal:'#28634b',orange:'#ca713d',line:'#d4ddcd'},blue:{paper:'#eaf1f5',surface:'#fbfdff',ink:'#152e47',ink2:'#274967',teal:'#1d6f91',orange:'#e4773c',line:'#d1dce5'},violet:{paper:'#f2edf2',surface:'#fffaff',ink:'#30243d',ink2:'#51405d',teal:'#8061a6',orange:'#ca7048',line:'#ddd2e0'}};let t=themes[name]||themes.warm;for(let [k,v] of Object.entries(t))document.documentElement.style.setProperty('--'+k,v);S.settings.theme=name;scheduleSave();toast('Palette graphique mise à jour.')}
function revalueCompany(){let base=40000000+S.fleet.reduce((n,a)=>n+(a.ownership==='Propriété'?(a.paid||0)*Math.max(.3,a.condition/100):0),0)+Math.max(0,S.revenueTotal-S.costTotal)*.9+S.routes.filter(r=>r.status==='Ouverte').length*1200000+S.reputation*80000-S.debt;S.company.valuation=Math.max(5000000,base);log('Réévaluation de gestion',`Valeur théorique de jeu mise à jour : ${moneyM(S.company.valuation)}.`,'Finances');scheduleSave();render();toast('Valorisation du simulateur recalculée.')}
function exportGame(){save();let blob=new Blob([JSON.stringify({game:'Airline CEO — World Operations',version:4,exportedAt:new Date().toISOString(),state:S},null,2)],{type:'application/json'});downloadBlob(blob,'airline-ceo-sauvegarde-j'+S.day+'.json');toast('Sauvegarde JSON exportée.')}
function importGame(e){let file=e.target.files?.[0];if(!file)return;let reader=new FileReader();reader.onload=()=>{try{let obj=JSON.parse(reader.result),state=obj.state||obj;if(state.version!==4||!state.company||!Array.isArray(state.fleet))throw Error('Format de sauvegarde incompatible');if(!confirm('Remplacer la partie actuelle par la sauvegarde importée ?'))return;S=state;scheduleSave();applySavedTheme();render();toast('Sauvegarde restaurée.')}catch(err){toast('Import impossible : fichier invalide ou version incompatible.','bad')}finally{e.target.value=''}};reader.readAsText(file)}
function applySavedTheme(){let t=S.settings?.theme;if(t&&t!=='warm')setTheme(t)}
function resetGame(){if(!confirm('Recommencer une nouvelle partie ? La sauvegarde locale actuelle sera remplacée. Exportez-la avant si nécessaire.'))return;S=initialState();S.social=[];seedSocial();save();setTheme('warm');render();toast('Nouvelle partie créée.')}
function downloadBlob(blob,name){let a=document.createElement('a'),url=URL.createObjectURL(blob);a.href=url;a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(url);a.remove()},1000)}
function exportCSV(type){let headers=[],rows=[];if(type==='fleet'){headers=['Immatriculation','Modèle','Constructeur','Sièges','Propriété','Bailleur','Loyer mensuel','Condition','Cycles','État'];rows=S.fleet.map(a=>[a.registration,a.model,a.maker,a.seats,a.ownership,a.lessor||'',a.monthlyLease,a.condition,a.cycles,a.status])}else if(type==='routes'){headers=['Origine','Destination','Distance km','Fréquence quotidienne','Tarif aller EUR','Remplissage cible','État','Frais origine','Frais destination','Taxes origine','Taxes destination'];rows=S.routes.map(r=>[r.origin,r.dest,r.km,r.frequency,r.fare,r.load,r.status,r.feeOrigin,r.feeDest,r.taxOrigin,r.taxDest])}else if(type==='people'){headers=['Matricule','Prénom','Nom','Poste','Fonction','Salaire brut mensuel','Contrat','Statut','Qualification','Moral','Fatigue','Heures'];rows=S.people.map(p=>[p.id,p.first,p.last,p.job,p.title,p.salary,p.contract,p.status,p.license,p.morale,p.fatigue,p.hours])}else if(type==='payroll'){headers=['Matricule','Prénom','Nom','Poste','Brut mensuel','Charges estimées 36%','Coût employeur'];rows=S.people.filter(p=>p.status==='Actif').map(p=>[p.id,p.first,p.last,p.job,p.salary,p.salary*.36,p.salary*1.36])}else if(type==='journal'){headers=['Jour','Catégorie','Titre','Texte'];rows=S.journal.map(j=>[j.day,j.category,j.title,j.text])}else{headers=['Jour','Libellé','Type','Montant'];rows=S.transactions.map(t=>[t.day,t.label,t.kind,t.amount])}let csv='\ufeff'+[headers,...rows].map(row=>row.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(';')).join('\r\n');downloadBlob(new Blob([csv],{type:'text/csv;charset=utf-8'}),`airline-ceo-${type}-j${S.day}.csv`);toast('Fichier CSV exporté.')}
function aircraftDetail(id){let a=getPlane(id);if(!a)return;let d=aircraftDef(a);modal(`Dossier technique · ${a.registration}`,`<div style="display:flex;gap:12px;align-items:center"><div class="aircraft-icon" style="width:90px;height:76px;font-size:34px">✈</div><div><div class="eyebrow">${esc(a.maker)} · ${esc(a.ownership)}</div><h2 style="font-size:23px;margin:5px 0">${esc(a.model)}</h2><div class="sub">${esc(a.registration)} · ${esc(a.id)}</div></div></div><div class="grid g3" style="margin:15px 0"><div class="mini-kpi"><span>Capacité</span><b>${a.seats} sièges</b></div><div class="mini-kpi"><span>Autonomie catalogue</span><b>${fmt(a.range)} km</b></div><div class="mini-kpi"><span>Condition</span><b>${a.condition}%</b></div><div class="mini-kpi"><span>Consommation jeu</span><b>${a.burn} L/100 km</b></div><div class="mini-kpi"><span>Cycles</span><b>${a.cycles}</b></div><div class="mini-kpi"><span>Maintenance due</span><b>${fmt(a.nextMaintenance)} h</b></div></div><div class="callout info">L’autonomie, la consommation et les capacités sont des paramètres de jeu arrondis. Ils ne remplacent pas les données AFM/FCOM, configurations réelles ni limitations opérationnelles du type.</div><div class="form-actions">${a.status==='En maintenance'?`<button class="btn primary" onclick="finishMaintenance('${id}');closeModal()">Libérer après maintenance</button>`:`<button class="btn" onclick="sendMaintenance('${id}');closeModal()">Planifier maintenance</button>`}<button class="btn danger" onclick="disposeAircraft('${id}');closeModal()">${a.ownership==='Leasing'?'Restituer au bailleur':'Vendre l’appareil'}</button></div>`,`<button class="btn" onclick="closeModal()">Fermer</button>`)}
function sendMaintenance(id){let a=getPlane(id);if(!a||a.status==='En maintenance')return;let cost=6000+a.seats*85;if(S.cash<cost){toast(`Il faut environ ${eur(cost)} pour cette visite.`,'bad');return}moneyTxn(`Visite technique · ${a.registration}`,-cost,'Maintenance');a.status='En maintenance';a.condition=Math.min(100,a.condition+18);a.nextMaintenance=Math.max(350,a.nextMaintenance+350);log('Visite de maintenance programmée',`${a.registration} entre en maintenance ; budget consommé : ${eur(cost)}.`,'Opérations');scheduleSave();render();toast('Appareil envoyé en maintenance.')}
function finishMaintenance(id){let a=getPlane(id);if(!a)return;a.status='Disponible';a.condition=Math.min(100,a.condition+15);a.nextMaintenance=Math.max(400,a.nextMaintenance);log('Retour en service',`${a.registration} revient à l’état disponible.`,'Opérations');scheduleSave();render();toast('Appareil libéré et disponible.')}
function disposeAircraft(id){let a=getPlane(id);if(!a)return;let revenue=a.ownership==='Leasing'?0:Math.round((a.paid||aircraftDef(a).price)*Math.max(.25,a.condition/100)*Math.max(.35,1-a.age*.06));if(a.ownership==='Leasing'){if(!confirm(`Restituer ${a.registration} au bailleur ? Cette action met fin au loyer mensuel simulé.`))return;S.fleet=S.fleet.filter(x=>x.id!==id);log('Restitution de location',`${a.registration} restitué au bailleur ${LESSORS.find(l=>l.id===a.lessor)?.name||''}.`,'Flotte')}else{if(!confirm(`Vendre ${a.registration} pour une valeur simulée de ${eur(revenue)} ?`))return;S.fleet=S.fleet.filter(x=>x.id!==id);moneyTxn(`Vente avion · ${a.registration}`,revenue,'Cession d’actif');log('Cession d’un aéronef',`${a.registration} vendu pour ${eur(revenue)} dans le modèle de simulation.`,'Flotte')}for(let f of S.flights.filter(f=>f.aircraft===id&&f.status==='Programmé'))f.aircraft='';for(let r of S.routes.filter(r=>r.aircraft===id))r.aircraft='';scheduleSave();render();toast('Appareil retiré de la flotte.')}
function buyAircraft(type){let def=AIRCRAFT.find(a=>a.id===type);if(!def)return;if(S.cash<def.price){modal('Financement nécessaire',`<div class="callout warning">Le prix de jeu de ${esc(def.model)} est de ${moneyM(def.price)}. Votre trésorerie est de ${moneyM(S.cash)}.</div><p class="muted" style="font-size:12px;line-height:1.6">Vous pouvez négocier un financement bancaire, choisir un appareil moins coûteux ou préférer le leasing.</p><div class="form-actions"><button class="btn primary" onclick="closeModal();openLoanModal()">Négocier un emprunt</button><button class="btn" onclick="closeModal();openLeaseMarket('${type}')">Examiner la location</button></div>`,`<button class="btn" onclick="closeModal()">Fermer</button>`);return}modal(`Commande constructeur · ${def.model}`,`<div class="roster-name" style="margin-bottom:14px"><div class="aircraft-icon">✈</div><div><div class="eyebrow">${esc(def.maker)} · marché du neuf</div><h2 style="font-size:21px;margin:4px 0">${esc(def.model)}</h2><div class="sub">${def.seats} sièges · ${fmt(def.range)} km d’autonomie catalogue</div></div></div><div class="grid g2"><div class="mini-kpi"><span>Prix de jeu</span><b>${moneyM(def.price)}</b></div><div class="mini-kpi"><span>Trésorerie après achat</span><b>${moneyM(S.cash-def.price)}</b></div></div><div class="field" style="margin-top:12px"><label>Immatriculation personnalisée</label><input id="new-registration" maxlength="8" value="${randomRegistration()}"></div><div class="field" style="margin-top:12px"><label>Nom interne de flotte</label><input id="new-aircraft-label" placeholder="Ex. Avion de la liaison Paris"></div><div class="callout warning" style="margin-top:12px">Commande immédiate dans la partie, livraison supposée instantanée pour faciliter le gameplay. Dans la réalité, les commandes constructeurs ont des délais, des conditions et des prix négociés.</div><div class="form-actions"><button class="btn primary" onclick="confirmBuy('${type}')">Confirmer la commande simulée</button></div>`,`<button class="btn" onclick="closeModal()">Annuler</button>`)}
function confirmBuy(type){let d=AIRCRAFT.find(a=>a.id===type);if(!d)return;if(S.cash<d.price){toast('Trésorerie insuffisante.','bad');return}let a=makeAircraft(type,'buy');a.registration=(document.getElementById('new-registration').value||randomRegistration()).toUpperCase().slice(0,8);a.label=document.getElementById('new-aircraft-label').value;moneyTxn(`Acquisition avion neuf · ${d.model}`,-d.price,'Investissement flotte');S.fleet.push(a);log('Achat d’un avion neuf',`${d.model} (${a.registration}) ajouté à la flotte pour ${moneyM(d.price)}.`,'Flotte');scheduleSave();closeModal();render();toast(`${a.model} acheté et ajouté à la flotte.`)}
function openLeaseMarket(type,lessorId=''){let d=AIRCRAFT.find(a=>a.id===type)||AIRCRAFT[4];let lessors=LESSORS.filter(l=>(!lessorId||l.id===lessorId)&&l.fleet.includes(d.id));if(!lessors.length)lessors=LESSORS.filter(l=>!lessorId||l.id===lessorId);modal(`Étude de location · ${d.model}`,`<div class="callout info" style="margin-bottom:14px">Les sociétés listées sont des bailleurs réels. Les disponibilités, loyers, dépôts et clauses sont inventés par le simulateur. Consultez les sites institutionnels pour les informations commerciales réelles.</div><form onsubmit="confirmLease(event,'${d.id}')"><div class="field"><label>Appareil</label><select id="lease-type" onchange="changeLeaseType(this.value)">${AIRCRAFT.map(a=>`<option value="${a.id}" ${a.id===d.id?'selected':''}>${esc(a.model)} · ${esc(a.maker)}</option>`).join('')}</select></div><div class="field" style="margin-top:12px"><label>Bailleur</label><select id="lease-lessor">${lessors.map(l=>`<option value="${l.id}" ${l.id===lessorId?'selected':''}>${esc(l.name)} · portefeuille de simulation</option>`).join('')}</select></div><div class="form-grid" style="margin-top:12px"><div class="field"><label>Durée (mois)</label><select id="lease-term"><option value="24">24 mois</option><option value="36">36 mois</option><option value="60" selected>60 mois</option><option value="84">84 mois</option><option value="120">120 mois</option></select></div><div class="field"><label>Loyer mensuel proposé (€)</label><input id="lease-price" type="number" step="1000" value="${d.lease}" min="10000"></div><div class="field"><label>Dépôt de garantie (mois)</label><select id="lease-deposit"><option value="1">1 mois</option><option value="2" selected>2 mois</option><option value="3">3 mois</option></select></div><div class="field"><label>Condition de l’appareil</label><select id="lease-condition"><option value="new">Neuf / livraison récente</option><option value="used">Jeune occasion</option></select></div></div><div id="lease-summary" class="callout" style="margin-top:12px">Loyer indicatif : ${eur(d.lease)}/mois · dépôt 2 mois : ${eur(d.lease*2)}.</div><div class="form-actions"><button class="btn primary" type="submit">Négocier et signer le bail</button></div></form>`,`<button class="btn" onclick="closeModal()">Annuler</button>`)}
function changeLeaseType(type){let d=AIRCRAFT.find(a=>a.id===type);let price=document.getElementById('lease-price'),summary=document.getElementById('lease-summary'),dep=document.getElementById('lease-deposit');if(d&&price){price.value=d.lease;if(summary)summary.textContent=`Loyer indicatif : ${eur(d.lease)}/mois · dépôt ${dep.value} mois : ${eur(d.lease*Number(dep.value))}.`}}
function confirmLease(e,type){e.preventDefault();let d=AIRCRAFT.find(a=>a.id===document.getElementById('lease-type').value)||AIRCRAFT.find(a=>a.id===type),lessorId=document.getElementById('lease-lessor').value,lessor=LESSORS.find(l=>l.id===lessorId),term=Number(document.getElementById('lease-term').value),price=Number(document.getElementById('lease-price').value),depositMonths=Number(document.getElementById('lease-deposit').value),deposit=price*depositMonths;if(!lessor||!d||price<=0)return;if(S.cash<deposit){toast(`Dépôt insuffisant : ${eur(deposit)} requis.`, 'bad');return}if(price<d.lease*.65){toast('Le loyer proposé est trop bas pour cette simulation ; augmentez l’offre.','bad');return}let a=makeAircraft(d.id,'lease',lessorId);a.monthlyLease=price;a.registration=randomRegistration();a.age=document.getElementById('lease-condition').value==='new'?0:2;a.leaseTerm=term;a.deposit=deposit;a.lessor=lessorId;moneyTxn(`Dépôt de location · ${a.registration}`,-deposit,'Dépôt de garantie');S.fleet.push(a);log('Contrat de leasing signé',`${lessor.name} fournit un ${d.model} pour ${eur(price)}/mois, durée ${term} mois, dépôt ${eur(deposit)}.`,'Flotte');scheduleSave();closeModal();render();toast(`${d.model} ajouté à la flotte en location.`)}
function openLessor(id){let l=LESSORS.find(x=>x.id===id);if(!l)return;modal(`Portefeuille · ${l.name}`,`<div class="roster-name" style="margin-bottom:14px"><div class="market-logo" style="background:${l.color}"><img src="https://www.google.com/s2/favicons?domain=${esc(l.domain)}&sz=64" alt="" style="width:30px;height:30px;border-radius:8px;background:white;object-fit:contain" onerror="this.parentNode.textContent='${esc(l.short)}'"></div><div><h2 style="margin:0;font-size:20px">${esc(l.name)}</h2><div class="sub">Bailleur identifié · ${esc(l.domain)}</div></div></div><p class="muted" style="font-size:12px;line-height:1.6">Sélectionnez un type de la gamme affichée dans le portefeuille simulé. La liste ne reflète pas la disponibilité actuelle ni les propositions commerciales du bailleur.</p><div class="table-wrap"><table><thead><tr><th>Type</th><th>Sièges</th><th>Loyer indicatif</th><th></th></tr></thead><tbody>${l.fleet.map(id=>{let a=AIRCRAFT.find(x=>x.id===id);return a?`<tr><td><b>${esc(a.model)}</b><div class="sub">${esc(a.maker)}</div></td><td>${a.seats}</td><td>${eur(a.lease)}/mois</td><td><button class="btn small primary" onclick="closeModal();openLeaseMarket('${a.id}','${l.id}')">Étudier</button></td></tr>`:''}).join('')}</tbody></table></div>`,`<button class="btn" onclick="closeModal()">Fermer</button>`)}
function modal(title,body,footer=''){let root=document.getElementById('modal-root');root.innerHTML=`<div class="modal-shade" onclick="if(event.target===this)closeModal()"><section class="modal"><div class="modal-head"><h2>${esc(title)}</h2><button class="modal-close" aria-label="Fermer" onclick="closeModal()">×</button></div><div class="modal-body">${body}</div>${footer?`<div style="padding:0 20px 20px">${footer}</div>`:''}</section></div>`;setTimeout(()=>root.querySelector('input:not([type=hidden]),textarea,select')?.focus({preventScroll:true}),80)}
function closeModal(){document.getElementById('modal-root').innerHTML=''}
function setupDefaults(){if(!S||!S.company)return;S.flights.forEach(f=>{if(!Array.isArray(f.crew)||f.crew.length===0){f.crew=autoCrew(f)}});if(!Array.isArray(S.suppliers)||S.suppliers.length===0)S.suppliers=SUPPLIERS.map(s=>({...s,price:s.base,discount:0,contract:'Sans contrat',termWeeks:0,lastOfferWeek:null}));S.people.forEach(p=>{if(!Array.isArray(p.daysOff))p.daysOff=[6,0];if(!Array.isArray(p.assigned))p.assigned=[];if(!Number.isFinite(p.morale))p.morale=75;if(!Number.isFinite(p.fatigue))p.fatigue=10});if(!S.transactions)S.transactions=[];if(!S.social)S.social=[];if(!S.journal)S.journal=[];if(!S.settings)S.settings={currency:'EUR',fuelPrice:.79,theme:'warm'};if(!S.company.logoText)S.company.logoText=S.company.code||defaultLogo;}
function boot(){setupDefaults();bootNav();if(S.settings?.theme&&S.settings.theme!=='warm'){let prev=S.settings.theme;S.settings.theme='warm';setTheme(prev)}render();document.getElementById('airport-list').innerHTML=airports.map(a=>`<option value="${esc(a.iata||a.icao)} — ${esc(a.name)}${a.city?', '+esc(a.city):''}"></option>`).join('');setTimeout(()=>loadAirports(false),500);window.addEventListener('beforeunload',save);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')save()});}
boot();
</script>
</body></html>
