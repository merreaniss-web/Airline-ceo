function logoHTML(domain,short,color='#183940',size=48){let d=String(domain||'').replace(/[^a-zA-Z0-9.-]/g,'');let label=String(short||'?').replace(/[&<>"']/g,'');return `<div class="market-logo" style="width:${size}px;height:${size}px;background:${color};"><img src="https://www.google.com/s2/favicons?domain=${d}&sz=128" alt="Logo ${label}" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='block'"><span style="display:none">${label}</span></div>`}
function effectiveNewPrice(type){let d=AIRCRAFT.find(a=>a.id===type);let discount=(S?.marketDiscounts&&S.marketDiscounts[type])||0;return Math.round((d?.price||0)*(1-discount/100));}
function setMarketMode(mode,maker=''){marketMode=mode;selectedMarketMaker=maker;render();}
function openManufacturerNegotiation(type){const a=AIRCRAFT.find(x=>x.id===type);if(!a)return;const d=MANUFACTURERS.find(m=>m.name===a.maker);const current=(S.marketDiscounts&&S.marketDiscounts[type])||0;modal(`Négocier avec ${a.maker}`,`<div class="roster-name" style="margin-bottom:12px">${logoHTML(d?.domain||'airbus.com',a.maker.slice(0,3).toUpperCase(), '#173740',52)}<div><h2 style="margin:0;font-size:20px">${esc(a.model)}</h2><div class="sub">Prix catalogue fictif : ${moneyM(a.price)} · remise actuelle enregistrée : ${pct(current)}</div></div></div><div class="callout info">Négociation de jeu : aucun devis n’est envoyé au constructeur. Pour une demande commerciale réelle, utilisez le site officiel du constructeur.</div><form onsubmit="submitManufacturerOffer(event,'${a.id}')"><div class="field" style="margin-top:13px"><label>Remise demandée</label><select id="maker-discount"><option value="2">2 % · commande simple</option><option value="4" selected>4 % · commande standard</option><option value="6">6 % · engagement de flotte</option><option value="8">8 % · volume important</option><option value="10">10 % · accord stratégique</option><option value="12">12 % · offre ambitieuse</option></select></div><div class="field" style="margin-top:12px"><label>Nombre d’appareils commandés</label><select id="maker-qty"><option value="1">1 avion</option><option value="2">2 avions</option><option value="5" selected>5 avions</option><option value="10">10 avions</option><option value="20">20 avions</option></select></div><div class="callout warning" style="margin-top:12px">Les remises, prix et livraisons sont simulés et ne reflètent pas les conditions de vente réelles d’Airbus, Boeing ou d’un autre constructeur.</div><div class="form-actions"><button class="btn primary" type="submit">Présenter mon offre</button></div></form>`,`<button class="btn" onclick="closeModal()">Annuler</button>`)}
function submitManufacturerOffer(e,type){e.preventDefault();const a=AIRCRAFT.find(x=>x.id===type);if(!a)return;const target=Number(document.getElementById('maker-discount').value),qty=Number(document.getElementById('maker-qty').value);const max=Math.min(12,2+S.reputation*.065+Math.max(0,qty-1)*.15+(S.fleet.length>=4?1.2:0));let accepted=target<=max||Math.random()<Math.min(.86,.18+S.reputation/160+(qty/100));let result=accepted?target:Math.max((S.marketDiscounts&&S.marketDiscounts[type])||0,Math.round(max*.7*10)/10);S.marketDiscounts=S.marketDiscounts||{};S.marketDiscounts[type]=result;log(accepted?'Accord de prix constructeur (simulation)':'Contre-proposition constructeur (simulation)',`${a.maker} · ${a.model} : remise demandée ${target} %, remise de jeu retenue ${result} %, volume demandé ${qty} appareil(s).`,'Flotte');scheduleSave();closeModal();render();toast(accepted?`Remise de jeu de ${pct(result)} enregistrée pour ${a.model}.`:`Contre-proposition simulée : ${pct(result)} pour ${a.model}.` ,accepted?'good':'bad')}

 panel('Tableau de suivi opérationnel',list.length?`<div class="table-wrap"><table><thead><tr><th>Vol</th><th>Ligne</th><th>Heure</th><th>Appareil</th><th>Statut</th><th>Progression</th><th>Action</th></tr></thead><tbody>${list.map(f=>{let r=getRoute(f.route),a=getPlane(f.aircraft),st=liveStatus(f,now);return `<tr><td><b>${esc(f.id)}</b></td><td>${esc(r?r.origin+' → '+r.dest:'Ligne supprimée')}</td><td>J${((f.day-1)%7)+1} · ${esc(f.time)}</td><td>${esc(a?a.model:'—')}</td><td><span class="pill ${st[0]==='En vol'?'blue':st[0]==='Arrivé'?'':'orange'}">${st[0]}</span></td><td><div style="min-width:100px;background:#e8e4da;border-radius:99px;height:8px;overflow:hidden"><div style="width:${st[1]}%;height:8px;background:var(--teal)"></div></div><small>${st[1]}%</small></td><td><button class="btn small" onclick="openFlightEdit('${f.id}')">Modifier</button></td></tr>`}).join('')}</tbody></table></div>`:`<p>Aucun vol programmé dans cette période.</p>`);

s<select id="cab-df-frequency" class="input"><option value="1" ${c.dutyFreeFrequency==1?'selected':''}>1 passage</option><option value="2" ${c.dutyFreeFrequency==2?'selected':''}>2 passages</option><option value="3" ${c.dutyFreeFrequency==3?'selected':''}>3 passages</option></select></label><p class="muted">Les recettes et coûts sont estimés dans le simulateur, sans lien avec des prix réels.</p></div></section><section class="panel"><div class="panel-head"><div><h2>Coût et rendement</h2></div></div><div class="panel-body"><label>Coût repas / passager (€)<input id="cab-meal-cost" class="input" type="number" min="0" value="${c.mealCost??8}"></label><label style="display:block;margin-top:12px">Prix de vente repas (€)<input id="cab-meal-price" class="input" type="number" min="0" value="${c.mealPrice??12}"></label><label style="display:block;margin-top:12px">Recette duty free estimée par vol (€)<input id="cab-df-revenue" class="input" type="number" min="0" value="${c.dutyFreeRevenue??450}"></label><button class="btn primary wide" style="margin-top:14px" onclick="saveCabinServices()">Enregistrer</button></div></section></div>`+
 panel('Déroulé type en vol',`<div class="timeline"><div class="timeline-item"><b>T+00</b> Décollage et installation cabine</div><div class="timeline-item"><b>T+${c.mealStart} min</b> ${c.meals?'Service repas '+(c.paidMeals?'payant':'inclus'):'Pas de service repas'} · menu ${esc(c.menu)}</div><div class="timeline-item"><b>T+${c.dutyFreeStart} min</b> ${c.dutyFree?'Passage duty free':'Duty free désactivé'}</div><div class="timeline-item"><b>Avant arrivée</b> Dernier passage cabine (${c.frequency} passage(s) prévu(s))</div></div>`);

function saveCabinServices(){let c=S.cabinServices;c.meals=document.getElementById('cab-meals').checked;c.paidMeals=document.getElementById('cab-paid').checked;c.beverages=document.getElementById('cab-bev').checked;c.hotMeals=document.getElementById('cab-hot').checked;c.dutyFree=document.getElementById('cab-dutyfree').checked;c.menu=document.getElementById('cab-menu').value;c.mealStart=+document.getElementById('cab-meal-start').value||30;c.frequency=+document.getElementById('cab-frequency').value||1;c.dutyFreeStart=+document.getElementById('cab-df-start').value||45;c.dutyFreeFrequency=+document.getElementById('cab-df-frequency').value||1;c.mealCost=+document.getElementById('cab-meal-cost').value||0;c.mealPrice=+document.getElementById('cab-meal-price').value||0;c.dutyFreeRevenue=+document.getElementById('cab-df-revenue').value||0;scheduleSave();log('Politique cabine modifiée',`Menu ${c.menu}; repas ${c.meals?(c.paidMeals?'payants':'inclus'):'désactivés'}; duty free ${c.dutyFree?'actif':'désactivé'}.`,'Cabine');render();toast('Services à bord enregistrés');}

function getGameClock(){let c=S.clockSettings||{mode:'real',speed:1,anchorReal:Date.now(),anchorGame:Date.now()};if(c.mode==='real')return new Date();if(c.mode==='paused')return new Date(c.anchorGame||Date.now());return new Date((c.anchorGame||Date.now())+(Date.now()-(c.anchorReal||Date.now()))*(Number(c.speed)||1));}

function runAudit(kind){let findings=[],score=100;if(kind==='Lignes'){S.routes.forEach(r=>{if(!r.aircraft||!getPlane(r.aircraft)){findings.push(`Ligne ${r.origin}-${r.dest} sans avion affecté.`);score-=15}if(r.frequency>0&&!S.fleet.length){findings.push(`Fréquence impossible : aucune flotte disponible pour ${r.origin}-${r.dest}.`);score-=20}if(r.fare<r.km*.07){findings.push(`Tarif potentiellement insuffisant sur ${r.origin}-${r.dest}.`);score-=5}})}else if(kind==='Personnel'){S.people.forEach(p=>{if(p.fatigue>=80){findings.push(`${p.first} ${p.last} : fatigue ${p.fatigue}%, repos recommandé.`);score-=5}if(p.status!=='Actif'){findings.push(`${p.first} ${p.last} : statut ${p.status}.`);score-=4}});S.flights.filter(f=>f.status==='Programmé').forEach(f=>{let crew=(f.crew||[]).map(getStaff).filter(Boolean);if(crew.length===0)findings.push(`Vol ${f.id} sans équipage affecté.`)})}else{if(!S.company.name||S.company.name==='Nouvelle compagnie')findings.push('Identité de compagnie non configurée.');if(!S.fleet.length)findings.push('Aucun avion acquis ou loué.');if(!S.routes.length)findings.push('Aucune ligne créée.');if(!S.people.length)findings.push('Aucun salarié recruté.');if(S.cash<0)findings.push('Trésorerie négative.');if(S.suppliers.some(x=>x.contract==='Sans contrat'))findings.push('Au moins un fournisseur est sans contrat.');score-=findings.length*8}let a={id:uid('AUD'),day:S.day,kind,score:Math.max(0,score),findings,createdAt:new Date().toISOString()};S.audits.unshift(a);log(`Audit ${kind}`,`Score ${a.score}/100 · ${findings.length} point(s) à vérifier.`, 'Audit');scheduleSave();render();toast(`Audit ${kind} terminé : ${a.score}/100`)}
function resolveScenario(id,choice){let sc=S.scenarios.find(x=>x.id===id);if(!sc)return;let f=S.flights.find(x=>x.id===sc.flight),old=getPlane(sc.aircraft);if(choice==='replace'){let replacement=getPlane(sc.replacement)||S.fleet.find(a=>a.id!==sc.aircraft&&a.status==='Disponible'&&(!old||a.seats>=old.seats*.75));if(!replacement){toast('Aucun avion de remplacement disponible. Achetez ou louez un appareil compatible.','bad');return}replacement.status='Disponible';f.aircraft=replacement.id;f.status='Programmé';f.failureChecked=true;f.note='Appareil remplacé après incident technique';sc.status='Résolu';log('Appareil de remplacement affecté',`${replacement.registration} remplace ${old?.registration||'l’appareil en panne'} pour ${f.id}.`,'Opérations');S.messages.unshift({id:uid('MSG'),day:S.day,from:'Contrôle des opérations',to:'Direction',subject:'Remplacement confirmé',text:`Le vol ${f.id} repart au planning avec ${replacement.registration}.`,status:'Non lu',priority:'Normale'})}else{if(f)f.status='Annulé';sc.status='Vol annulé';S.cancelled++;log('Incident clôturé par annulation',`${sc.flight} annulé après panne technique.`,'Opérations')}if(old)old.status='En maintenance';scheduleSave();render();toast('Scénario traité.')}
function sendStaffMessage(e){e.preventDefault();let from=document.getElementById('msg-from').value,to=document.getElementById('msg-to').value,subject=document.getElementById('msg-subject').value.trim(),textValue=document.getElementById('msg-text').value.trim(),priority=document.getElementById('msg-priority').value;if(!subject||!textValue)return;S.messages.unshift({id:uid('MSG'),day:S.day,from,to,subject,text:textValue,status:'Non lu',priority});log('Message interne',`${from} → ${to} : ${subject}`,'RH');scheduleSave();render();toast('Message interne envoyé.')}

function renderMessages(){return pageHead('Communication interne · RH & opérations','Messagerie interne','Messages fictifs des salariés, alertes de fatigue, absences et échanges de direction.','<button class="btn primary" onclick="document.getElementById(\'new-message\').scrollIntoView({behavior:\'smooth\'})">＋ Nouveau message</button>')+`<div class="grid g2"><section class="panel"><div class="panel-head"><div><h2>Boîte de réception</h2><p>${S.messages.filter(m=>m.status!=='Lu').length} message(s) non lu(s)</p></div></div><div class="panel-body">${S.messages.length?S.messages.map(m=>`<article class="vendor-row" style="align-items:flex-start"><div class="initials">${esc((m.from||'?').slice(0,2).toUpperCase())}</div><div style="flex:1;min-width:0"><div class="vendor-name">${esc(m.subject)} ${m.priority==='Urgent'?'<span class="pill red">Urgent</span>':''}</div><div class="sub">J${m.day} · ${esc(m.from)} → ${esc(m.to)} · ${esc(m.status)}</div><p style="font-size:12px;line-height:1.6">${esc(m.text)}</p>${m.status!=='Lu'?`<button class="btn small" onclick="markMessage('${m.id}')">Marquer lu</button>`:''}</div></article>`).join(''):empty('Aucun message','Les absences, incidents et communications apparaîtront ici.')}</div></section><section class="panel" id="new-message"><div class="panel-head"><div><h2>Envoyer un message</h2><p>Créer une note à l’équipe, au RH ou aux opérations.</p></div></div><div class="panel-body"><form onsubmit="sendStaffMessage(event)"><div class="field"><label>Expéditeur</label><select id="msg-from"><option>Direction</option><option>Service RH</option><option>Contrôle des opérations</option>${S.people.map(p=>`<option>${esc(p.first+' '+p.last)}</option>`).join('')}</select></div><div class="field" style="margin-top:10px"><label>Destinataire</label><select id="msg-to"><option>Direction</option><option>Service RH</option><option>Contrôle des opérations</option><option>Équipe PNT</option><option>Équipe PNC</option><option>Équipe sol</option>${S.people.map(p=>`<option>${esc(p.first+' '+p.last)}</option>`).join('')}</select></div><div class="field" style="margin-top:10px"><label>Objet</label><input id="msg-subject" required maxlength="100" placeholder="Ex. indisponibilité demain"></div><div class="field" style="margin-top:10px"><label>Message</label><textarea id="msg-text" required rows="4" maxlength="1000" placeholder="Expliquez le problème ou la demande…"></textarea></div><div class="field" style="margin-top:10px"><label>Priorité</label><select id="msg-priority"><option>Normale</option><option>Urgent</option></select></div><div class="form-actions"><button class="btn primary" type="submit">Envoyer</button></div></form></div></section></div>`}
function renderAudits(){return pageHead('Contrôle interne · qualité · conformité de simulation','Audits & scénarios','Auditez les lignes, le personnel et l’entreprise. Traitez les pannes et incidents opérationnels.','<button class="btn" onclick="runAudit(\'Lignes\')">Auditer les lignes</button><button class="btn" onclick="runAudit(\'Personnel\')">Auditer le personnel</button><button class="btn primary" onclick="runAudit(\'Compagnie\')">Audit général</button>')+`<div class="grid g2"><section class="panel"><div class="panel-head"><div><h2>Scénarios opérationnels</h2><p>Incidents générés pendant la simulation.</p></div></div><div class="panel-body">${S.scenarios.length?S.scenarios.map(sc=>{let f=S.flights.find(x=>x.id===sc.flight),a=getPlane(sc.aircraft);return `<article class="vendor-row" style="align-items:flex-start"><div class="initials">!</div><div style="flex:1"><div class="vendor-name">${esc(sc.type)} · ${esc(sc.flight)}</div><div class="sub">J${sc.day} · ${esc(a?.registration||'Avion inconnu')} · ${esc(sc.status)}</div>${sc.status==='À traiter'?`<p class="sub">Choisissez une solution : remplacement ou annulation.</p><div class="form-actions"><button class="btn small primary" onclick="resolveScenario('${sc.id}','replace')">Remplacer l’avion</button><button class="btn small danger" onclick="resolveScenario('${sc.id}','cancel')">Annuler le vol</button></div>`:''}</div></article>`}).join(''):empty('Aucun incident en cours','Les scénarios apparaîtront au cours des journées simulées.')}</div></section><section class="panel"><div class="panel-head"><div><h2>Historique des audits</h2><p>Résultats conservés dans la sauvegarde locale.</p></div></div><div class="panel-body">${S.audits.length?S.audits.map(a=>`<article class="vendor-row" style="align-items:flex-start"><div class="mini-kpi"><span>Score</span><b>${a.score}/100</b></div><div style="flex:1"><div class="vendor-name">Audit ${esc(a.kind)} · J${a.day}</div><div class="sub">${a.findings.length} point(s) détecté(s)</div><ul style="font-size:12px;line-height:1.7;padding-left:18px">${a.findings.map(x=>`<li>${esc(x)}</li>`).join('')||'<li>Aucun point majeur détecté.</li>'}</ul></div></article>`).join(''):empty('Aucun audit réalisé','Lancez un audit pour générer un rapport.')}</div></section></div>`}
function render(){bootNav();syncHead();const v=document.getElementById('view');const pages={home:renderHome,help:renderHelp,fleet:renderFleet,market:renderMarket,map:renderMapPage,routes:renderRoutes,flights:renderFlights,people:renderPeople,hr:renderHR,suppliers:renderSuppliers,finance:renderFinance,social:renderSocial,journal:renderJournal,company:renderCompany,roster:renderRoster,live:renderLive,cabin:renderCabin,equipment:renderEquipment,time:renderTime,audit:renderAudits,messages:renderMessages};v.innerHTML=(pages[activeTab]||renderHome)();if(activeTab==='map')setTimeout(initMap,100);if(activeTab==='flights')setTimeout(drawWeeklyStrip,30);}
function renderHelp(){return pageHead('Manuel du commandant · prise en main','Guide du jeu','Un guide pratique pour lancer votre compagnie, préparer les équipages et gérer les opérations.')+`<div class="grid g2" style="align-items:start">${panel('1 · Démarrer votre compagnie',`<ol style="padding-left:20px;line-height:1.8"><li>Dans <b>Compagnie</b>, définissez le nom, le code, le pays, la base et le logo.</li><li>Dans <b>Finances</b>, obtenez un financement ou des capitaux si nécessaire.</li><li>Dans <b>Marché</b>, achetez un appareil neuf ou louez un avion.</li><li>Dans <b>Gestion des lignes</b>, choisissez les aéroports, négociez les conditions puis ouvrez la ligne.</li></ol>`,`Achats, contrats et montants utilisent des paramètres de simulation`)}${panel('2 · Programmer les vols',`<ol style="padding-left:20px;line-height:1.8"><li>Ouvrez <b>Vols & planning</b>, puis <b>Programmer un vol</b>.</li><li>Choisissez la ligne, le jour, l’heure locale et l’avion.</li><li>Le jeu crée automatiquement le vol aller et le retour, inverse les aéroports, estime la durée de chaque trajet et ajoute le temps de rotation au sol.</li><li>Vérifiez les deux vols dans le calendrier et ajustez les horaires en cas de conflit.</li><li>Un vol ne peut pas être réalisé sans avion disponible et équipage requis.</li></ol>`,`Les durées sont des estimations du simulateur, non des horaires opérationnels garantis`)}${panel('3 · Recrutement rapide des équipages',`<p style="line-height:1.7">Dans <b>Personnel</b> ou <b>Service RH</b>, appuyez sur <b>Recruter une équipe (2 PNT + 4 PNC)</b>. Six salariés sont créés immédiatement, chacun avec un prénom et un nom uniques : deux pilotes et quatre personnels cabine. Réutilisez le bouton pour recruter une autre équipe. Les rôles et salaires simulés distinguent commandant, officier pilote, chef de cabine et personnel cabine.</p><p style="line-height:1.7">Utilisez <b>Calendrier RH</b> pour organiser service, repos, congés, formation, réserve, horaires et mission. Les absences et la fatigue peuvent rendre des salariés indisponibles.</p>`,`Les identités sont générées pour votre partie et ne représentent pas des personnes réelles`)}${panel('4 · Équipage minimal par durée de vol',`<div class="table-wrap"><table><thead><tr><th>Catégorie</th><th>Durée estimée</th><th>PNT</th><th>PNC</th></tr></thead><tbody><tr><td><b>Court-courrier</b></td><td>Moins de 3 h</td><td>2</td><td>2</td></tr><tr><td><b>Moyen-courrier</b></td><td>3 h à moins de 6 h</td><td>2</td><td>4</td></tr><tr><td><b>Long-courrier</b></td><td>6 h ou plus</td><td>4</td><td>12</td></tr></tbody></table></div><p style="line-height:1.7">Le classement du jeu dépend de la durée estimée pour la ligne et l’avion choisi, pas seulement de la taille de l’appareil. Le programme propose l’effectif disponible ; si l’effectif affecté est insuffisant, le vol est annulé dans la simulation.</p>`,`Règles d’équipage simplifiées pour le jeu`)}${panel('5 · Exploitation et suivi',`<ul style="padding-left:20px;line-height:1.8"><li><b>Suivi des vols :</b> statuts simulés au sol, embarquement, en vol et arrivée.</li><li><b>Incidents :</b> traitez panne ou absence depuis les scénarios et messages.</li><li><b>Messagerie interne :</b> consultez les alertes et demandes du personnel.</li><li><b>Audits :</b> contrôlez lignes, RH et finances.</li><li><b>Services à bord :</b> réglez repas, boissons, vente à bord et duty-free.</li><li><b>Fournisseurs et équipements :</b> négociez les contrats et achetez du matériel.</li></ul>`,`Le journal conserve les décisions et événements de votre compagnie`)}${panel('6 · Temps et sauvegarde',`<p style="line-height:1.7">Dans <b>Temps de jeu</b>, choisissez l’horloge réelle, une accélération ou la pause. Vous pouvez aussi simuler une journée ou une semaine depuis le planning.</p><p style="line-height:1.7">La sauvegarde est locale au navigateur. Exportez régulièrement vos données depuis <b>Compagnie</b>, surtout avant de remplacer le fichier sur GitHub ou de changer d’appareil.</p><div class="callout warning">Airline CEO est un jeu de gestion : il ne remplace pas un dispatch certifié, les règles officielles de service/repos, les briefings, la météo opérationnelle ou des données de suivi aérien réelles.</div>`,`Commencez par une ligne, une rotation aller-retour et un équipage complet`)}</div>`}

function renderHome(){let tomorrow=S.flights.filter(f=>f.day===S.day&&f.status==='Programmé'),done=S.flights.filter(f=>f.status==='Réalisé').length,open=S.routes.filter(r=>r.status==='Ouverte').length,monthly=S.people.filter(p=>p.status==='Actif').reduce((n,p)=>n+p.salary,0),lease=S.fleet.reduce((n,a)=>n+a.monthlyLease,0);let topFlights=tomorrow.slice(0,6);let tx=S.transactions.slice(0,7);let routes=S.routes.slice(0,4);return pageHead('Présidence · centre de contrôle',`Bonjour, ${esc(S.company.name)}`,`Votre compagnie au jour ${S.day} de la simulation. Pilotez les opérations, la trésorerie et la croissance depuis un poste de direction.`,`<button class="btn primary" onclick="advanceDay()">▶ Avancer d’un jour</button><button class="btn" onclick="advanceWeek()">＋ Fin de semaine</button>`)+`<div class="grid g4" style="margin-bottom:16px">${metric('Trésorerie disponible',moneyM(S.cash),'Liquidités consolidées','')}${metric('Résultat cumulé',moneyM(S.revenueTotal-S.costTotal),'Revenus moins charges','orange')}${metric('Flotte active',S.fleet.length+' appareil(s)',S.fleet.filter(a=>a.status!=='En maintenance').length+' disponible(s)','blue')}${metric('Passagers transportés',fmt(S.passengers),'Depuis le début de la partie','gold')}</div><div class="split"><div class="grid" style="align-content:start;gap:15px">${panel('Tableau des départs',`<div class="table-wrap"><table><thead><tr><th>Heure</th><th>Vol / ligne</th><th>Appareil</th><th>État</th></tr></thead><tbody>${topFlights.length?topFlights.map(f=>{let r=getRoute(f.route),a=getPlane(f.aircraft);return `<tr><td class="strong">${esc(f.time)}</td><td>${r?routeHTML(r):esc(f.route)}<div class="sub">${esc(f.gate||'Porte à définir')}</div></td><td>${a?esc(a.registration)+'<div class="sub">'+esc(a.model)+'</div>':'À affecter'}</td><td><span class="pill ${f.status==='Programmé'?'blue':'green'}">${esc(f.status)}</span></td></tr>`}).join(''):`<tr><td colspan="4">${empty('Aucun départ prévu','Planifiez un vol dans l’onglet Vols & planning.',`<button class="btn primary" onclick="setTab('flights')">Ouvrir le planning</button>`)}</td></tr>`}</tbody></table></div>`,`Départs planifiés aujourd’hui`,`<button class="btn small" onclick="setTab('flights')">Gérer les vols ↗</button>`)}${panel('Réseau commercial',routes.length?routes.map(r=>`<div class="vendor-row"><div style="min-width:0;flex:1">${routeHTML(r)}<div class="sub" style="margin-top:8px">${routeFlag(r)} · ${fmt(r.km)} km · ${r.frequency} vol/jour · ${pct(r.load)} de remplissage</div></div><div class="vendor-data"><b>${eur(r.fare)}</b><small>tarif moyen</small></div></div>`).join(''):empty('Aucune ligne','Ouvrez votre première liaison commerciale.'),`La santé de votre réseau`)}${panel('Derniers mouvements financiers',tx.length?`<div class="table-wrap"><table><thead><tr><th>Jour</th><th>Opération</th><th>Type</th><th class="right">Montant</th></tr></thead><tbody>${tx.map(t=>`<tr><td>J${t.day}</td><td>${esc(t.label)}</td><td><span class="pill">${esc(t.kind)}</span></td><td class="right money" style="color:${t.amount<0?'var(--red)':'var(--green)'}">${t.amount<0?'−':'+'}${eur(Math.abs(t.amount))}</td></tr>`).join('')}</tbody></table></div>`:empty('Pas encore de mouvements','Les transactions apparaîtront ici lors des opérations.'),`Journal de trésorerie`)}</div><div class="grid" style="align-content:start;gap:15px">${panel('Indicateurs de direction',`<div class="grid g2"><div class="mini-kpi"><span>Passagers / jour</span><b>${fmt(S.passengers/Math.max(1,S.day))}</b></div><div class="mini-kpi"><span>Réputation</span><b>${fmt(S.reputation)}/100</b></div><div class="mini-kpi"><span>Dette bancaire</span><b>${moneyM(S.debt)}</b></div><div class="mini-kpi"><span>Effectif actif</span><b>${S.people.filter(p=>p.status==='Actif').length}</b></div></div><div style="margin-top:15px"><div style="display:flex;justify-content:space-between;margin-bottom:7px;font-size:11px"><b>Qualité de service</b><span>${S.company.service}/100</span></div><div class="progress"><span style="width:${S.company.service}%"></span></div><div style="display:flex;justify-content:space-between;margin:14px 0 7px;font-size:11px"><b>Sécurité opérationnelle</b><span>${S.company.safety}/100</span></div><div class="progress"><span style="width:${S.company.safety}%;background:var(--gold)"></span></div><div style="display:flex;justify-content:space-between;margin:14px 0 7px;font-size:11px"><b>Image de marque</b><span>${S.company.brandScore}/100</span></div><div class="progress"><span style="width:${S.company.brandScore}%;background:var(--orange)"></span></div></div>`,`Vue synthétique de l’entreprise`)}${panel('Priorités immédiates',`<div class="timeline">${[{t:'Personnel',d:S.people.filter(p=>p.status==='Actif').length<15?'Renforcer les équipes avant d’augmenter les fréquences.':'Vérifier les rotations et les repos légaux.'},{t:'Fournisseurs',d:S.negotiatedWeek<S.week?'Les négociations hebdomadaires sont ouvertes.':'Accords de la semaine enregistrés.'},{t:'Aéroports',d:S.routes.some(r=>r.status!=='Ouverte')?'Des dossiers de ligne attendent une décision.':'Le réseau actuel est en exploitation.'},{t:'Finances',d:S.cash<10000000?'Attention : la trésorerie passe sous 10 M€.':'Surveiller les frais fixes et les échéances.'}].map((x,i)=>`<div class="timeline-item"><div class="timeline-time">${['RH','ACH','OPS','€'][i]}</div><div class="timeline-rail"><div class="timeline-dot"></div><div class="timeline-stem"></div></div><div class="timeline-text"><b>${x.t}</b><p>${x.d}</p></div></div>`).join('')}</div>`,`À traiter cette semaine`)}${panel('Actions rapides',`<div class="grid g2"><button class="btn" onclick="setTab('market')">✈ Acheter / louer</button><button class="btn" onclick="setTab('routes')">↗ Ouvrir une ligne</button><button class="btn" onclick="setTab('people')">♙ Recruter</button><button class="btn" onclick="setTab('suppliers')">◇ Négocier</button><button class="btn" onclick="setTab('finance')">€ Financement</button><button class="btn" onclick="setTab('social')">▣ Communiquer</button></div>`,`Accès directs`)}</div></div><p class="footer-note">Airline CEO est une simulation de gestion : les coûts, taux, contrats, demandes, prix des avions et résultats sont des paramètres de jeu. Ils ne constituent ni des données de tarification contractuelle ni des offres financières réelles.</p>`}
function renderFleet(){let totalValue=S.fleet.reduce((n,a)=>n+(a.paid||0),0),leases=S.fleet.filter(a=>a.ownership==='Leasing').reduce((n,a)=>n+a.monthlyLease,0);return pageHead('Actifs · disponibilité · maintenance','La flotte','Suivez la propriété, les baux, l’état technique, le potentiel de chaque appareil et son affectation aux lignes.','<button class="btn primary" onclick="setTab(\'market\')">＋ Marché des avions</button>')+`<div class="grid g4" style="margin-bottom:16px">${metric('Avions au registre',S.fleet.length,'Propriété et leasing','')}${metric('Valeur d’acquisition',moneyM(totalValue),'Avions achetés','blue')}${metric('Loyers mensuels',eur(leases),'Baux actifs','orange')}${metric('Disponibilité',pct(S.fleet.length?S.fleet.filter(a=>a.status==='Disponible').length/S.fleet.length*100:0),'État du parc','gold')}</div><section class="panel"><div class="panel-head"><div><h2>Registre des aéronefs</h2><p>La disponibilité réelle de simulation dépend des vols et de la maintenance.</p></div><button class="btn small" onclick="exportCSV('fleet')">Exporter CSV</button></div><div class="table-wrap"><table><thead><tr><th>Immatriculation</th><th>Appareil / constructeur</th><th>Capacité</th><th>Propriété</th><th>État</th><th>Condition</th><th>Prochain check</th><th></th></tr></thead><tbody>${S.fleet.length?S.fleet.map(a=>`<tr><td><b>${esc(a.registration)}</b><div class="sub">${esc(a.id)}</div></td><td><div class="roster-name"><img class="aircraft-thumb" src="${aircraftPhoto(a.type||a.id,a.maker)}" alt="Photo d’illustration ${esc(a.model)}" loading="lazy" onerror="this.style.display='none'"><div><b>${esc(a.model)}</b><div class="sub">${esc(a.maker)}</div></div></div></td><td>${a.seats} sièges<div class="sub">${fmt(a.range)} km max. (catalogue de jeu)</div></td><td><span class="pill ${a.ownership==='Leasing'?'blue':'green'}">${a.ownership}</span>${a.lessor?`<div class="sub">${esc(LESSORS.find(x=>x.id===a.lessor)?.name||a.lessor)}</div>`:''}</td><td><span class="pill ${a.status==='Disponible'?'green':a.status==='En maintenance'?'orange':'blue'}">${esc(a.status)}</span></td><td><b>${a.condition}%</b><div class="progress" style="width:85px;margin-top:5px"><span style="width:${a.condition}%;background:${a.condition<60?'var(--red)':'var(--teal)'}"></span></div></td><td>${a.nextMaintenance} h<div class="sub">${a.cycles} cycles</div></td><td><div class="table-actions"><button class="btn small" onclick="aircraftDetail('${a.id}')">Détails</button>${a.status==='En maintenance'?`<button class="btn small primary" onclick="finishMaintenance('${a.id}')">Libérer</button>`:`<button class="btn small" onclick="sendMaintenance('${a.id}')">Maintenance</button>`}</div></td></tr>`).join(''):`<tr><td colspan="8">${empty('Flotte vide','Achetez ou louez votre premier appareil sur le marché.',`<button class="btn primary" onclick="setTab('market')">Accéder au marché</button>`)}</td></tr>`}</tbody></table></div></section><div class="grid g2" style="margin-top:15px">${panel('Politique de maintenance',`<p class="muted" style="line-height:1.6">Une visite technique réduit temporairement la disponibilité et coûte une somme liée à la catégorie de l’appareil. Une condition très dégradée pénalise la fiabilité et la satisfaction passager.</p><div class="grid g2"><div class="mini-kpi"><span>Condition moyenne</span><b>${fmt(S.fleet.length?S.fleet.reduce((a,b)=>a+b.condition,0)/S.fleet.length:0)} %</b></div><div class="mini-kpi"><span>Cycles enregistrés</span><b>${fmt(S.fleet.reduce((n,a)=>n+a.cycles,0))}</b></div></div>`,`Flotte et sécurité`)}${panel('Engagements de location',S.fleet.filter(a=>a.ownership==='Leasing').length?`<div class="table-wrap"><table><thead><tr><th>Appareil</th><th>Bailleur</th><th>Loyer / mois</th></tr></thead><tbody>${S.fleet.filter(a=>a.ownership==='Leasing').map(a=>`<tr><td>${esc(a.registration)} · ${esc(a.model)}</td><td>${esc(LESSORS.find(x=>x.id===a.lessor)?.name||'Bailleur')}</td><td class="money">${eur(a.monthlyLease)}</td></tr>`).join('')}</tbody></table></div>`:empty('Aucun contrat de location','Les nouveaux baux seront enregistrés automatiquement.'),`Loyers de la flotte`)}</div>`}
function renderMarket(){
const switcher=`<div class="market-switch"><button class="btn ${marketMode==='new'?'primary':''}" onclick="setMarketMode('new','')">✈ Acheter neuf</button><button class="btn ${marketMode==='lease'?'primary':''}" onclick="setMarketMode('lease','')">↔ Louer / leasing</button></div>`;
let body='';
if(marketMode==='new'&&!selectedMarketMaker){
body=`<div class="section-title"><h2>Choisir un constructeur</h2><div class="rule"></div><span class="pill">${MANUFACTURERS.length} constructeurs</span></div><div class="grid g2">${MANUFACTURERS.map(m=>{let n=AIRCRAFT.filter(a=>a.maker===m.name&&NEW_CATALOG_IDS.has(a.id)).length;return `<button class="maker-card" onclick="setMarketMode('new','${esc(m.name)}')">${logoHTML(m.domain,m.name.slice(0,3).toUpperCase(),'#173740',58)}<span style="flex:1;min-width:0"><b>${esc(m.name)}</b><small>${esc(m.region)} · ${n} modèle(s) dans le catalogue du jeu</small><small>${esc(m.description)}</small></span><span class="pill orange">Voir ↗</span></button>`}).join('')}</div><div class="callout info" style="margin-top:15px">Les constructeurs sont réels. Le catalogue ci-dessous est un catalogue de jeu étendu, pas la totalité mondiale de chaque gamme. Les prix et remises sont fictifs. Les familles affichées et les programmes en développement sont distingués lorsqu’ils ne correspondent pas à une livraison immédiatement disponible.</div>`;

')">Dossier</button></div></td></tr>`).join('')}</tbody></table></div>`:empty('Pas de lignes ouvertes','Ouvrez votre première liaison en validant les conditions aéroportuaires.'))}</div><div class="grid" style="align-content:start;gap:15px">${panel('Négociations en cours',waiting.length?waiting.map(r=>`<div class="map-side-item" onclick="routeBrief('${r.id}')"><div style="display:flex;justify-content:space-between;gap:8px;align-items:start"><div>${routeHTML(r)}<div class="sub" style="margin-top:8px">${fmt(r.km)} km · ${routeFlag(r)}</div></div><span class="pill orange">${esc(r.status)}</span></div><div style="margin-top:12px;display:grid;gap:8px"><div><div style="display:flex;justify-content:space-between;font-size:10px;margin-bottom:4px"><span>${esc(r.origin)} · frais et taxes</span><b>${r.negotiationOrigin}/100</b></div><div class="progress"><span style="width:${r.negotiationOrigin}%"></span></div></div><div><div style="display:flex;justify-content:space-between;font-size:10px;margin-bottom:4px"><span>${esc(r.dest)} · frais et taxes</span><b>${r.negotiationDest}/100</b></div><div class="progress"><span style="width:${r.negotiationDest}%"></span></div></div></div><div class="form-actions"><button class="btn small primary" onclick="event.stopPropagation();negotiateRoute('${r.id}','origin')">Négocier ${esc(r.origin)}</button><button class="btn small" onclick="event.stopPropagation();negotiateRoute('${r.id}','dest')">Négocier ${esc(r.dest)}</button></div></div>`).join(''):empty('Aucun dossier en attente','Vos futurs dossiers apparaîtront ici.'))}${panel('Barème de redevances (simulation)',`<div class="vendor-row"><div style="flex:1"><div class="vendor-name">Aéroport majeur</div><div class="vendor-desc">Hub international, créneaux tendus</div></div><div class="vendor-data"><b>2 800–3 600 €</b><small>par rotation</small></div></div><div class="vendor-row"><div style="flex:1"><div class="vendor-name">Aéroport moyen</div><div class="vendor-desc">Plateforme régionale</div></div><div class="vendor-data"><b>1 500–2 000 €</b><small>par rotation</small></div></div><div class="vendor-row"><div style="flex:1"><div class="vendor-name">Petite plateforme</div><div class="vendor-desc">Faible niveau de redevances</div></div><div class="vendor-data"><b>≈ 850 €</b><small>par rotation</small></div></div><div class="callout info" style="margin-top:12px">Ces montants sont des valeurs de jeu. Les redevances officielles varient selon l’aéroport, l’appareil, la masse, l’heure, les services et le contrat.</div>`,`Directeurs d’aéroport · négociation commerciale`)}${panel('Outils de réseau',`<button class="btn wide" onclick="setTab('map')">Ouvrir la carte interactive</button><button class="btn wide" style="margin-top:8px" onclick="exportCSV('routes')">Exporter les lignes en CSV</button>`,`Gestion et analyse du réseau`)}</div></div>`}
function renderMapPage(){return pageHead('Atlas · aéroports · développement de réseau','Carte du monde','Explorez les plateformes, recherchez un code IATA ou un nom, puis sélectionnez un aéroport pour construire une liaison. La base mondiale se charge depuis une source ouverte si le réseau le permet.','<button class="btn" onclick="setTab(\'routes\')">＋ Créer une ligne</button>')+`<div class="map-layout"><section class="panel"><div class="map-toolbar"><input class="search-input" id="map-search" placeholder="Rechercher une ville, un pays, un aéroport ou IATA…" oninput="searchAirportOnMap(this.value)"><button class="btn small" onclick="fitWorld()">Monde entier</button><button class="btn small" onclick="loadAirports(true)">↻ Charger la base mondiale</button></div><div class="map-shell" id="map"></div><div class="panel-body" style="padding:11px 14px"><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:10px;color:var(--muted)"><span>© OpenStreetMap · visualisation Leaflet</span><span id="map-status">Carte en cours de préparation…</span><span>Cliquer un point pour consulter l’aéroport</span></div></div></section><div class="grid" style="align-content:start;gap:15px">${panel('Aéroport sélectionné',`<div id="airport-selected">${mapSelection?airportDetailsHTML(mapSelection):empty('Aucun aéroport sélectionné','Cliquez sur un aéroport de la carte ou recherchez un code dans le champ au-dessus.')}</div>`,`Fiche aéroport`)}${panel('Préparer une route',`<div class="field"><label>Aéroport de départ</label><input id="map-origin" list="airport-list" placeholder="MPL ou nom d’aéroport"></div><div class="field" style="margin-top:10px"><label>Aéroport d’arrivée</label><input id="map-dest" list="airport-list" placeholder="CDG ou nom d’aéroport"></div><button class="btn primary wide" style="margin-top:12px" onclick="routeFromMap()">Préparer le dossier de ligne →</button><div class="sub" style="margin-top:9px">Vous devrez ensuite négocier avec les deux aéroports avant l’ouverture.</div>`,`Planificateur commercial`)}${panel('Votre réseau actuel',S.routes.filter(r=>r.status==='Ouverte').length?S.routes.filter(r=>r.status==='Ouverte').map(r=>`<div class="map-side-item" onclick="focusRoute('${r.id}')"><div style="display:flex;justify-content:space-between;gap:8px"><div>${routeHTML(r)}</div><span class="pill">${r.frequency}/j</span></div><div class="sub">${routeFlag(r)} · ${fmt(r.km)} km</div></div>`).join(''):empty('Réseau encore vide','Ouvrez une ligne dans Gestion des lignes.'),`Liaisons opérées`)}</div></div><p class="footer-note">Les coordonnées aéroportuaires proviennent, lorsque la connexion le permet, d’OurAirports ou d’une base de données dérivée. Les données ouvertes peuvent contenir des erreurs ou des entrées obsolètes ; l’application n’est pas un outil de préparation de vol ni de navigation aéronautique.</p>`}
function airportDetailsHTML(a){return `<div style="display:flex;align-items:center;gap:9px;margin-bottom:13px"><div class="market-logo" style="font-size:12px">${esc(a.iata||a.icao||'AP')}</div><div style="flex:1"><h3 style="margin:0 0 3px;font-size:16px">${esc(a.name)}</h3><div class="sub">${isoFlag(a.country)} ${esc(a.city||'Ville non renseignée')} · ${esc(countryName(a.country))}</div></div></div><div class="grid g2"><div class="mini-kpi"><span>IATA</span><b>${esc(a.iata||'—')}</b></div><div class="mini-kpi"><span>ICAO</span><b>${esc(a.icao||'—')}</b></div><div class="mini-kpi"><span>Latitude</span><b style="font-size:14px">${Number(a.lat).toFixed(3)}</b></div><div class="mini-kpi"><span>Longitude</span><b style="font-size:14px">${Number(a.lon).toFixed(3)}</b></div></div><div class="sub" style="margin-top:12px">Type : ${esc(a.size||a.type||'Aéroport')} · Service programmé : ${a.scheduled===false?'non renseigné':'variable selon données source'}</div><div class="form-actions"><button class="btn primary wide" onclick="useSelectedAirport('origin')">Départ</button><button class="btn wide" onclick="useSelectedAirport('dest')">Arrivée</button></div>`}
function searchAirportOnMap(value){let box=document.getElementById('map-search');if(!value.trim())return;let a=getAirport(value);if(a){selectAirport(a,true);return}let q=value.toLowerCase();let hits=airports.filter(a=>(a.name+' '+(a.city||'')+' '+a.iata+' '+a.icao+' '+a.country).toLowerCase().includes(q)).slice(0,8);if(hits.length&&mapObject){document.getElementById('airport-selected').innerHTML=`<div class="airport-search-results">${hits.map(a=>`<button onclick="selectAirportByCode('${esc(a.iata||a.icao)}',true)">${isoFlag(a.country)} <b>${esc(a.iata||a.icao)}</b> · ${esc(a.name)} <span class="muted">— ${esc(a.city||'')}</span></button>`).join('')}</div>`;}}
function selectAirportByCode(code,zoom=false){let a=getAirport(code);if(a)selectAirport(a,zoom)}
function selectAirport(a,zoom=false){mapSelection=a;let box=document.getElementById('airport-selected');if(box)box.innerHTML=airportDetailsHTML(a);if(zoom&&mapObject)mapObject.setView([a.lat,a.lon],Math.max(mapObject.getZoom(),7));}

function routeFromMap(){let a=document.getElementById('map-origin').value,b=document.getElementById('map-dest').value;if(!a||!b){toast('Renseignez les deux aéroports.','bad');return}setTab('routes');setTimeout(()=>{document.getElementById('route-origin-input').value=a;document.getElementById('route-dest-input').value=b;document.getElementById('route-frequency').focus()},50)}
function fitWorld(){if(mapObject)mapObject.setView([20,0],2)}
function focusRoute(id){let r=getRoute(id);if(!r)return;setTab('map');setTimeout(()=>{let a=getAirport(r.origin),b=getAirport(r.dest);if(a&&b&&mapObject){mapObject.fitBounds([[a.lat,a.lon],[b.lat,b.lon]],{padding:[45,45]});selectAirport(a,false)}},120)}
function initMap(){if(!document.getElementById('map'))return;if(!window.L){let m=document.getElementById('map');m.innerHTML='<div class="empty">La carte nécessite une connexion aux bibliothèques cartographiques. Vous pouvez tout de même préparer les lignes dans l’onglet Gestion des lignes.</div>';return}if(mapObject){mapObject.invalidateSize();return}mapObject=L.map('map',{worldCopyJump:true}).setView([25,8],2);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:'&copy; OpenStreetMap'}).addTo(mapObject);if(L.markerClusterGroup)mapClusters=L.markerClusterGroup({chunkedLoading:true,showCoverageOnHover:false,maxClusterRadius:45});else mapClusters=L.layerGroup();mapClusters.addTo(mapObject);mapRouteLayer=L.layerGroup().addTo(mapObject);if(document.getElementById('map-status'))document.getElementById('map-status').textContent=`${fmt(airports.length)} aéroports disponibles · ${airportSource}`;drawAirportMarkers();}
function drawAirportMarkers(){if(!mapClusters||!window.L)return;mapClusters.clearLayers();if(mapRouteLayer)mapRouteLayer.clearLayers();mapMarkers=[];let list=airports.filter(a=>Number.isFinite(a.lat)&&Number.isFinite(a.lon)&&(a.iata||a.icao));list.forEach(a=>{let m=L.circleMarker([a.lat,a.lon],{radius:a.size==='large'?4:2.5,fillColor:a.size==='large'?'#dc6d3d':'#126f68',color:'#fffdf8',weight:.7,opacity:.9,fillOpacity:.85});m.bindTooltip(`${a.iata||a.icao} · ${a.name}`,{direction:'top',sticky:true});m.on('click',()=>selectAirport(a,false));m.addTo(mapClusters);mapMarkers.push(m)});for(let r of S.routes.filter(x=>x.status==='Ouverte')){let a=getAirport(r.origin),b=getAirport(r.dest);if(a&&b){let line=L.polyline([[a.lat,a.lon],[b.lat,b.lon]],{color:'#dc6d3d',weight:2.5,opacity:.85,dashArray:'6 5'});line.bindTooltip(`${r.origin} → ${r.dest}`);line.addTo(mapRouteLayer||mapObject)}}let s=document.getElementById('map-status');if(s)s.textContent=`${fmt(list.length)} aéroports · ${airportSource}`;}
function loadAirports(force=false){if(airportsLoading||airportLoaded&&!force)return;airportsLoading=true;const url='https://raw.githubusercontent.com/davidmegginson/ourairports-data/main/airports.csv';fetch(url,{cache:force?'reload':'default'}).then(r=>{if(!r.ok)throw Error('Base aéroportuaire indisponible');return r.text()}).then(csv=>{let rows=parseCSV(csv);if(rows.length<100)throw Error('Base invalide');let h=rows[0],idx={};h.forEach((x,i)=>idx[x]=i);let data=[];for(let i=1;i<rows.length;i++){let r=rows[i];if(r.length<h.length&&r.length<12)continue;let iata=(r[idx.iata_code]||'').trim(),icao=(r[idx.icao_code]||'').trim(),type=(r[idx.type]||'').trim();if((!iata&&!icao)||!['large_airport','medium_airport','small_airport'].includes(type))continue;let lat=Number(r[idx.latitude_deg]),lon=Number(r[idx.longitude_deg]);if(!Number.isFinite(lat)||!Number.isFinite(lon))continue;data.push({iata,icao,name:r[idx.name]||iata,city:r[idx.municipality]||'',country:r[idx.iso_country]||'',lat,lon,size:type==='large_airport'?'large':type==='medium_airport'?'medium':'small',type,scheduled:(r[idx.scheduled_service]||'').toLowerCase()==='yes'})}if(data.length<100)throw Error('Base trop courte');airports=data;airportSource='OurAirports';airportLoaded=true;document.getElementById('airport-list').innerHTML=data.map(a=>`<option value="${esc(a.iata||a.icao)} — ${esc(a.name)}${a.city?', '+esc(a.city):''}"></option>`).join('');if(activeTab==='map'){if(mapObject){drawAirportMarkers();let s=document.getElementById('map-status');if(s)s.textContent=`${fmt(airports.length)} aéroports · OurAirports`}else setTimeout(initMap,100)}if(activeTab==='routes'){let el=document.querySelector('.sub');}toast(`Base mondiale chargée : ${fmt(airports.length)} aéroports.`);}).catch(err=>{airportSource='base intégrée (mode hors ligne)';console.warn(err);if(force)toast('Impossible de télécharger la base mondiale. La base intégrée reste disponible.','bad')}).finally(()=>{airportsLoading=false;});}
function parseCSV(text){let rows=[],row=[],cell='',quote=false;for(let i=0;i<text.length;i++){let c=text[i];if(c==='"'){if(quote&&text[i+1]==='"'){cell+='"';i++}else quote=!quote}else if(c===','&&!quote){row.push(cell);cell=''}else if((c==='\n'||c==='\r')&&!quote){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cell);if(row.some(v=>v!==''))rows.push(row);row=[];cell=''}else cell+=c}row.push(cell);if(row.some(v=>v!==''))rows.push(row);return rows}

function negotiateRoute(id,side){let r=getRoute(id);if(!r)return;let airportCode=side==='origin'?r.origin:r.dest,feeKey=side==='origin'?'feeOrigin':'feeDest',taxKey=side==='origin'?'taxOrigin':'taxDest',relKey=side==='origin'?'negotiationOrigin':'negotiationDest';let airport=getAirport(airportCode);let baseFee=r[feeKey],baseTax=r[taxKey];modal(`Négociation · ${airportCode}`,`<div class="callout info" style="margin-bottom:14px">Vous rencontrez la direction de ${esc(airport?.name||airportCode)} pour négocier les redevances, les taxes et les conditions d’escale pour la ligne ${esc(r.origin)}–${esc(r.dest)}.</div><div class="grid g2" style="margin-bottom:15px"><div class="mini-kpi"><span>Redevance actuelle</span><b>${eur(baseFee)}</b></div><div class="mini-kpi"><span>Taxes actuelles (simulation)</span><b>${eur(baseTax)}</b></div></div><form onsubmit="submitAirportNegotiation(event,'${id}','${side}')"><div class="field"><label>Réduction demandée sur les frais (%)</label><input type="range" min="0" max="35" value="15" id="airport-discount" oninput="document.getElementById('airport-discount-value').textContent=this.value+' % · nouveau total estimé '+eur((${baseFee}+${baseTax})*(1-this.value/100))"><b id="airport-discount-value">15 % · nouveau total estimé ${eur((baseFee+baseTax)*.85)}</b></div><div class="field" style="margin-top:14px"><label>Engagement commercial</label><select id="airport-commit"><option value="1">Début prudent · 1 vol/jour</option><option value="2" selected>Régulier · fréquence prévue</option><option value="3">Développement · trafic croissant</option><option value="4">Partenaire stratégique · visibilité et emploi local</option></select></div><div class="field" style="margin-top:14px"><label>Durée demandée</label><select id="airport-term"><option value="12">12 semaines</option><option value="26">26 semaines</option><option value="52" selected>52 semaines</option><option value="104">2 ans (simulation)</option></select></div><div class="form-actions"><butt function submitAirportNegotiation(e,id,side){e.preventDefault();let r=getRoute(id);if(!r)return;let discount=Number(document.getElementById('airport-discount').value),commit=Number(document.getElementById('airport-commit').value),term=Number(document.getElementById('airport-term').value),key=side==='origin'?'negotiationOrigin':'negotiationDest',feeKey=side==='origin'?'feeOrigin':'feeDest',taxKey=side==='origin'?'taxOrigin':'taxDest';let relation=r[key],skill=S.people.some(p=>p.job==='RH'&&p.status==='Actif')?4:0;let chance=Math.max(.08,Math.min(.96,.55+relation/230+S.reputation/650+skill/100+(commit-2)*.07-discount/120+(term-52)/1500));let roll=Math.random();if(roll<chance){r[feeKey]=Math.round(r[feeKey]*(1-discount/100));r[taxKey]=Math.round(r[taxKey]*(1-discount/100));r[key]=Math.min(100,relation+18+commit*3+Math.round(discount/2));r['term'+(side==='origin'?'Origin':'Dest')]=term;S.company.brandScore=Math.min(100,S.company.brandScore+1);log('Accord aéroportuaire obtenu',`${side==='origin'?r.origin:r.dest} accepte une réduction de ${discount}% sur les frais négociés pour la ligne ${r.origin}–${r.dest}.`,'Réseau');toast('Accord obtenu : frais et taxes revus à la baisse.')}else{r[key]=Math.min(100,relation+8+commit*2);log('Contre-proposition aéroportuaire',`La direction de ${side==='origin'?r.origin:r.dest} demande de nouveaux engagements avant de consentir la remise.`,'Réseau');toast('Contre-proposition : renforcez le dossier ou revenez la semaine prochaine.','bad')}if(r.negotiationOrigin>=60&&r.negotiationDest>=60&&r.status!=='Ouverte'){r.status='Ouverte';r.autoSchedule=true;if(!r.aircraft&&S.fleet.length)r.aircraft=S.fleet[0].id;log('Nouvelle ligne ouverte',`La ligne ${r.origin}–${r.dest} est autorisée dans la simulation ; générez ou ajustez les vols dans le planning.`,'Réseau');toast('Ligne ouverte ! Pensez à planifier les vols et à affecter un appareil.')}closeModal();scheduleSave();render()}

function estimateRouteMinutes(route,plane){

  let km=Number(route.distanceKm||route.distance||route.km||0);

function weeklyClose(){let renegotiable=S.suppliers.filter(s=>s.lastOfferWeek!==S.week);if(renegotiable.length)toast(`Nouvelle semaine : ${renegotiable.length} contrat(s) fournisseur à renégocier.`);if(S.people.some(p=>p.morale<35&&p.status==='Actif')){S.reputation=Math.max(0,S.reputation-1);log('Climat social sous tension','Plusieurs salariés ont un moral faible. Vérifiez les rotations, les heures et les repos.','RH')}S.weeklyStats.push({week:S.week,cash:S.cash,passengers:S.passengers,profit:S.revenueTotal-S.costTotal});if(S.weeklyStats.length>52)S.weeklyStats.shift();log('Comité hebdomadaire',`Semaine ${S.week} : ${S.flightsCompleted} vol(s) réalisés au total, ${fmt(S.passengers)} passagers transportés.`,'Direction')}
function advanceWeek(){selectedPlanningDay=null;if(!confirm('Simuler la semaine entière ? Tous les vols programmés des 7 prochains jours seront exécutés automatiquement.'))return;let until=S.day+7;let net=0;while(S.day<until){let before=S.cash;let today=S.flights.filter(f=>f.day===S.day&&f.status==='Programmé');today.forEach(f=>operateFlight(f));let interest=S.debt*S.interest/365;if(interest>0)moneyTxn('Intérêts bancaires quotidiens',-interest,'Financement');if(S.day%30===0){let payroll=S.people.filter(p=>p.status==='Actif').reduce((n,p)=>n+p.salary,0),leases=S.fleet.reduce((n,a)=>n+a.monthlyLease,0);if(payroll)moneyTxn('Paie mensuelle et charges sociales',-payroll*1.36,'Personnel');if(leases)moneyTxn('Loyers mensuels',-leases,'Leasing')}if(S.day%7===0){S.week++;weeklyClose()}S.day++;refreshDailySchedule();S.people.forEach(p=>{p.fatigue=Math.max(0,Math.min(100,p.fatigue-1))});net+=S.cash-before}log('Simulation accélérée',`Semaine avancée. Variation de trésorerie : ${eur(net)}.`,'Direction');scheduleSave();render();toast(`Semaine simulée · variation de trésorerie ${eur(net)}.`)}
function renderPeople(){let active=S.people.filter(p=>p.status==='Actif');return pageHead('Ressources humaines · effectifs','Personnel','Recrutez des PNT, PNC, agents d’escale, agents de piste, techniciens et responsables. Chaque salarié possède un dossier individuel, des heures, des repos et un niveau de fatigue.','<button class="btn primary" onclick="recruitCrewBatch()">＋ Recruter une équipe (2 PNT + 4 PNC)</button><button class="btn" onclick="openHireForm()">Recrutement individuel</button><button class="btn" onclick="setTab(\'hr\')">Service RH →</button>')+`<div class="grid g4" style="margin-bottom:16px">${metric('Effectif total',active.length,'Salariés actifs','')}${metric('Masse salariale mensuelle',eur(active.reduce((n,p)=>n+p.salary,0)),'Hors charges employeur','orange')}${metric('Moral moyen',pct(active.length?active.reduce((n,p)=>n+p.morale,0)/active.length:0),'Indicateur social','blue')}${metric('Fatigue moyenne',pct(active.length?active.reduce((n,p)=>n+p.fatigue,0)/active.length:0),'Surveillance des rotations','gold')}</div><section class="panel"><div class="panel-head"><div><h2>Registre du personnel</h2><p>Identité, poste, qualification, rémunération et affectations.</p></div><div class="table-actions"><button class="btn small" onclick="exportCSV('people')">Exporter CSV</button><button class="btn small" onclick="openHireForm()">＋ Ajouter</button></div></div><div class="map-toolbar"><input class="search-input" placeholder="Rechercher un nom, prénom, matricule…" oninput="filterPeople(this.value)" id="people-search"><select class="search-input" style="max-width:180px" onchange="filterPeople(document.getElementById('people-search').value,this.value)" id="people-filter"><option value="all">Tous les postes</option>${['PNT','PNC','AGENT D’ESCALE','AGENT DE PISTE','TECHNICIEN','RH'].map(j=>`<option>${j}</option>`).join('')}</select></div><div class="table-wrap"><table><thead><tr><th>Salarié</th><th>Fonction</th><th>Qualification</th><th>Contrat</th><th>Salaire brut / mois</th><th>Moral</th><th>Fatigue</th><th>Heures</th><th>Statut</th><th></th></tr></thead><tbody id="people-tbody">${peopleRows(S.people)}</tbody></table></div></section><div class="grid g2" style="margin-top:15px">${panel('Répartition par métier',`<div class="grid g2">${['PNT','PNC','AGENT D’ESCALE','AGENT DE PISTE','TECHNICIEN','RH'].map(j=>`<div class="mini-kpi"><span>${j}</span><b>${active.filter(p=>p.job===j).length}</b><div class="progress" style="margin-top:8px"><span style="width:${active.length?active.filter(p=>p.job===j).length/active.length*100:0}%"></span></div></div>`).join('')}</div>`,`Structure des effectifs`)}${panel('Recommandations RH',`<div class="timeline">${[{title:'PNT',body:'Deux pilotes sont nécessaires par vol dans les règles simplifiées du jeu.'},{title:'PNC',body:'L’effectif cabine augmente avec la capacité de l’appareil.'},{title:'Équilibre social',body:'Une fatigue forte réduit le moral. Prévoyez des jours de repos et des rotations.'},{title:'Masse salariale',body:'Le simulateur enregistre la paie mensuelle et un coefficient simplifié de charges patronales.'}].map((x,i)=>`<div class="timeline-item"><div class="timeline-time">${['OPS','CAB','QVT','PAIE'][i]}</div><div class="timeline-rail"><div class="timeline-dot"></div><div class="timeline-stem"></div></div><div class="timeline-text"><b>${x.title}</b><p>${x.body}</p></div></div>`).join('')}</div>`,`Rappels de gestion`)}</div>`}
function peopleRows(items){return items.map(p=>`<tr data-person-row="${esc(p.id)}"><td><div class="roster-name"><div class="initials">${esc((p.first[0]||'')+(p.last[0]||''))}</div><div><b>${esc(p.first)} ${esc(p.last)}</b><div class="sub">${esc(p.id)} · ${esc(p.base)}</div></div></div></td><td><b>${esc(p.job)}</b><div class="sub">${esc(p.title)}</div></td><td>${esc(p.license)}</td><td>${esc(p.contract)}<div class="sub">Repos : ${p.leave} j</div></td><td class="money">${eur(p.salary)}</td><td><span class="pill ${p.morale<40?'red':p.morale<60?'orange':'green'}">${p.morale}/100</span></td><td><span class="pill ${p.fatigue>75?'red':p.fatigue>50?'orange':'green'}">${p.fatigue}/100</span></td><td>${fmt(p.hours)} h</td><td><span class="pill ${p.status==='Actif'?'green':'orange'}">${esc(p.status)}</span></td><td><button class="btn small" onclick="employeeProfile('${p.id}')">Dossier</button></td></tr>`).join('')||`<tr><td colspan="10">${empty('Aucun salarié','Recrutez la première personne de votre compagnie.')}</td></tr>`}
function filterPeople(q='',job='all'){q=q.toLowerCase();let items=S.people.filter(p=>(job==='all'||p.job===job)&&(`${p.first} ${p.last} ${p.job} ${p.id} ${p.license}`).toLowerCase().includes(q));let body=document.getElementById('people-tbody');if(body)body.innerHTML=peopleRows(items)}
function recruitCrewBatch(){const specs=[{job:'PNT',title:'Commandant de bord',salary:6800},{job:'PNT',title:'Officier pilote',salary:4600},{job:'PNC',title:'Chef de cabine',salary:3300},{job:'PNC',title:'Personnel cabine',salary:2550},{job:'PNC',title:'Personnel cabine',salary:2550},{job:'PNC',title:'Personnel cabine',salary:2550}];const newPeople=[];for(const spec of specs){const name=uniqueStaffName();const p=makePerson(spec.job,name.first,name.last,spec.salary);p.title=spec.title;p.base=(S.company.base||'MPL').toUpperCase();p.joined=S.day;p.contract='CDI';p.status='Actif';newPeople.push(p);S.people.unshift(p)}newPeople.forEach(p=>log('Embauche par équipe',`${p.first} ${p.last} rejoint l’effectif comme ${p.title}. Salaire brut simulé : ${eur(p.salary)}/mois.`,'RH'));S.messages.unshift({id:uid('MSG'),day:S.day,from:'Direction RH',to:'Direction',subject:'Équipe recrutée',text:`Équipe créée automatiquement : 2 PNT et 4 PNC. Identités : ${newPeople.map(p=>p.first+' '+p.last).join(', ')}. Vérifiez les plannings avant de programmer les vols.`,status:'Non lu',priority:'Normale'});scheduleSave();render();toast('Équipe recrutée : 2 PNT + 4 PNC, avec 6 identités uniques.');}

function openHireForm(){modal('Recruter un salarié',`<form onsubmit="hireEmployee(event)"><div class="form-grid"><div class="field"><label>Prénom</label><input id="hire-first" required placeholder="Ex. Camille" maxlength="40"></div><div class="field"><label>Nom</label><input id="hire-last" required placeholder="Ex. Martin" maxlength="50"></div><div class="field"><label>Service / métier</label><select id="hire-job" onchange="updateSalaryHint()">${staffTemplates.map(t=>`<option value="${t[0]}">${t[0]} · ${t[1]}</option>`).join('')}</select></div><div class="field"><label>Fonction précise</label><input id="hire-title" placeholder="Fonction dans l’organigramme"></div><div class="field"><label>Salaire brut mensuel (€)</label><input id="hire-salary" type="number" value="2550" min="1200" max="30000" required></div><div class="field"><label>Contrat</label><select id="hire-contract"><option>CDI</option><option>CDD</option><option>Intérim</option><option>Temps partiel</option><option>Prestataire</option></select></div><div class="field"><label>Base opérationnelle</label><input id="hire-base" value="${esc(S.company.base)}" maxlength="4"></div><div class="field"><label>Qualification / habilitation</label><input id="hire-license" placeholder="Ex. ATPL(A) · A320"></div></div><div class="callout info" style="margin-top:13px">Le recrutement augmente la masse salariale. Les qualifications sont renseignées dans le dossier de simulation et ne certifient aucune compétence réelle.</div><div class="form-actions"><button class="btn primary" type="submit">Valider l’embauche</button></div></form>`,`<button class="btn" onclick="closeModal()">Annuler</button>`)}
function updateSalaryHint(){let j=document.getElementById('hire-job')?.value,t=staffTemplates.find(t=>t[0]===j);if(t)document.getElementById('hire-salary').value=t[2];if(j==='PNT')document.getElementById('hire-license').placeholder='ATPL(A) · Type avion';else if(j==='PNC')document.getElementById('hire-license').placeholder='CCA valide';else document.getElementById('hire-license').placeholder='Habilitation opérationnelle'}
function hireEmployee(e){e.preventDefault();let job=document.getElementById('hire-job').value,person=makePerson(job,document.getElementById('hire-first').value.trim(),document.getElementById('hire-last').value.trim(),Number(document.getElementById('hire-salary').value));person.title=document.getElementById('hire-title').value.trim()||person.title;person.contract=document.getElementById('hire-contract').value;person.base=(document.getElementById('hire-base').value||S.company.base).toUpperCase();person.license=document.getElementById('hire-license').value.trim()||person.license;person.joined=S.day;S.people.unshift(person);log('Embauche',`${person.first} ${person.last} rejoint l’effectif comme ${person.title}. Salaire brut : ${eur(person.salary)}/mois.`,'RH');scheduleSave();closeModal();render();toast(`${person.first} ${person.last} ajouté(e) au registre.`)}
function employeeProfile(id){let p=getStaff(id);if(!p)return;let assignments=S.flights.filter(f=>(f.crew||[]).includes(id)).slice(-8).reverse();modal(`Dossier salarié · ${p.first} ${p.last}`,`<div class="hr-profile"><div class="profile-photo">${esc(p.first[0]+p.last[0])}</div><div><div class="eyebrow">${esc(p.job)} · ${esc(p.id)}</div><h2 style="margin:5px 0 6px;font-size:24px">${esc(p.first)} ${esc(p.last)}</h2><div class="sub">${esc(p.title)} · ${esc(p.base)} · embauche J${p.joined}</div><div style="margin-top:9px;display:flex;gap:6px;flex-wrap:wrap"><span class="pill ${p.status==='Actif'?'green':'orange'}">${esc(p.status)}</span><span class="pill">${esc(p.contract)}</span><span class="pill blue">${esc(p.license)}</span></div></div></div><div class="grid g3" style="margin:16px 0"><div class="mini-kpi"><span>Salaire brut / mois</span><b>${eur(p.salary)}</b></div><div class="mini-kpi"><span>Moral</span><b>${p.morale}/100</b></div><div class="mini-kpi"><span>Fatigue</span><b>${p.fatigue}/100</b></div><div class="mini-kpi"><span>Heures enregistrées</span><b>${fmt(p.hours)} h</b></div><div class="mini-kpi"><span>Congés disponibles</span><b>${p.leave} j</b></div><div class="mini-kpi"><span>Formation</span><b>${p.training}/5</b></div></div><h3 style="font-size:14px">Historique de rotations</h3>${assignments.length?`<div class="table-wrap"><table><thead><tr><th>Jour</th><th>Heure</th><th>Ligne</th><th>État</th></tr></thead><tbody>${assignments.map(f=>{let r=getRoute(f.route);return `<tr><td>J${f.day}</td><td>${esc(f.time)}</td><td>${r?esc(r.origin)+'–'+esc(r.dest):'—'}</td><td>${esc(f.status)}</td></tr>`}).join('')}</tbody></table></div>`:'<p class="muted" style="font-size:12px">Aucune rotation associée.</p>'}<div class="form-actions"><button class="btn primary" onclick="raiseEmployee('${p.id}');closeModal()">Proposer une augmentation</button><button class="btn" onclick="employeeTraining('${p.id}');closeModal()">Planifier une formation</button><button class="btn" onclick="employeeLeave('${p.id}');closeModal()">Congés / repos</button><button class="btn danger" onclick="dismissEmployee('${p.id}');closeModal()">Fin de contrat</button></div>`,`<button class="btn" onclick="closeModal()">Fermer</button>`)}
function raiseEmployee(id){let p=getStaff(id);if(!p)return;modal('Entretien de rémunération',`<form onsubmit="saveRaise(event,'${id}')"><div class="callout info" style="margin-bottom:12px">Salarié : ${esc(p.first)} ${esc(p.last)} · Salaire brut actuel : ${eur(p.salary)} par mois.</div><div class="field"><label>Nouveau salaire brut mensuel (€)</label><input id="raise-salary" type="number" min="${Math.round(p.salary*.9)}" max="50000" value="${Math.round(p.salary*1.06)}"></div><div class="field" style="margin-top:10px"><label>Motif</label><select id="raise-reason"><option>Performance et ancienneté</option><option>Promotion</option><option>Rétention de compétence</option><option>Alignement marché (simulation)</option></select></div><div class="form-actions"><button class="btn primary" type="submit">Valider la proposition</button></div></form>`,`<button class="btn" onclick="closeModal()">Annuler</button>`)}
function saveRaise(e,id){e.preventDefault();let p=getStaff(id),old=p.salary;p.salary=Number(document.getElementById('raise-salary').value);let reason=document.getElementById('raise-reason').value;p.morale=Math.min(100,p.morale+4);moneyTxn(`Prime ponctuelle / ajustement RH · ${p.first} ${p.last}`,-Math.max(0,p.salary-old)*.5,'Personnel');log('Évolution salariale',`${p.first} ${p.last} : salaire brut passé de ${eur(old)} à ${eur(p.salary)}. Motif : ${reason}.`,'RH');scheduleSave();closeModal();render();toast('Salaire mis à jour.')}
function employeeTraining(id){let p=getStaff(id);if(!p)return;let cost=p.job==='PNT'?6500:p.job==='PNC'?1800:950;modal('Plan de formation',`<p class="muted" style="line-height:1.6">Formation de ${esc(p.first)} ${esc(p.last)} · ${esc(p.title)}. La session améliore les compétences simulées, le moral et l’employabilité.</p><div class="grid g2"><div class="mini-kpi"><span>Coût de la session</span><b>${eur(cost)}</b></div><div class="mini-kpi"><span>Palier actuel</span><b>${p.training}/5</b></div></div><form onsubmit="completeTraining(event,'${id}',${cost})"><div class="field" style="margin-top:12px"><label>Module</label><select id="training-module"><option>Recyclage / habilitations</option><option>Leadership et coordination</option><option>Sécurité et facteurs humains</option><option>Formation métier avancée</option></select></div><div class="form-actions"><button class="btn primary" type="submit">Inscrire à la formation</button></div></form>`,`<button class="btn" onclick="closeModal()">Annuler</button>`)}
function completeTraining(e,id,cost){e.preventDefault();let p=getStaff(id);if(S.cash<cost){toast('Trésorerie insuffisante pour financer la formation.','bad');return}let module=document.getElementById('training-module').value;moneyTxn(`Formation · ${p.first} ${p.last}`,-cost,'RH');p.training=Math.min(5,p.training+1);p.morale=Math.min(100,p.morale+6);p.fatigue=Math.max(0,p.fatigue-5);p.license=p.license.includes('Formation')?p.license:p.license+' · Formation '+p.training;log('Formation réalisée',`${p.first} ${p.last} a suivi : ${module}.`,'RH');closeModal();scheduleSave();render();toast('Formation enregistrée.')}
function employeeLeave(id){let p=getStaff(id);if(!p)return;modal('Repos et congés',`<form onsubmit="saveLeave(event,'${id}')"><div class="grid g2"><div class="mini-kpi"><span>Congés disponibles</span><b>${p.leave} jours</b></div><div class="mini-kpi"><span>Repos préférés</span><b>${(p.daysOff||[]).join(', ')}</b></div></div><div class="field" style="margin-top:12px"><label>Type de demande</label><select id="leave-type"><option value="paid">Congé payé</option><option value="rest">Repos / récupération</option><option value="sick">Absence maladie (simulation)</option></select></div><div class="field" style="margin-top:10px"><label>Nombre de jours</label><input id="leave-days" type="number" min="1" max="14" value="2"></div><div class="field" style="margin-top:10px"><label>Commentaire RH</label><input id="leave-note" placeholder="Motif ou note confidentielle"></div><div class="form-actions"><button class="btn primary" type="submit">Enregistrer la demande</button></div></form>`,`<button class="btn" onclick="closeModal()">Annuler</button>`)}
function saveLeave(e,id){e.preventDefault();let p=getStaff(id),type=document.getElementById('leave-type').value,days=Number(document.getElementById('leave-days').value);if(type==='paid'&&days>p.leave){toast('Solde de congés insuffisant.','bad');return}if(type==='paid')p.leave-=days;p.fatigue=Math.max(0,p.fatigue-days*5);p.morale=Math.min(100,p.morale+days*2);p.rotation=`Absence ${type} · ${days}j`;log('Demande d’absence enregistrée',`${p.first} ${p.last} : ${type}, ${days} jour(s). ${document.getElementById('leave-note').value}`,'RH');scheduleSave();closeModal();render();toast('Demande d’absence enregistrée dans le dossier.')}
function dismissEmployee(id){let p=getStaff(id);if(!p)return;if(!confirm(`Mettre fin au contrat de ${p.first} ${p.last} ? Cette action retire la personne des prochains équipages.`))return;p.status='Sorti';p.morale=0;log('Sortie d’effectif',`${p.first} ${p.last} (${p.job}) a quitté l’effectif dans la simulation.`,'RH');scheduleSave();render();toast('Dossier salarié clôturé.');}
function renderHR(){let active=S.people.filter(p=>p.status==='Actif'),salary=active.reduce((n,p)=>n+p.salary,0),tired=active.filter(p=>p.fatigue>70),lowMorale=active.filter(p=>p.morale<45);return pageHead('Direction des ressources humaines','Service RH','Un espace RH renforcé : organigramme, contrats, rémunérations, temps de service, repos, fatigue, formations, absences et planning des rotations.','<button class="btn primary" onclick="recruitCrewBatch()">＋ Équipe type (2 PNT + 4 PNC)</button><button class="btn" onclick="openHireForm()">Recruter individuellement</button><button class="btn" onclick="openPayrollReport()">Bulletin de paie</button>')+`<div class="grid g4" style="margin-bottom:16px">${metric('Salariés actifs',active.length,'Tous métiers','')}${metric('Masse brute mensuelle',eur(salary),'Hors charges employeur','orange')}${metric('Charges sociales estimées',eur(salary*.36),'Coefficient de simulation','blue')}${metric('Postes à surveiller',tired.length+lowMorale.length,'Fatigue forte ou moral bas','gold')}</div><div class="grid g2"><div class="grid" style="align-content:start;gap:15px">${panel('Planning individuel des équipes',active.length?`<div class="table-wrap"><table><thead><tr><th>Salarié</th><th>Poste</th><th>Rotation / disponibilité</th><th>Fatigue</th><th></th></tr></thead><tbody>${active.map(p=>`<tr><td><b>${esc(p.first)} ${esc(p.last)}</b><div class="sub">${esc(p.id)}</div></td><td>${esc(p.job)}</td><td>${esc(p.rotation||'Régulière')}<div class="sub">Repos préférés : ${(p.daysOff||[]).join(', ')}</div></td><td><span class="pill ${p.fatigue>70?'red':p.fatigue>45?'orange':'green'}">${p.fatigue}/100</span></td><td><button class="btn small" onclick="editRoster('${p.id}')">Planning</button></td></tr>`).join('')}</tbody></table></div>`:empty('Aucun salarié','Recrutez avant de configurer les plannings.'),`Plannings, jours de repos et roulements`)}${panel('Prévision des charges',`<div class="grid g2"><div class="mini-kpi"><span>Salaires bruts</span><b>${eur(salary)}</b></div><div class="mini-kpi"><span>Charges employeur (jeu)</span><b>${eur(salary*.36)}</b></div><div class="mini-kpi"><span>Coût employeur estimé</span><b>${eur(salary*1.36)}</b></div><div class="mini-kpi"><span>Coût annuel estimé</span><b>${moneyM(salary*1.36*12)}</b></div></div><div class="callout warning" style="margin-top:12px">La paie est simulée, sans bulletin légal ni calcul de cotisations réglementaires. Utilisez une solution de paie agréée pour une véritable entreprise.</div>`,`Scénario de coût de personnel`)}</div><div class="grid" style="align-content:start;gap:15px">${panel('Tableau de bord social',`<div class="grid g2"><div class="mini-kpi"><span>Moral moyen</span><b>${fmt(active.length?active.reduce((n,p)=>n+p.morale,0)/active.length:0)}/100</b></div><div class="mini-kpi"><span>Fatigue moyenne</span><b>${fmt(active.length?active.reduce((n,p)=>n+p.fatigue,0)/active.length:0)}/100</b></div><div class="mini-kpi"><span>Formation moyenne</span><b>${fmt(active.length?active.reduce((n,p)=>n+p.training,0)/active.length:0)}/5</b></div><div class="mini-kpi"><span>Congés restants</span><b>${fmt(active.reduce((n,p)=>n+p.leave,0))} j</b></div></div><h3 style="font-size:13px;margin:18px 0 10px">Signaux individuels</h3>${tired.slice(0,5).map(p=>`<div class="vendor-row"><div class="initials">${esc(p.first[0]+p.last[0])}</div><div style="flex:1"><div class="vendor-name">${esc(p.first)} ${esc(p.last)}</div><div class="vendor-desc">Fatigue : ${p.fatigue}/100 · ${esc(p.job)}</div></div><button class="btn small" onclick="employeeProfile('${p.id}')">Voir</button></div>`).join('')||'<p class="muted" style="font-size:12px">Aucun salarié en fatigue forte.</p>'}`,`Prévention des risques et suivi`)}${panel('Outils RH',`<button class="btn wide" onclick="openPayrollReport()">Calculer la prochaine paie</button><button class="btn wide" style="margin-top:8px" onclick="openHireForm()">Créer un dossier salarié</button><button class="btn wide" style="margin-top:8px" onclick="setTab('flights')">Vérifier le planning de vols</button><button class="btn wide" style="margin-top:8px" onclick="exportCSV('people')">Télécharger le registre CSV</button>`,`Administration RH`)}</div></div>`}
function editRoster(id){let p=getStaff(id);if(!p)return;modal(`Planning RH · ${p.first} ${p.last}`,`<form onsubmit="saveRoster(event,'${id}')"><div class="field"><label>Rotation / roulement</label><select id="roster-pattern">${['Régulière','Matin','Après-midi','Nuit','Week-end','Rotation long-courrier','Réserve','Formation','Congé planifié'].map(x=>`<option ${p.rotation===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field" style="margin-top:11px"><label>Base</label><input id="roster-base" value="${esc(p.base)}"></div><div class="field" style="margin-top:11px"><label>Jours de repos (0 = dimanche, 6 = samedi)</label><div class="grid g4" style="margin-top:4px">${['Dim','Lun','Mar','Mer','Jeu','Ven','Sam'].map((d,i)=>`<label class="check-line"><input type="checkbox" class="roster-day" value="${i}" ${(p.daysOff||[]).includes(i)?'checked':''}>${d}</label>`).join('')}</div></div><div class="field" style="margin-top:11px"><label>Planning note / affectation</label><textarea id="roster-note" placeholder="Ex. réserve, rotation assignée, restrictions…">${esc(p.rosterNote||'')}</textarea></div><div class="form-actions"><button class="btn primary" type="submit">Enregistrer le planning</button></div></form>`,`<button class="btn" onclick="closeModal()">Fermer</button>`)}
function saveRoster(e,id){e.preventDefault();let p=getStaff(id);p.rotation=document.getElementById('roster-pattern').value;p.base=document.getElementById('roster-base').value.toUpperCase();p.daysOff=Array.from(document.querySelectorAll('.roster-day:checked')).map(el=>Number(el.value));p.rosterNote=document.getElementById('roster-note').value;log('Planning RH modifié',`Le roulement de ${p.first} ${p.last} est passé à « ${p.rotation} »; repos déclarés : ${p.daysOff.join(', ')}.`,'RH');scheduleSave();closeModal();render();toast('Planning salarié enregistré.')}
function openPayrollReport(){let active=S.people.filter(p=>p.status==='Actif'),gross=active.reduce((n,p)=>n+p.salary,0),charges=gross*.36,netEstimate=gross*.78;modal('Prévision de paie · simulation',`<div class="callout warning" style="margin-bottom:14px">Estimation de jeu uniquement. Ce récapitulatif n’est pas un bulletin de salaire légal et ne remplace pas les règles sociales applicables.</div><div class="grid g2"><div class="mini-kpi"><span>Effectif</span><b>${active.length}</b></div><div class="mini-kpi"><span>Total brut mensuel</span><b>${eur(gross)}</b></div><div class="mini-kpi"><span>Charges employeur estimées</span><b>${eur(charges)}</b></div><div class="mini-kpi"><span>Budget employeur</span><b>${eur(gross+charges)}</b></div><div class="mini-kpi"><span>Net indicatif (78 % brut)</span><b>${eur(netEstimate)}</b></div><div class="mini-kpi"><span>Coût annuel estimé</span><b>${eur((gross+charges)*12)}</b></div></div><div class="form-actions"><button class="btn primary" onclick="exportCSV('payroll')">Exporter la paie en CSV</button></div>`,`<button class="btn" onclick="closeModal()">Fermer</button>`)}
function renderSuppliers(){let cats=['Carburant','Catering','Assistance au sol','Fret','Maintenance'];let weekly=S.suppliers.filter(s=>s.lastOfferWeek!==S.week).length;return pageHead('Achats · contrats · appels d’offres','Fournisseurs','Gérez le carburant, le catering, l’assistance au sol, la manutention et la maintenance. Négociez chaque semaine, comparez les tarifs et verrouillez les conditions par contrat.','<button class="btn primary" onclick="negotiateAllSuppliers()">⇄ Négocier tous les fournisseurs</button>')+`<div class="grid g4" style="margin-bottom:16px">${metric('Partenaires au catalogue',S.suppliers.length,'Prestataires réels référencés','')}${metric('Offres à renégocier',weekly,'Nouvelle semaine de négociation','orange')}${metric('Contrats signés',S.suppliers.filter(s=>s.contract!=='Sans contrat').length,'Accords actifs','blue')}${metric('Économies négociées',eur(S.suppliers.reduce((n,s)=>n+(s.base-s.price),0)),'Comparaison unitaire au prix de base','gold')}</div><div class="callout info" style="margin-bottom:16px">Les noms de sociétés ci-dessous sont réels ; tarifs, remises, relations, résultats de négociation et contrats sont fictifs et servent uniquement à la partie. Les prestations varient selon l’aéroport et le pays.</div><div class="grid g2">${cats.map(cat=>{let items=S.suppliers.filter(s=>s.category===cat);return `<section class="panel"><div class="panel-head"><div><h2>${esc(cat)}</h2><p>${items.length} prestataire(s) · base d’achat</p></div><span class="pill">${cat==='Carburant'?'€/litre':cat==='Catering'?'€/passager':'€/rotation'}</span></div><div class="panel-body">${items.map(s=>`<div class="vendor-row">${logoHTML(s.site,s.short,s.category==='Carburant'?'#225c4b':s.category==='Catering'?'#a85431':s.category==='Assistance au sol'?'#2d5376':s.category==='Maintenance'?'#594b82':'#75571b',48)}<div style="flex:1;min-width:0"><div class="vendor-name">${esc(s.name)}</div><div class="vendor-desc">${esc(s.desc)}</div><div style="display:flex;gap:5px;flex-wrap:wrap;margin-top:6px"><span class="pill ${s.contract!=='Sans contrat'?'green':''}">${esc(s.contract)}</span><span class="pill blue">Relation ${s.rep}/100</span></div></div><div class="vendor-data"><b>${fmt(s.price, false)} ${esc(s.unit.split('/')[0])}</b><small>${s.unit.includes('/')?'/ '+esc(s.unit.split('/').slice(1).join('/')):''}<br><span style="color:var(--green)">${s.discount?'-'+pct(s.discount):'Tarif de base'}</span></small><button class="btn small" style="margin-top:8px" onclick="supplierDetail('${s.id}')">Négocier</button></div></div>`).join('')}</div></section>`}).join('')}</div><div class="section-title"><h2>Clauses contractuelles</h2><div class="rule"></div></div><section class="panel"><div class="table-wrap"><table><thead><tr><th>Prestataire</th><th>Tarif de base</th><th>Tarif négocié</th><th>Remise</th><th>Contrat</th><th>Échéance</th><th></th></tr></thead><tbody>${S.suppliers.map(s=>`<tr><td><b>${esc(s.name)}</b><div class="sub">${esc(s.category)}</div></td><td>${fmt(s.base)} ${esc(s.unit)}</td><td class="money">${fmt(s.price)} ${esc(s.unit)}</td><td><span class="pill ${s.discount>0?'green':'dark'}">${pct(s.discount)}</span></td><td>${esc(s.contract)}</td><td>${s.termWeeks?`S${S.week+s.termWeeks-(s.signedWeek||S.week)}`:'—'}</td><td><button class="btn small" onclick="supplierDetail('${s.id}')">Gérer</button></td></tr>`).join('')}</tbody></table></div></section><p class="footer-note">Acteurs référencés notamment parmi les prestataires répertoriés par des aéroports (assistance, carburant, catering) et les groupes spécialisés de l’aviation. Les prix du jeu ne sont pas les tarifs actuels de ces sociétés.</p>`}
